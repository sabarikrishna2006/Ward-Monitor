<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ward Monitor - Vanilla JS</title>
    <link href="./style.css" rel="stylesheet">
  </head>
  <body class="bg-[#0b1120] text-slate-300 font-sans overflow-hidden">
    <!-- App Container -->
    <div id="app" class="flex h-screen w-full relative">
      
      <!-- Side Nav -->
      <nav class="w-16 bg-[#0f172a] border-r border-slate-800 hidden md:flex flex-col items-center py-4 shrink-0">
         <a href="#" class="w-10 h-10 flex items-center justify-center rounded-xl bg-blue-600/20 text-blue-500 mb-6 border border-blue-500/30 shadow-[0_0_12px_rgba(59,130,246,0.3)]">
            <i data-lucide="activity"></i>
         </a>
         <div class="flex-1 space-y-4">
             <a href="#" class="w-10 h-10 flex items-center justify-center rounded-xl text-white bg-slate-800 border border-slate-600">
               <i data-lucide="users" class="w-5 h-5"></i>
             </a>
             <a href="#" class="w-10 h-10 flex items-center justify-center rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors">
               <i data-lucide="clipboard" class="w-5 h-5"></i>
             </a>
             <a href="#" class="w-10 h-10 flex items-center justify-center rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors">
               <i data-lucide="settings" class="w-5 h-5"></i>
             </a>
         </div>
      </nav>

      <!-- Main Content -->
      <main class="flex-1 flex flex-col min-w-0">
        
        <!-- Header -->
        <header class="h-14 flex items-center justify-between px-4 md:px-6 bg-[#0f172a] border-b border-slate-800 shrink-0">
          <div class="flex items-center space-x-2 md:space-x-4">
            <div class="flex items-center space-x-2">
              <div class="w-7 h-7 rounded bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-[0_0_12px_rgba(59,130,246,0.5)]">
                <i data-lucide="activity" class="text-white w-4 h-4"></i>
              </div>
              <h1 class="text-lg font-bold text-white tracking-wide hidden sm:block">
                EarlyWarning<span class="text-blue-400 font-medium">AI</span>
              </h1>
            </div>
            <div class="h-5 w-px bg-slate-700 hidden sm:block"></div>
            <div class="flex items-center">
              <select id="ward-select" class="bg-transparent text-slate-400 font-semibold tracking-wider text-xs uppercase focus:outline-none appearance-none cursor-pointer hover:text-white transition-colors">
                <option value="All">All Wards</option>
                <option value="Ward 4B - Acute Care">Ward 4B — Acute Care / ICU</option>
                <option value="Ward 7A - Step Down">Ward 7A — Step Down</option>
              </select>
              <i data-lucide="chevron-down" class="ml-1 w-3 h-3 text-slate-400 pointer-events-none"></i>
            </div>
          </div>
          <div class="flex items-center space-x-2 md:space-x-5">
            <button id="btn-replay" class="flex items-center space-x-1 px-3 py-1.5 rounded-full text-xs font-bold transition-colors border bg-slate-800/50 text-slate-400 border-slate-700 hover:text-white">
              <i data-lucide="play-circle" class="w-3.5 h-3.5" id="replay-icon"></i>
              <span class="hidden sm:inline" id="replay-text">Mock Replay</span>
            </button>
            <button id="btn-admit" class="flex items-center space-x-1 px-3 py-1.5 rounded-full bg-slate-800/50 border border-slate-700 text-slate-400 text-xs font-bold hover:text-white transition-colors">
              <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">Admit</span>
            </button>
            <div class="relative hidden lg:block">
              <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
              <input id="search-input" type="text" placeholder="Search patients..." class="pl-9 pr-4 py-1.5 bg-slate-800/50 border border-slate-700 rounded-full text-xs focus:outline-none focus:border-blue-500 transition-all w-52 text-white placeholder-slate-500" />
            </div>
            <div class="flex items-center space-x-2 pl-4 md:border-l border-slate-700">
              <div class="text-right hidden md:block">
                <p class="text-xs font-medium text-white">Sarah Jenkins, RN</p>
                <p class="text-[10px] text-slate-500">Charge Nurse</p>
              </div>
              <div class="w-8 h-8 rounded-full bg-blue-600/20 border border-blue-500/50 flex items-center justify-center">
                <i data-lucide="user" class="w-4 h-4 text-blue-400"></i>
              </div>
            </div>
          </div>
        </header>

        <!-- Stats Bar -->
        <div class="px-4 md:px-6 py-3 bg-[#0b1120] border-b border-slate-800 shrink-0">
          <div class="flex items-center space-x-2 md:space-x-3 mb-3 overflow-x-auto no-scrollbar">
            <button id="filter-all" class="flex shrink-0 items-center space-x-3 px-4 py-2.5 rounded-xl border bg-blue-600/20 border-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.3)] transition-all">
              <div class="p-1.5 bg-blue-500/20 rounded-lg"><i data-lucide="users" class="text-blue-400 w-5 h-5"></i></div>
              <div class="text-left">
                <div id="count-all" class="text-2xl font-black text-white leading-none">0</div>
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mt-0.5">Total</div>
              </div>
            </button>
            <button id="filter-critical" class="flex shrink-0 items-center space-x-3 px-4 py-2.5 rounded-xl border bg-[#0f172a] border-slate-700 hover:border-slate-600 transition-all">
              <div class="p-1.5 bg-[#ef4444]/20 rounded-lg"><i data-lucide="alert-triangle" class="text-[#ef4444] w-5 h-5"></i></div>
              <div class="text-left">
                <div id="count-critical" class="text-2xl font-black text-white leading-none">0</div>
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mt-0.5">Critical</div>
              </div>
            </button>
            <button id="filter-warning" class="flex shrink-0 items-center space-x-3 px-4 py-2.5 rounded-xl border bg-[#0f172a] border-slate-700 hover:border-slate-600 transition-all">
              <div class="p-1.5 bg-yellow-500/20 rounded-lg"><i data-lucide="activity" class="text-yellow-400 w-5 h-5"></i></div>
              <div class="text-left">
                <div id="count-warning" class="text-2xl font-black text-white leading-none">0</div>
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mt-0.5">Warning</div>
              </div>
            </button>
            <button id="filter-stable" class="flex shrink-0 items-center space-x-3 px-4 py-2.5 rounded-xl border bg-[#0f172a] border-slate-700 hover:border-slate-600 transition-all">
              <div class="p-1.5 bg-[#10b981]/20 rounded-lg"><i data-lucide="check-square" class="text-[#10b981] w-5 h-5"></i></div>
              <div class="text-left">
                <div id="count-stable" class="text-2xl font-black text-white leading-none">0</div>
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mt-0.5">Stable</div>
              </div>
            </button>
          </div>

          <!-- Color Legend -->
          <div class="flex flex-wrap items-center gap-4 text-xs font-bold bg-[#0f172a] border border-slate-800 rounded-lg p-2 max-w-fit">
            <span class="text-slate-400 uppercase tracking-wide">NEWS2 Legend:</span>
            <div class="flex items-center"><div class="w-3 h-3 rounded bg-[#ef4444] mr-1.5 shadow-[0_0_8px_rgba(239,68,68,0.5)]"></div><span class="text-white">≥ 7 (Critical)</span></div>
            <div class="flex items-center"><div class="w-3 h-3 rounded bg-[#eab308] mr-1.5 shadow-[0_0_8px_rgba(234,179,8,0.5)]"></div><span class="text-white">5-6 (Warning)</span></div>
            <div class="flex items-center"><div class="w-3 h-3 rounded bg-[#10b981] mr-1.5 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div><span class="text-white">0-4 (Stable)</span></div>
          </div>
        </div>

        <!-- Table Area -->
        <div class="flex-1 overflow-auto p-4 md:p-6 pb-20 relative">
          <!-- Headers -->
          <div class="flex items-center px-4 py-2 text-[10px] uppercase tracking-widest font-black text-slate-500 mb-2 border-b border-slate-800 sticky top-0 bg-[#0b1120] z-10">
            <div class="w-[50px] md:w-[60px] shrink-0">Bed</div>
            <div class="w-[120px] md:w-[150px] shrink-0">Patient</div>
            <div class="w-[120px] shrink-0 hidden md:block">Complaint</div>
            <div class="flex-1 min-w-[150px] hidden sm:block pl-4">NEWS2 Score Trend (24h)</div>
            <div class="w-[80px] md:w-[130px] shrink-0 text-right">Score</div>
          </div>
          
          <!-- Rows Container -->
          <div id="patients-container" class="space-y-3">
             <!-- Rendered by JS -->
          </div>
        </div>
      </main>
      
      <!-- Overlay for drawer -->
      <div id="drawer-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

      <!-- Patient Drawer -->
      <div id="patient-drawer" class="fixed inset-y-0 right-0 w-full sm:w-[450px] lg:w-[500px] bg-[#0f172a] border-l border-slate-800 shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <!-- Rendered by JS -->
      </div>
      
    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
