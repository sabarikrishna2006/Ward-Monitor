<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discharge Summary AI — Print</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ---- Print sheet sizing ---- */
    @page { size: 1400px 900px; margin: 0; }
    :root { --sheet-w: 1400px; --sheet-h: 900px; }

    html, body { background: #2a2a2a; }
    body { padding: 24px 0; }

    .sheets { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .sheet {
      width: var(--sheet-w);
      height: var(--sheet-h);
      background: white;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      break-inside: avoid;
      page-break-inside: avoid;
      break-after: page;
      page-break-after: always;
    }
    .sheet:last-child { break-after: auto; page-break-after: auto; }

    .sheet-tag {
      position: absolute; left: 20px; top: 20px; z-index: 50;
      font-family: "JetBrains Mono", monospace; font-size: 10px;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.85); background: rgba(11,37,69,0.92);
      padding: 6px 10px;
      pointer-events: none;
    }

    /* Each sheet hosts a full app shell at the fixed size */
    .sheet .app-shell { min-height: var(--sheet-h); height: var(--sheet-h); }
    .sheet .sidebar   { height: var(--sheet-h); position: relative !important; top: 0 !important; }
    .sheet .topbar    { position: relative !important; top: 0 !important; }
    .sheet .review-shell { height: calc(var(--sheet-h) - 56px - 60px); }
    .sheet .login-shell  { min-height: var(--sheet-h); height: var(--sheet-h); }

    /* No fixed FAB in print */
    .sheet .fab { position: absolute; right: 28px; bottom: 28px; }

    /* Open scroll containers so content is visible up to sheet height */
    .sheet .rev-scroll { overflow: hidden; }
    .sheet .content { overflow: hidden; }
    .sheet .logpanel { overflow: hidden; height: 360px; }

    /* Modals — re-anchored inside their sheet */
    .sheet .modal-overlay {
      position: absolute !important; inset: 0;
      background: rgba(11,27,45,0.45);
    }

    /* Hide tweaks panel + dev chrome in print */
    .tweaks-panel, [data-tweaks-fab] { display: none !important; }

    @media print {
      html, body { background: white; }
      body { padding: 0; }
      .sheets { gap: 0; }
      .sheet { box-shadow: none; margin: 0; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>
  <div class="sheets" id="sheets"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="screens/login.jsx"></script>
  <script type="text/babel" src="screens/admin-queue.jsx"></script>
  <script type="text/babel" src="screens/ingest.jsx"></script>
  <script type="text/babel" src="screens/processing.jsx"></script>
  <script type="text/babel" src="screens/doctor-queue.jsx"></script>
  <script type="text/babel" src="screens/review.jsx"></script>
  <script type="text/babel" src="screens/signoff.jsx"></script>
  <script type="text/babel" src="screens/signed.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const ADMIN_USER  = { name: "Sneha Nair", role: "Admin Staff", initials: "SN" };
    const DOCTOR_USER = { name: "Dr. A. Mehta", role: "Cardiologist", initials: "AM" };

    // Pre-built claims state for screen 6 — base, plus resolved state for screen 8/9 context
    const baseClaims = JSON.parse(JSON.stringify(CLAIMS_INITIAL));
    const resolvedClaims = baseClaims.map(c =>
      c.status === "r"
        ? { ...c, text: c.id === "c052" ? "Patient denies any known drug allergies (NKDA) — confirmed at bedside on 16 Mar." : c.text,
            status: "v", edited: true, editReason: c.id === "c052" ? "Allergy band reviewed at bedside" : "Reviewed against source" }
        : c
    );

    const redFlagClaim = baseClaims.find(c => c.id === "c052");

    // Each "page" config
    const PAGES = [
      { label: "01 · Login (shared)",
        render: () => <LoginScreen onLogin={() => {}} /> },

      { label: "02 · Admin · Encounters Queue",
        render: () => <AdminQueueScreen user={ADMIN_USER} onLogout={()=>{}} onNav={()=>{}}
                          onNewEncounter={()=>{}} onViewEncounter={()=>{}}
                          encounters={ADMIN_ENCOUNTERS} /> },

      { label: "03 · Admin · New Encounter Ingestion",
        render: () => <IngestScreen user={ADMIN_USER} onLogout={()=>{}} onNav={()=>{}}
                          onCancel={()=>{}} onSubmit={()=>{}} /> },

      { label: "04 · Admin · Processing Status",
        render: () => <ProcessingScreen user={ADMIN_USER} onLogout={()=>{}} onNav={()=>{}} onNotify={()=>{}} /> },

      { label: "05 · Doctor · My Review Queue",
        render: () => <DoctorQueueScreen user={DOCTOR_USER} onLogout={()=>{}} onNav={()=>{}} onReview={()=>{}} /> },

      { label: "06 · Doctor · Summary Review (core)",
        render: () => {
          const [claims, setClaims] = React.useState(baseClaims);
          const [hovered, setHovered] = React.useState(baseClaims.find(c => c.id === "c047"));
          return <ReviewScreen user={DOCTOR_USER} onLogout={()=>{}} onNav={()=>{}}
                    onBack={()=>{}} onSign={()=>{}}
                    claims={claims} setClaims={setClaims}
                    hovered={hovered} setHovered={setHovered}
                    onEditClaim={()=>{}} />;
        }
      },

      { label: "07 · Doctor · Inline Claim Edit Modal",
        render: () => {
          const [claims, setClaims] = React.useState(baseClaims);
          const [hovered, setHovered] = React.useState(baseClaims.find(c => c.id === "c052"));
          return (
            <>
              <ReviewScreen user={DOCTOR_USER} onLogout={()=>{}} onNav={()=>{}}
                  onBack={()=>{}} onSign={()=>{}}
                  claims={claims} setClaims={setClaims}
                  hovered={hovered} setHovered={setHovered}
                  onEditClaim={()=>{}} />
              <ClaimEditModal claim={redFlagClaim} onClose={()=>{}} onSave={()=>{}} onReject={()=>{}} />
            </>
          );
        }
      },

      { label: "08 · Doctor · Sign-off Confirmation",
        render: () => {
          const [claims, setClaims] = React.useState(resolvedClaims);
          const [hovered, setHovered] = React.useState(resolvedClaims[0]);
          return (
            <>
              <ReviewScreen user={DOCTOR_USER} onLogout={()=>{}} onNav={()=>{}}
                  onBack={()=>{}} onSign={()=>{}}
                  claims={claims} setClaims={setClaims}
                  hovered={hovered} setHovered={setHovered}
                  onEditClaim={()=>{}} />
              <SignOffModal counts={{ total: 148, red: 3, corrected: 2, rejected: 1 }}
                            onClose={()=>{}} onConfirm={()=>{}} />
            </>
          );
        }
      },

      { label: "09 · Signed Summary (read-only)",
        render: () => <SignedSummary user={DOCTOR_USER} onLogout={()=>{}} onBack={()=>{}} onNav={()=>{}} /> },
    ];

    function PrintApp() {
      return (
        <>
          {PAGES.map((p, i) => (
            <div className="sheet" key={i}>
              <div className="sheet-tag">{p.label}</div>
              {p.render()}
            </div>
          ))}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("sheets"));
    root.render(<PrintApp />);

    // Fire window.print() once fonts are loaded and the React tree has rendered.
    (async () => {
      try { await document.fonts.ready; } catch (e) {}
      // Give Babel-transformed JSX + React render a moment to settle
      await new Promise(r => setTimeout(r, 1200));
      window.print();
    })();
  </script>
</body>
</html>
