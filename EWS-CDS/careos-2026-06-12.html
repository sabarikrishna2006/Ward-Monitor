<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>Foqal CareOS · Hi-Fi Prototype v1</title>
<style>
/* ── VARIABLES ── */
:root{
  --p:#800080;--pl:#f7edf7;--pm:#c060c0;
  --t1:#dc2626;--t1b:#fef2f2;
  --t2:#d97706;--t2b:#fffbeb;
  --t3:#059669;--t3b:#ecfdf5;
  --ink:#111827;--ink2:#374151;--muted:#6b7280;
  --border:#e5e7eb;--surf:#f9fafb;
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'SF Mono','Menlo','Consolas',monospace;
  --sb:220px;--ab:56px;--tb:38px;
}
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);background:#fff;font-size:13px}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
/* ── TOPBAR ── */
#topbar{height:4px;background:var(--p);position:fixed;top:0;left:0;right:0;z-index:200}
/* ── APP BAR ── */
#appbar{
  height:var(--ab);background:#fff;border-bottom:1px solid var(--border);
  position:fixed;top:4px;left:0;right:0;z-index:190;
  display:flex;align-items:center;padding:0 18px;gap:10px;
}
.alogo{font-size:15px;font-weight:800;color:var(--p);letter-spacing:-.4px;white-space:nowrap}
.alogo em{color:var(--ink);font-style:normal;font-weight:400}
.adiv{width:1px;height:20px;background:var(--border)}
.aspace{flex:1}
#role-chip{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.rc-resident{background:#ecfdf5;color:#065f46}
.rc-attending{background:#eff6ff;color:#1e40af}
.rc-admin{background:#fffbeb;color:#92400e}
.rc-billing{background:#fdf4ff;color:#7e22ce}
.rc-nurse{background:#f0f9ff;color:#0369a1}
.rc-charge{background:#e0f2fe;color:#075985}
.rc-superadmin{background:#fff1f2;color:#9f1239}
.rc-cmo{background:#f5f3ff;color:#5b21b6}
.rc-none{background:var(--surf);color:var(--muted)}
#appbar-btns{display:flex;align-items:center;gap:4px}
.abtn{padding:5px 11px;border:1px solid var(--border);background:#fff;border-radius:6px;font-size:11px;font-weight:500;color:var(--muted);transition:all .12s}
.abtn:hover{background:var(--surf);color:var(--ink)}
/* ── LAYOUT ── */
#layout{
  display:flex;position:fixed;
  top:calc(4px + var(--ab));left:0;right:0;bottom:0;
}
/* ── SIDEBAR ── */
#sidebar{
  width:var(--sb);background:#fff;border-right:1px solid var(--border);
  overflow-y:auto;flex-shrink:0;
  display:flex;flex-direction:column;
}
.sb-sec{padding:10px 0;border-bottom:1px solid var(--border)}
.sb-lbl{padding:4px 14px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:2px}
.sb-item{
  display:flex;align-items:center;gap:8px;padding:6px 14px;
  font-size:12px;color:var(--ink2);cursor:pointer;
  border-left:2px solid transparent;transition:all .1s;
}
.sb-item:hover{background:var(--surf)}
.sb-item.active{background:var(--pl);color:var(--p);border-left-color:var(--p);font-weight:600}
.sbid{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:3px;font-weight:700;flex-shrink:0}
.sbid-p{background:var(--p);color:#fff}
.sbid-b{background:#1d4ed8;color:#fff}
.sbid-g{background:#059669;color:#fff}
.sbid-dp{background:#5b21b6;color:#fff}
.sbid-br{background:#92400e;color:#fff}
/* ── CONTENT ── */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
/* ── TAB BAR ── */
#tabbar{
  height:var(--tb);background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;padding:0 12px;overflow-x:auto;flex-shrink:0;
}
#tabbar::-webkit-scrollbar{height:0}
.tb{
  padding:0 12px;border:none;background:none;font-size:11.5px;font-weight:500;
  color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;
  margin-bottom:-1px;cursor:pointer;transition:all .12s;
}
.tb:hover{color:var(--ink)}
.tb.active{color:var(--p);border-bottom-color:var(--p);font-weight:600}
/* ── MAIN AREA ── */
#main{flex:1;overflow-y:auto;padding:20px 24px;background:var(--surf)}
/* ── BREADCRUMB ── */
.bc{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.bc-link{color:var(--p);cursor:pointer}.bc-link:hover{text-decoration:underline}
.bc-sep{color:var(--border)}
/* ── SCREEN HEADER ── */
.sh{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.sh-title{font-size:17px;font-weight:800;color:var(--ink);flex:1}
.sh-id{font-family:var(--mono);font-size:10px;padding:2px 8px;background:var(--p);color:#fff;border-radius:4px;font-weight:700}
.sh-actions{display:flex;gap:8px;align-items:center}
/* ── STATS BAR ── */
.stats{display:flex;gap:10px;margin-bottom:18px}
.stat{flex:1;background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 16px}
.stat-v{font-size:28px;font-weight:800;line-height:1;color:var(--ink)}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.stat.c-p .stat-v{color:var(--p)}
.stat.c-a .stat-v{color:var(--t2)}
.stat.c-g .stat-v{color:var(--t3)}
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:12.5px;font-weight:500;border:1px solid transparent;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn-pri{background:var(--p);color:#fff;border-color:var(--p)}
.btn-pri:hover{background:#5c0060}
.btn-sec{background:#fff;color:var(--ink);border-color:var(--border)}
.btn-sec:hover{background:var(--surf)}
.btn-danger{background:var(--t1);color:#fff;border-color:var(--t1)}
.btn-danger:hover{background:#b91c1c}
.btn-warn{background:var(--t2b);color:#92400e;border-color:#fcd34d}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn:disabled,.btn-dis{opacity:.45;cursor:not-allowed;pointer-events:none}
/* ── BADGES ── */
.bd{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:700}
.bd-t1{background:var(--t1b);color:var(--t1)}
.bd-t2{background:var(--t2b);color:var(--t2)}
.bd-t3{background:var(--t3b);color:var(--t3)}
.bd-p{background:var(--pl);color:var(--p)}
.bd-blue{background:#eff6ff;color:#1e40af}
.bd-gray{background:#f3f4f6;color:#4b5563}
.bd-red{background:var(--t1b);color:var(--t1)}
/* ── TABLE ── */
.tw{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{padding:9px 14px;text-align:left;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;background:var(--surf);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fcfcfc}
tr.stale td{color:var(--muted);opacity:.65}
tr.breach{background:var(--t1b)}
tr.breach td:first-child{border-left:3px solid var(--t1)}
tr.hl td{background:var(--pl)}
/* ── CARD ── */
.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px}
.card-title{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:10px}
/* ── FORM ── */
.fg{margin-bottom:13px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.fi{width:100%;padding:7px 11px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;color:var(--ink);background:#fff;transition:border-color .12s}
.fi:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 2px rgba(128,0,128,.1)}
.fi.valid{border-color:var(--t3)}
.fi.err{border-color:var(--t1)}
.fi-hint{font-size:10.5px;color:var(--muted);margin-top:3px}
.fi-err{font-size:10.5px;color:var(--t1);margin-top:3px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* ── UPLOAD ZONE ── */
.uz{border:2px dashed var(--border);border-radius:8px;padding:18px 14px;text-align:center;cursor:pointer;transition:all .18s;background:var(--surf)}
.uz:hover{border-color:var(--p);background:var(--pl)}
.uz.done{border-color:var(--t3);background:var(--t3b);border-style:solid}
.uz-icon{font-size:22px;margin-bottom:5px}
.uz-lbl{font-size:12px;font-weight:600;color:var(--ink2)}
.uz-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.uz.done .uz-lbl{color:var(--t3)}
/* ── PROGRESS ── */
.pb{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pb-fill{height:100%;background:var(--p);border-radius:3px;transition:width .5s}
/* ── ALERT ── */
.alert{padding:10px 14px;border-radius:6px;display:flex;align-items:flex-start;gap:8px;font-size:12px;margin-bottom:12px;line-height:1.5}
.alert b{font-weight:700}
.al-err{background:var(--t1b);color:var(--t1);border:1px solid #fca5a5}
.al-warn{background:var(--t2b);color:#92400e;border:1px solid #fcd34d}
.al-ok{background:var(--t3b);color:#065f46;border:1px solid #6ee7b7}
.al-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
/* ── MODAL ── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
#modal-box{background:#fff;border-radius:10px;padding:24px;width:480px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-t{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:8px}
.modal-b{font-size:12.5px;color:var(--ink2);margin-bottom:20px;line-height:1.6}
.modal-f{display:flex;justify-content:flex-end;gap:8px}
/* ── SPLIT PANE ── */
.split{display:flex;height:calc(100vh - 200px);min-height:400px;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.split-l{flex:3;overflow-y:auto;border-right:1px solid var(--border)}
.split-r{flex:2;overflow-y:auto;background:var(--surf)}
/* ── NABH SECTION ── */
.ns{border-bottom:1px solid var(--border);padding:12px 14px;cursor:pointer;transition:background .1s}
.ns:hover{background:var(--pl)}
.ns.active{background:#fdf0fd;border-left:3px solid var(--p)}
.ns-hd{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ns-num{font-family:var(--mono);font-size:10px;color:var(--muted)}
.ns-title{font-size:12.5px;font-weight:700;color:var(--ink);flex:1}
.ns-body{font-size:11.5px;color:var(--ink2);line-height:1.6}
/* ── SOURCE PANEL ── */
.sp{padding:14px}
.sp-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}
.si{background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px}
.si-file{font-size:11px;font-weight:700;color:var(--p)}
.si-page{font-size:10px;color:var(--muted)}
.si-quote{font-size:11.5px;color:var(--ink2);margin-top:6px;padding-left:8px;border-left:2px solid var(--p);font-style:italic;line-height:1.5}
/* ── KANBAN ── */
.kb{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
.kc{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:10px}
.kc-hd{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.kc-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
.kc-cnt{font-size:10px;background:var(--border);color:var(--muted);padding:1px 6px;border-radius:8px}
.kcard{background:#fff;border:1px solid var(--border);border-radius:6px;padding:9px;margin-bottom:7px;font-size:11.5px}
.kcard.breach{border-color:var(--t1);background:var(--t1b)}
.kcard-id{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.kcard-name{font-weight:700;color:var(--ink);margin:2px 0}
.kcard-meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.kcard-breach{color:var(--t1);font-weight:700;font-size:10.5px;margin-top:3px}
/* ── TIMELINE ── */
.tl{padding:4px 0}
.tl-item{display:flex;gap:12px;padding:10px 0;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:-10px;width:1px;background:var(--border)}
.tl-dot{width:30px;height:30px;border-radius:50%;background:var(--pl);border:2px solid var(--p);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.tl-dot.ok{background:var(--t3b);border-color:var(--t3)}
.tl-dot.err{background:var(--t1b);border-color:var(--t1)}
.tl-body{flex:1}
.tl-title{font-size:12.5px;font-weight:700;color:var(--ink)}
.tl-time{font-size:10.5px;color:var(--muted)}
.tl-detail{font-size:11.5px;color:var(--ink2);margin-top:3px}
/* ── COST BANDS ── */
.cb-row{display:flex;gap:12px;margin-bottom:16px}
.cb-opt{flex:1;border:2px solid var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .15s}
.cb-opt:hover{border-color:var(--p)}
.cb-opt.sel{border-color:var(--p);background:var(--pl)}
.cb-tag{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cb-amt{font-size:22px;font-weight:800;color:var(--ink);margin:8px 0}
.cb-opt.sel .cb-amt{color:var(--p)}
.cb-rec{font-size:10px;color:var(--p);font-weight:700}
/* ── METRIC CARD ── */
.mc{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px;text-align:center}
.mc-val{font-size:34px;font-weight:900;color:var(--p);line-height:1}
.mc-lbl{font-size:11px;color:var(--muted);margin-top:5px}
.mc-trend{font-size:11px;color:var(--t3);margin-top:6px;font-weight:700}
/* ── STEP FLOW ── */
.sf{display:flex;align-items:center;margin-bottom:20px;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.step{flex:1;padding:9px 4px;text-align:center;border-right:1px solid var(--border);position:relative}
.step:last-child{border-right:none}
.step-n{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);margin:0 auto 4px}
.step.done .step-n{background:var(--t3);border-color:var(--t3);color:#fff}
.step.cur .step-n{background:var(--p);border-color:var(--p);color:#fff}
.step-l{font-size:9.5px;color:var(--muted);line-height:1.3}
.step.cur .step-l{color:var(--p);font-weight:600}
/* ── DL FLAG ── */
.dlf{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px}
.dlf.t1{border-left:3px solid var(--t1)}
.dlf.t2{border-left:3px solid var(--t2)}
.dlf-bd{flex:1}
.dlf-title{font-size:13px;font-weight:700;color:var(--ink)}
.dlf-desc{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.5}
.dlf-link{font-size:11px;color:var(--p);font-weight:700;cursor:pointer;margin-top:5px;display:inline-block}
.dlf-link:hover{text-decoration:underline}
/* ── NEWS2 ── */
.n2s{font-size:18px;font-weight:900}
.n2s.hi{color:var(--t1)}.n2s.med{color:var(--t2)}.n2s.lo{color:var(--t3)}
/* ── JOURNEY STRIP ── */
.jphase{display:flex;gap:0;margin-bottom:20px}
.jp{flex:1;padding:16px;background:#fff;border:1px solid var(--border);border-radius:0}
.jp:first-child{border-radius:8px 0 0 8px}
.jp:last-child{border-radius:0 8px 8px 0}
.jp-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--p);margin-bottom:6px}
.jp-title{font-size:13px;font-weight:800;color:var(--ink)}
.jp-sub{font-size:11px;color:var(--muted);margin-top:3px}
.swim{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.swim th,.swim td{padding:9px 12px;border:1px solid var(--border);font-size:11.5px;vertical-align:top}
.swim th{background:var(--surf);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.swim td:first-child{font-weight:700;color:var(--ink);white-space:nowrap;background:var(--surf)}
/* ── EDGE CASE CARD ── */
.ec-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;display:flex;gap:12px}
.ec-id{font-family:var(--mono);font-size:10px;padding:2px 6px;background:var(--t2b);color:#92400e;border-radius:4px;font-weight:700;height:fit-content;white-space:nowrap}
.ec-t{font-size:13px;font-weight:700;color:var(--ink)}
.ec-d{font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.55}
.ec-res{font-size:11px;font-weight:600;color:var(--t3);margin-top:5px}
/* ── MISC ── */
.divider{height:1px;background:var(--border);margin:16px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vgap{height:12px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:11px}
.bold{font-weight:700}
.flex-r{display:flex;align-items:center;gap:8px}
.flex-sb{display:flex;align-items:center;justify-content:space-between}
.p-chip{padding:3px 9px;border-radius:12px;font-size:10.5px;font-weight:600;background:var(--surf);color:var(--muted)}
.check-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;font-size:12.5px}
.check-row input[type=checkbox]{margin-top:2px;accent-color:var(--p)}
.radio-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}
.radio-row input[type=radio]{accent-color:var(--p)}
.section-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;margin-top:16px}
.overview-module{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:border-color .15s}
.overview-module:hover{border-color:var(--p)}
.om-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.sprint-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px;font-size:12px}
.sc-num{font-family:var(--mono);font-size:10px;color:var(--muted);min-width:28px}
.sc-t{font-weight:600;color:var(--ink)}
.sc-meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.health-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.hd-ok{background:var(--t3)}.hd-warn{background:var(--t2)}.hd-err{background:var(--t1)}
</style>
</head>
<body>
<div id="topbar"></div>
<header id="appbar">
  <div class="alogo">Foqal <em>CareOS</em></div>
  <div class="adiv"></div>
  <div id="role-chip" class="rc-none">—</div>
  <div class="aspace"></div>
  <div id="appbar-btns">
    <button class="abtn" onclick="APP.t1_resolved=false;nav('s4b')">S4b Review</button>

/* ───────────────────── NAVIGATION ───────────────────── */
function nav(id,push=true){
  if(push&&APP.screen&&APP.screen!==id) APP.history.push(APP.screen);
  APP.screen=id;
  // sync tab
  const t=TABS.find(tb=>tb.items.find(i=>i.id===id)||tb.first===id);
  if(t) APP.tab=t.id;
  renderAll();
}
function setTab(id){
  APP.tab=id;
  const t=TABS.find(tb=>tb.id===id);
  if(t){APP.screen=t.first;APP.history=[];}
  renderAll();
}
function goBack(){const p=APP.history.pop();if(p)nav(p,false);}

/* ───────────────────── RENDER ENGINE ───────────────────── */
function renderAll(){
  renderTabBar();
  renderSidebar();
  renderRoleChip();
  const fn=SCREENS[APP.screen];
  document.getElementById('main').innerHTML=fn?fn():'<div style="padding:40px;color:var(--muted)">Screen not found: '+APP.screen+'</div>';
}
function renderTabBar(){
  document.getElementById('tabbar').innerHTML=TABS.map(t=>
    `<button class="tb${APP.tab===t.id?' active':''}" onclick="setTab('${t.id}')">${t.label}</button>`
  ).join('');
}
function renderSidebar(){
  const t=TABS.find(tb=>tb.id===APP.tab);
  if(!t||!t.items.length){document.getElementById('sidebar').innerHTML='<div class="sb-sec"><div class="sb-lbl">Navigation</div><div class="sb-item" onclick="nav(\'overview\')">Overview</div></div>';return;}
  document.getElementById('sidebar').innerHTML=`<div class="sb-sec">
    <div class="sb-lbl">${t.label}</div>
    ${t.items.map(i=>`<div class="sb-item${APP.screen===i.id?' active':''}" onclick="nav('${i.id}')"><span class="sbid sbid-${i.bc}">${i.badge}</span>${i.label}</div>`).join('')}
  </div>`;
}
function renderRoleChip(){
  const role=SCREEN_ROLES[APP.screen];
  const chip=document.getElementById('role-chip');
  chip.className=role?`rc-${role}`:'rc-none';
  chip.textContent=role?ROLE_LABELS[role]:'Platform View';
}

/* ───────────────────── MODAL SYSTEM ───────────────────── */
function openModal(id,extra){
  APP.modal=id;

}
function closeModal(){

}

<tr><td>🩺 Attending</td><td>—</td><td>Review S4b draft · Edit flags · DL co-sign</td><td>Approve step-down recommendation</td><td>Sign S5 · PDF (S6) · Amendment if needed (S7)</td><td>—</td></tr>

<div class="grid3">
${[['S6 → CE4','When attending signs discharge summary (S6), Module B CE4 reconciliation is automatically triggered — billing staff cannot finalise until this fires.'],['DL Flags → S4b','Drug-lab engine runs against every summary. T1 flags surface in S4b header before signing. T3 critical errors block sign-off.'],['NEWS2 → N2','NEWS2 ≥ 7 (CCU profile: ≥ 4) triggers mandatory escalation workflow. Non-PHI notification to attending.'],['N_transfer → Head Nurse','Step-down recommendation from nurse routes to Head Nurse. ward_location transitions to GENERAL_WARD only on approval — discharge trigger cannot fire from CCU.'],['EWS Clearance → Discharge','P2 EWS clearance (POST /patient/{id}/ews-clearance) triggers P1 discharge summary generation. Only valid when ward_location = GENERAL_WARD.']].map(([t,d])=>`<div class="card"><div class="card-title">${t}</div><div style="font-size:11.5px;color:var(--ink2)">${d}</div></div>`).join('')}

/* ── EDGE CASES ── */
edge:()=>`
<div class="sh"><h1 class="sh-title">Edge Cases — 12 Scenarios</h1><span class="sh-id">EC</span></div>
<div class="alert al-info">ℹ️ All 12 edge cases are accounted for in the system design. Each scenario has a defined UX response and NABH-compliant fallback.</div>
${[
['EC-01','Offline Attending','Dr. Sharma opens S4b with no internet connectivity.','System enters offline mode. Yellow banner: "Working offline — changes queued for sync." All edits saved locally. Sync triggers automatically on reconnect.'],
['EC-02','Pre-discharge Sign Before CE4','Attending attempts S5 sign before billing completes CE4 reconciliation.','Sign blocked. Alert: "Billing reconciliation (CE4) not complete. Patient cannot be discharged until billing clears." S5 sign button disabled.'],
['EC-03','Concurrent Editing','Two attendings (Dr. Sharma + Dr. Mehta) open S4b for same patient simultaneously.','Warning: "This summary is currently open by Dr. Priya Mehta. You may view but cannot edit until they close." Optimistic lock — 5 min timeout.'],
['EC-04','Out-of-distribution Diagnosis','LLM encounters ICD-10 code not in training data (rare tropical disease in cardiology ward).','T2 flag in §6: "Diagnosis I08.3 has low confidence (41%). Please verify manually." LLM declines to fabricate.'],
['EC-05','CE4 Variance >15%','Actual charges exceed ceiling estimate by >15%.','Alert: "Actual charges exceed ceiling by ₹82,000 (12.6%). Finance Head authorization required." Sign-off flow added to CE4.'],
['EC-06','Tier 1 Co-sign Required','Attending overrides T1 Drug-Lab flag without charge nurse.','Override blocked. Alert: "T1 override requires Head Nurse co-sign. Routing to Sister Leena Kurup." DLc co-sign flow opens.'],
['EC-07','Internet Drop Mid-upload','Network drops during S2 document upload.','Upload progress freezes. Banner: "Connection lost — progress saved. Retry when connected." Chunk-based upload resumes from last checkpoint.'],
['EC-08','Patient Refusal of Consent','Patient (or guardian) withdraws DPDPA consent after upload.','Generation blocked immediately. Alert: "DPDPA consent withdrawn — PT-24-0087. No further digital processing. Contact compliance officer." Documents marked for deletion.'],
['EC-09','Drug-Lab Rule Conflict','Rules R-001 (Warfarin+Aspirin → hold) and R-010 (Amiodarone+Warfarin → monitor) both flag for same patient simultaneously.','Both flags shown. Priority: T1 takes precedence. Alert: "R-001 and R-010 conflict for Warfarin. Consult clinical pharmacist (mandatory)." Pharmacist review queued.'],
['EC-10','User Deactivated Mid-session','Super Admin deactivates Dr. Sharma\'s account while he is actively reviewing S4b.','Session terminated within 60 seconds. Alert: "Your account access has been suspended. Contact your administrator." Unsaved edits discarded.'],
['EC-11','Patient Transfer Between Wards','Patient PT-24-0092 transferred from Ward 4A to ICU mid-summary.','Ward assignment updated automatically in S4b header. Attending re-assigned. Charge nurse of new ward notified via NEWS2 dashboard.'],
['EC-12','Queue Overflow (>50 Pending)','Ward Admin Kanban exceeds 50 summaries in "In Review" column.','SLA breach alerts sent to all pending attendings. Admin dashboard highlights backlog. CMO notified. Batch escalation modal available.'],
].map(([id,t,s,r])=>`
<div class="ec-card"><span class="ec-id">${id}</span><div><div class="ec-t">${t}</div><div style="font-size:11px;color:var(--muted);margin-top:2px;font-style:italic">"${s}"</div><div class="ec-d">${r}</div></div></div>`).join('')}`,
