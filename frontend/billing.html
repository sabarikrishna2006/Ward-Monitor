<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>Foqal CareOS · Module B — Cost Estimator</title>
<style>
:root{
  --p:#800080;--pl:#f7edf7;--pm:#c060c0;
  --t1:#dc2626;--t1b:#fef2f2;
  --t2:#d97706;--t2b:#fffbeb;
  --t3:#059669;--t3b:#ecfdf5;
  --ink:#111827;--ink2:#374151;--muted:#6b7280;
  --border:#e5e7eb;--surf:#f9fafb;
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'SF Mono','Menlo','Consolas',monospace;
  --sb:220px;--ab:56px;--tb:38px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);background:#fff;font-size:13px}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}

#app-shell{display:flex;flex-direction:column;height:100%}
#topbar{height:4px;background:var(--p);flex-shrink:0}
#appbar{
  height:var(--ab);background:#fff;border-bottom:1px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;padding:0 18px;gap:10px;
}
.alogo{font-size:15px;font-weight:800;color:var(--p);letter-spacing:-.4px;white-space:nowrap}
.alogo em{color:var(--ink);font-style:normal;font-weight:400}
.adiv{width:1px;height:20px;background:var(--border)}
.aspace{flex:1}
.role-chip{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;background:#fdf4ff;color:var(--p);white-space:nowrap}
.abtn{padding:5px 11px;border:1px solid var(--border);background:#fff;border-radius:6px;
  font-size:11px;font-weight:500;color:var(--muted);transition:all .12s}
.abtn:hover{background:var(--surf);color:var(--ink)}
.abtn-danger{border-color:#fca5a5;color:var(--t1)}
.abtn-danger:hover{background:var(--t1b)}

#body-row{display:flex;flex:1;overflow:hidden}
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#main{flex:1;overflow-y:auto;padding:20px 28px;background:var(--surf)}

.bc{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.bc-link{color:var(--p);cursor:pointer}.bc-link:hover{text-decoration:underline}
.bc-sep{color:var(--border)}

.sh{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.sh-title{font-size:17px;font-weight:800;color:var(--ink);flex:1}
.sh-id{font-family:var(--mono);font-size:10px;padding:2px 8px;background:var(--p);color:#fff;border-radius:4px;font-weight:700;white-space:nowrap}
.sh-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 16px}
.stat-v{font-size:28px;font-weight:800;line-height:1;color:var(--ink)}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.stat.c-p .stat-v{color:var(--p)}
.stat.c-a .stat-v{color:var(--t2)}
.stat.c-g .stat-v{color:var(--t3)}
.stat.c-b .stat-v{color:var(--p)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;
  font-size:12.5px;font-weight:500;border:1px solid transparent;cursor:pointer;
  transition:all .12s;white-space:nowrap}
.btn-pri{background:var(--p);color:#fff;border-color:var(--p)}
.btn-pri:hover{background:#5c0060}
.btn-sec{background:#fff;color:var(--ink);border-color:var(--border)}
.btn-sec:hover{background:var(--surf)}
.btn-danger{background:var(--t1);color:#fff;border-color:var(--t1)}
.btn-danger:hover{background:#b91c1c}
.btn-warn{background:var(--t2b);color:#92400e;border-color:#fcd34d}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn-xs{padding:3px 8px;font-size:11px}

.bd{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:700}
.bd-t1{background:var(--t1b);color:var(--t1)}
.bd-t2{background:var(--t2b);color:var(--t2)}
.bd-t3{background:var(--t3b);color:var(--t3)}
.bd-p{background:var(--pl);color:var(--p)}
.bd-blue{background:#eff6ff;color:#1e40af}
.bd-gray{background:#f3f4f6;color:#4b5563}
.bd-purple{background:#fdf4ff;color:var(--p)}
.bd-ok{background:#dcfce7;color:#15803d}

.tw{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{padding:9px 14px;text-align:left;font-size:10.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;background:var(--surf);
  border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fcfcfc}
tr.highlight td{background:#fdf4ff}

.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px}
.card-title{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:10px}

.alert{padding:10px 14px;border-radius:6px;display:flex;align-items:flex-start;gap:8px;
  font-size:12px;margin-bottom:12px;line-height:1.5}
.alert b{font-weight:700}
.al-err{background:var(--t1b);color:var(--t1);border:1px solid #fca5a5}
.al-warn{background:var(--t2b);color:#92400e;border:1px solid #fcd34d}
.al-ok{background:var(--t3b);color:#065f46;border:1px solid #6ee7b7}
.al-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}

#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;
  align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
#modal-box{background:#fff;border-radius:10px;padding:24px;width:480px;max-width:90vw;
  box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-t{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:8px}
.modal-b{font-size:12.5px;color:var(--ink2);margin-bottom:20px;line-height:1.6}
.modal-f{display:flex;justify-content:flex-end;gap:8px}

/* COST BANDS */
.cb-row{display:flex;gap:12px;margin-bottom:20px}
.cb-opt{flex:1;border:2px solid var(--border);border-radius:10px;padding:18px 16px;
  text-align:center;cursor:pointer;transition:all .15s;background:#fff}
.cb-opt:hover{border-color:var(--p)}
.cb-opt.sel{border-color:var(--p);background:#fdf4ff}
.cb-tag{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.cb-amt{font-size:26px;font-weight:900;color:var(--ink);margin:8px 0 6px}
.cb-opt.sel .cb-amt{color:var(--p)}
.cb-desc{font-size:11px;color:var(--muted);line-height:1.4}
.cb-rec{font-size:11px;color:var(--p);font-weight:700;margin-top:6px}

/* STEP FLOW */
.sf{display:flex;align-items:center;margin-bottom:20px;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.step{flex:1;padding:9px 4px;text-align:center;border-right:1px solid var(--border);position:relative}
.step:last-child{border-right:none}
.step-n{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  color:var(--muted);margin:0 auto 4px}
.step.done .step-n{background:var(--t3);border-color:var(--t3);color:#fff}
.step.cur .step-n{background:var(--p);border-color:var(--p);color:#fff}
.step-l{font-size:9.5px;color:var(--muted);line-height:1.3}
.step.cur .step-l{color:var(--p);font-weight:600}

.divider{height:1px;background:var(--border);margin:16px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:11px}
.bold{font-weight:700}
.flex-r{display:flex;align-items:center;gap:8px}
.flex-sb{display:flex;align-items:center;justify-content:space-between}

.fg{margin-bottom:13px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.fi{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;
  color:var(--ink);background:#fff;transition:border-color .12s;outline:none}
.fi:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(128,0,128,.12)}
.fi.valid{border-color:var(--t3)}
.fi.err{border-color:var(--t1)}
.fi-hint{font-size:10.5px;color:var(--muted);margin-top:3px}

.radio-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}
.radio-row input[type=radio]{accent-color:var(--p)}
.check-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;font-size:12.5px}
.check-row input[type=checkbox]{margin-top:2px;accent-color:var(--p)}

.pb{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pb-fill{height:100%;background:var(--p);border-radius:3px;transition:width .5s}

.uz{border:2px dashed var(--border);border-radius:8px;padding:18px 14px;text-align:center;
  cursor:pointer;transition:all .18s;background:var(--surf)}
.uz:hover{border-color:var(--p);background:#fdf4ff}
.uz-icon{font-size:22px;margin-bottom:5px}
.uz-lbl{font-size:12px;font-weight:600;color:var(--ink2)}
.uz-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
</style>
<script src="/config.js"></script>
</head>
<body>

<div id="app-shell">
  <div id="topbar"></div>

  <header id="appbar">
    <div class="alogo">Foqal <em>CareOS</em></div>
    <div class="adiv"></div>
    <span class="role-chip">Billing Staff</span>
    <div class="aspace"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:11.5px;color:var(--muted)" id="billing-name">Ravi Kumar</span>
      <button class="abtn abtn-danger" onclick="doLogout()">Sign Out</button>
    </div>
  </header>

  <div id="body-row">
    <div id="content">
      <div id="bil-notif-bar" style="display:none"></div>
      <div id="main"></div>
    </div>
  </div>
</div>

<div id="modal-overlay" onclick="closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()"></div>
</div>

<script>
function doLogout() {
  sessionStorage.removeItem('foqal_token');
  sessionStorage.removeItem('foqal_user');
  window.location.href = '/';
}

/* ── Deterministic synthetic patient name (same seed as doctor-dashboard & upload) ── */
function _bilSeeded(id, max) {
  let h = parseInt(id) || 0;
  h = ((h >> 16) ^ h) * 0x45d9f3b;
  h = ((h >> 16) ^ h) * 0x45d9f3b;
  h = (h >> 16) ^ h;
  return Math.abs(h) % max;
}
function _bilSeeded2(id, salt, max) { return _bilSeeded(id * 31 + salt, max); }
const _BIL_M = ['Rajesh Kumar','Mohan Singh','Dinesh Joshi','Arun Verma','Suresh Patel','Vijay Malhotra','Sanjay Gupta','Ramesh Sharma','Deepak Rao','Nitin Jain'];
const _BIL_F = ['Priya Sharma','Kavita Patel','Sunita Rao','Anjali Desai','Leela Varma','Rekha Devi','Suman Jain','Anita Gupta','Meena Singh','Geeta Mehta'];

// Tracks hadm_ids already shown as signed-off so we only toast genuinely new ones
let _bilKnown = new Set();
let _bilPollStarted = false;

// Persistent acknowledgement — once Riya clicks Reconcile or × the card won't reappear
const _bilAcked = new Set(JSON.parse(localStorage.getItem('bil_notif_acked') || '[]'));
let _bilLastPending = [];

function _bilAck(hadmId) {
  _bilAcked.add(String(hadmId));
  localStorage.setItem('bil_notif_acked', JSON.stringify([..._bilAcked]));
  _bilRenderNotifBar(_bilLastPending);
}

function _bilRenderNotifBar(pending) {
  _bilLastPending = pending;
  const bar = document.getElementById('bil-notif-bar');
  if (!bar) return;
  const unacked = pending.filter(p => !_bilAcked.has(String(p.hadm_id)));
  if (!unacked.length) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  bar.style.display = 'block';
  const plural = unacked.length > 1 ? `${unacked.length} patients awaiting` : '1 patient awaiting';
  bar.innerHTML = `
    <div style="border:1.5px solid #f59e0b;border-radius:10px;background:#fffbeb;padding:14px 18px;margin:14px 20px 0">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:${unacked.length ? '12px' : '0'}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:#92400e">CE4 Reconciliation Required</div>
          <div style="font-size:11.5px;color:#78350f;margin-top:1px">${plural} CE4 reconciliation — summary signed by attending</div>
        </div>
      </div>
      ${unacked.map(p => {
        const name   = _bilName(p.hadm_id) || fmtPid(p.hadm_id, p.display_id);
        const doctor = p.signed_by_name ? 'Dr. ' + p.signed_by_name : 'Attending';
        return `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fff8e1;border-radius:7px;border:1px solid #fde68a;margin-bottom:6px">
          <div style="flex:1;min-width:0">
            <span style="font-size:13px;font-weight:700;color:#111827">${name}</span>
            <span style="font-size:11.5px;color:#78350f;margin-left:10px">Signed off by ${doctor}</span>
            <span style="font-size:11px;color:#92400e;margin-left:6px">· Ready for final bill</span>
          </div>
          <button onclick="event.stopPropagation();_bilAck(${p.hadm_id});_ceSelectPatient(${p.hadm_id},'discharge')"
            style="flex-shrink:0;padding:6px 14px;background:#d97706;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">
            Open CE4 →
          </button>
          <button onclick="event.stopPropagation();_bilAck(${p.hadm_id})"
            title="Dismiss"
            style="flex-shrink:0;background:none;border:none;color:#92400e;font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;opacity:.7">×</button>
        </div>`;
      }).join('')}
    </div>`;
}

function _bilSignedToast(p) {
  const name   = _bilName(p.hadm_id) || p.mrn || fmtPid(p.hadm_id, p.display_id);
  const doctor = p.signed_by_name ? 'Dr. ' + p.signed_by_name : 'the attending physician';
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#FEF9C3;color:#713F12;' +
    'border:1.5px solid #FDE047;padding:14px 18px;border-radius:10px;font-size:13px;' +
    'font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.18);' +
    'max-width:340px;cursor:pointer;line-height:1.6';
  el.innerHTML = '🔔 <strong>' + name + '</strong> signed off by ' + doctor + '.<br>' +
    '<span style="font-weight:400;font-size:12px">Ready for CE4 reconciliation &amp; final billing.</span><br>' +
    '<span style="font-size:12px;color:#92400E;font-weight:700;text-decoration:underline">Open CE4 →</span>';
  el.onclick = function() { el.remove(); _ceSelectPatient(p.hadm_id, 'discharge'); };
  document.body.appendChild(el);
  setTimeout(function() { el.isConnected && el.remove(); }, 10000);
}

async function _bilPoll() {
  try {
    const base = window.FOQAL_API_BASE || 'http://localhost:7005';
    const d = await (await fetch(base + '/api/billing/dashboard')).json();
    const rows = (d.pending_actions || []).concat(d.post_discharge || []);
    const newSigned = rows.filter(function(p) {
      return p.phase === 'discharge' && !_bilKnown.has(p.hadm_id);
    });
    if (newSigned.length) {
      newSigned.forEach(function(p) { _bilKnown.add(p.hadm_id); _bilSignedToast(p); });
      _loadBillingDashboard();
    }
  } catch(e) {}
}
function _bilName(hadmId) {
  const isMale = _bilSeeded(hadmId, 2) === 0;
  return isMale ? _BIL_M[_bilSeeded(hadmId, _BIL_M.length)]
                : _BIL_F[_bilSeeded2(hadmId, 7, _BIL_F.length)];
}
const _BIL_INSURERS = ['Star Health','HDFC Ergo','ICICI Lombard','New India Assurance','Bajaj Allianz','Niva Bupa','United India'];
const _BIL_MODES    = ['Cashless','Cashless','Cashless','Reimbursement','Self-pay'];
function _bilInsurance(hadmId, savedCo, savedMode, isAb, abScheme) {
  // Government scheme patients — show scheme name, never a fake private insurer
  if (isAb && abScheme) {
    const s = abScheme.toUpperCase();
    if (s.includes('PM-JAY') || s.includes('PMJAY')) return 'PM-JAY (Govt)';
    if (s.includes('CGHS'))    return 'Haryana CGHS (Govt)';
    if (s.includes('ESI'))     return 'ESI (Govt)';
    if (s.includes('HARYANA')) return 'Haryana State Scheme (Govt)';
    return `${abScheme} (Govt)`;
  }
  if (savedCo) return savedMode ? `${savedCo} — ${savedMode}` : savedCo;
  const s = hadmId * 13 + 7;
  const mode = _BIL_MODES[Math.abs(s * 3) % _BIL_MODES.length];
  if (mode === 'Self-pay') return 'Self-pay';
  const ins = _BIL_INSURERS[Math.abs(s) % _BIL_INSURERS.length];
  return `${ins} — ${mode}`;
}

const SCREENS_LIST = ['ce0','ce1','ce2','ce2b','ce3','ce4','ce5'];
let CURRENT = 'ce0';

/* ── CE state — persists selected patient + form data across screens ── */
const _CE = {
  cost:          'expected',
  hadm_id:       null,
  mrn:           null,
  patientName:   null,
  age:           null,
  gender:        null,
  diagnosis:     null,
  diagnosisCode: null,
  admitDate:     null,
  dischargeDate: null,   // expected discharge (actual MIMIC ± offset) — NOT the real discharge
  actualDischargeDate: null,  // real MIMIC discharge — used only in CE4
  losDays:       null,
  dischargeType: 'Standard',
  encounterId:   null,
  primaryProcedure:    '',   // from MIMIC ap_procedures seq_num=1
  primaryProcedureIcd: '',
  // CE1 insurance
  paymentMode:   'Cashless',
  insuranceCo:   '',
  policyNo:      '',
  tpaName:       '',
  sumInsured:    '',
  claimNo:       '',
  preauthNo:     '',
  preauthAmt:    '',
  copayPct:      '',
  roomRentLimit: '',
  wardType:      'Semi-private Ward',
  isAbBeneficiary: false,
  abScheme:      '',
  // CE1 → CE2 estimate data (from generate-estimate API)
  estimateData:  null,
  // CE4/CE5
  actualCharges: null,
  insurancePaid: null,
  advancePaid:   null,
  balanceDue:    null,
  paymentRef:    '',
};

function _ceSelectPatient(hadm_id, phase) {
  _ce4Data = null;   // reset CE4 cache when switching patient
  _ce4Fetching = false;
  const base = window.FOQAL_API_BASE || 'http://localhost:7005';
  fetch(`${base}/api/billing/patient/${hadm_id}`)
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d) return;
      _CE.hadm_id       = d.hadm_id;
      // MRN = MIMIC subject_id (patient-level ID, not admission-level hadm_id)
      _CE.mrn           = d.subject_id ? String(d.subject_id) : `PT-${d.hadm_id}`;
      _CE.patientName   = _bilName(d.hadm_id);
      _CE.age           = d.anchor_age;
      _CE.gender        = d.gender;
      _CE.diagnosis     = d.primary_diagnosis_title || '';
      _CE.diagnosisCode = d.primary_diagnosis_code || '';
      _CE.admitDate     = d.admit_time ? d.admit_time.slice(0,10) : '';
      // Use expected_discharge (actual ± seeded offset) — NOT the real MIMIC discharge
      _CE.dischargeDate      = d.expected_discharge || (d.discharge_time ? d.discharge_time.slice(0,10) : '');
      _CE.actualDischargeDate = d.discharge_time ? d.discharge_time.slice(0,10) : '';
      _CE.losDays       = d.expected_los || d.los_days || 7;
      _CE.dischargeType = d.discharge_type || 'Standard';
      _CE.encounterId   = d.encounter_id;
      _CE.primaryProcedure    = d.primary_procedure_title || '';
      _CE.primaryProcedureIcd = d.primary_procedure_icd  || '';
      // Insurance always pre-fills from DB (seeded at startup for all patients)
      _CE.paymentMode   = d.payment_mode   || 'Cashless';
      _CE.insuranceCo   = d.insurance_co   || '';
      _CE.policyNo      = d.policy_number  || '';
      _CE.preauthNo     = d.preauth_number || '';
      _CE.preauthAmt    = d.preauth_amount  ? String(d.preauth_amount) : '';
      // Actuals/settlements only meaningful once billing has progressed
      if (d.billing_phase) {
        _CE.actualCharges = d.actual_charges;
        _CE.insurancePaid = d.insurance_paid;
        _CE.advancePaid   = d.advance_paid;
        _CE.balanceDue    = d.balance_due;
      }
      showScreen(phase === 'discharge' ? 'ce4' : 'ce1');
    })
    .catch(() => showScreen(phase === 'discharge' ? 'ce4' : 'ce1'));
}

      </div>`;

    const phaseCache = JSON.parse(sessionStorage.getItem('billing_phase_cache') || '{}');

    const _buildRow = p => {
          const name           = _bilName(p.hadm_id);

          const isDischarge    = p.phase === 'discharge';

            : isDischarge
              ? `<span class="bd bd-t2">Discharge</span>`
              : `<span class="bd bd-blue">Admission</span>`;

            || (isFinalBill ? 'Final Bill Overdue' : isDischarge ? 'Reconciliation Due' : 'Estimate Pending');
          const statusColor = statusText === 'Reconciliation Due' ? 'bd-t1'
                            : statusText === 'Final Bill Overdue' ? 'bd-gray'
                            : 'bd-t2';
          const statusBadge = `<span class="bd ${statusColor}">${statusText}</span>`;
          const insurance   = _bilInsurance(p.hadm_id, p.insurance_co, p.payment_mode, p.is_ab_beneficiary, p.ab_scheme);

      } else {

          <thead><tr><th>Patient</th><th>MRN</th><th>Admitted</th><th>Phase</th><th>Status</th><th>Estimated Bill</th><th>Action</th></tr></thead>
          <tbody>${sharedRows}</tbody>
        </table></div>`;
      }
    }

    // ── Completed Reconciliations tab — all post_discharge patients ──
    const reconciledEl = document.getElementById('ce0-reconciled-table');
    if (reconciledEl) {
      if (!post_discharge.length) {
        reconciledEl.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">No completed reconciliations yet. Reconciliations appear here after CE4 final bill is generated.</div>';
      } else {
        const reconRows = post_discharge.map(p => {
          const name = _bilName(p.hadm_id);
          const estTotal = p.expected_est || 0;
          const actTotal = p.actual_charges || 0;
          const variance = estTotal && actTotal ? ((actTotal - estTotal) / estTotal * 100).toFixed(1) : null;
          const varStr   = variance != null ? (variance >= 0 ? '+' : '') + variance + '%' : '—';
          const varColor = variance == null ? 'var(--muted)' : parseFloat(variance) > 15 ? 'var(--t1)' : parseFloat(variance) > 0 ? 'var(--t2)' : 'var(--t3)';
          return `<tr style="cursor:pointer" onclick="_ceSelectPatient(${p.hadm_id},'discharge')">
            <td><b>${name}</b></td>
            <td class="mono" style="font-size:11.5px">${p.mrn}</td>
            <td>${p.admit_date || '—'}</td>
            <td style="font-size:12px">${_bilInsurance(p.hadm_id, p.insurance_co, p.payment_mode, p.is_ab_beneficiary, p.ab_scheme)}</td>
            <td style="font-weight:700">${estTotal ? '₹' + Math.round(estTotal).toLocaleString('en-IN') : '—'}</td>
            <td style="font-weight:700">${actTotal ? '₹' + Math.round(actTotal).toLocaleString('en-IN') : '—'}</td>
            <td style="font-weight:700;color:${varColor}">${varStr}</td>
            <td><span class="bd bd-ok">Reconciled</span></td>
            <td><button class="btn btn-sec btn-sm" onclick="event.stopPropagation();_ceSelectPatient(${p.hadm_id},'discharge')">View →</button></td>
          </tr>`;
        }).join('');
        reconciledEl.innerHTML = `<div class="tw"><table>
          <thead><tr><th>Patient</th><th>MRN</th><th>Admitted</th><th>Insurance</th><th>Estimated</th><th>Actual</th><th>Variance</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>${reconRows}</tbody>
        </table></div>`;
      }
    }

    // Restore active tab
    if (_ce0Tab === 'completed') _switchCe0Tab('completed');
    else if (_ce0Tab === 'reconciled') _switchCe0Tab('reconciled');

    // Seed known signed-off patients so first-load entries don't trigger toasts
    (pending_actions || []).forEach(function(p) {
      if (p.phase === 'discharge' || p.phase === 'final_bill') _bilKnown.add(p.hadm_id);
    });
    // Start polling once (30-second interval)
    if (!_bilPollStarted) { _bilPollStarted = true; setInterval(_bilPoll, 30000); }

    // Show persistent notification bar for unacknowledged reconciliation_pending patients
    const _notifPending = (pending_actions || []).filter(p =>
      p.phase === 'discharge' && p.billing_phase === 'reconciliation_pending'
    );
    _bilRenderNotifBar(_notifPending);

  } catch (e) {
    tableEl.innerHTML = `<div class="alert al-warn" style="margin:0">⚠ Could not load patients: ${e.message}. Ensure backend is running.</div>`;
  }
}

const _PMJAY_JS = {
  MC011A:{name:'PTCA with Diagnostic Angiogram',rate:40600,tmpl:'interventional'},
  MC003A:{name:'Balloon Dilatation – Coarctation',rate:38600,tmpl:'interventional'},
  MC007A:{name:'ASD Device Closure',rate:36900,tmpl:'interventional'},
  MC005A:{name:'Balloon Mitral Valvotomy',rate:35700,tmpl:'interventional'},
  MC016A:{name:'Double Chamber Permanent Pacemaker',rate:33000,tmpl:'device'},
  MC017A:{name:'Temporary Pacemaker Implantation',rate:34500,tmpl:'device'},
  MC002A:{name:'Catheter directed Thrombolysis – DVT',rate:30800,tmpl:'interventional'},
  MC020A:{name:'Systemic Thrombolysis / Medical Management',rate:17900,tmpl:'medical'},
};
const _ICD_JS = {
  I42:'MC011A',I50:'MC011A',I21:'MC011A',I22:'MC011A',I25:'MC011A',
  I48:'MC016A',I47:'MC016A',I34:'MC005A',I35:'MC007A',
  I10:'MC020A',I26:'MC002A',I27:'MC020A',I28:'MC020A',
  J18:'MC020A',J44:'MC020A',J45:'MC020A',A41:'MC020A',
  N17:'MC020A',N18:'MC020A',K57:'MC020A',K92:'MC020A',
  G93:'MC020A',I63:'MC020A',I64:'MC020A',D64:'MC020A',M32:'MC020A',
};
const _WARD_JS = {'General Ward':2500,'Semi-private Ward':4500,'Private Room':8000,'ICU':15000};
const _TMPL_JS = {
  interventional:[['Cardiac Procedure / Surgery',0.38],['Medicines & Consumables',0.24],['Diagnostics & Investigations',0.12],['ICU / HDU Charges',0.10],['Nursing & Ward Services',0.08],['Specialist Consultation',0.05],['Physiotherapy & Rehab',0.02],['Miscellaneous',0.01]],
  medical:[['Procedures & Interventions',0.06],['Medicines & Consumables',0.34],['Diagnostics & Investigations',0.19],['ICU / HDU Charges',0.14],['Nursing & Ward Services',0.13],['Specialist Consultation',0.08],['Physiotherapy & Rehab',0.04],['Miscellaneous',0.02]],
  device:[['Cardiac Procedure / Surgery',0.38],['Medicines & Consumables',0.24],['Diagnostics & Investigations',0.12],['ICU / HDU Charges',0.10],['Nursing & Ward Services',0.08],['Specialist Consultation',0.05],['Physiotherapy & Rehab',0.02],['Miscellaneous',0.01]],
};
function _calcEstimateClient(icd, wardType, losDays) {
  const prefix = (icd||'').slice(0,3).toUpperCase();
  const hbpCode = (icd && icd[0]>='0' && icd[0]<='9') ? 'MC020A' : (_ICD_JS[prefix]||'MC011A');
  const pkg = _PMJAY_JS[hbpCode]||_PMJAY_JS.MC011A;
  const estLos = Math.min(losDays||7, 14);
  const wardRate = _WARD_JS[wardType]||4500;
  const extra = Math.max((losDays||7)-14, 0);
  const complexity = 1.0 + Math.min(extra,86)/86*0.28;
  const clinical = Math.round(pkg.rate*12*complexity);
  const roomCost = estLos*wardRate;
  const expected = clinical+roomCost;
  const tmpl = _TMPL_JS[pkg.tmpl]||_TMPL_JS.interventional;
  const lineItems = [{name:`Room Charges (${estLos}d x Rs.${wardRate.toLocaleString('en-IN')})`,amount:roomCost,pct:+(roomCost/expected*100).toFixed(1)}];
  for(const [n,pct] of tmpl){const a=Math.round(clinical*pct);lineItems.push({name:n,amount:a,pct:+(a/expected*100).toFixed(1)});}
  return {
    hbp_code:hbpCode,hbp_package_name:pkg.name,hbp_rate:pkg.rate,ward_type:wardType,
    los_days:estLos,actual_los_days:losDays||7,complexity:+complexity.toFixed(3),
    floor_est:Math.round(expected*0.82),expected_est:expected,ceiling_est:Math.round(expected*1.28),
    line_items:lineItems,pmjay_reference:`NHA HBP 2.2 · ${hbpCode} · PM-JAY rate Rs.${pkg.rate.toLocaleString('en-IN')} · Private x12`,
  };
}

function _ce1UpdateInsurancePanel() {
  const panel = document.getElementById('ce1-ins-impact');
  if (!panel) return;
  const mode     = document.querySelector('input[name="pay"]:checked')?.value || '';
  const los      = parseInt(document.getElementById('ce1-los')?.value) || 7;
  const ward     = document.getElementById('ce1-ward')?.value || 'Semi-private Ward';
  const wardRates = {'General Ward':2500,'Semi-private Ward':4500,'Private Room':8000,'ICU':15000};
  const wardRate = wardRates[ward] || 4500;
  const copay    = parseFloat(document.getElementById('ce1-copay')?.value) || 0;
  const rrlt     = parseInt((document.getElementById('ce1-rrlt')?.value || '').replace(/[^\d]/g,'')) || 0;
  const preauth  = parseInt((document.getElementById('ce1-paamt')?.value || '').replace(/[^\d]/g,'')) || 0;
  const est      = _CE.estimateData?.expected_est;

  if (mode !== 'Cashless' || !est) { panel.style.display = 'none'; return; }
  panel.style.display = '';

  const gross        = est;
  const rrExcess     = rrlt ? Math.max(0, (wardRate - rrlt) * los) : 0;
  const copayAmt     = Math.round(gross * copay / 100);
  const insCovers    = preauth ? Math.min(gross - copayAmt, preauth) : (gross - copayAmt);
  const patientLiable = gross - insCovers + rrExcess;
  const fmt          = n => '₹' + Math.round(n||0).toLocaleString('en-IN');

  panel.innerHTML = `
    <div class="card-title" style="font-size:12px;margin-bottom:8px">Insurance Impact (Cashless)</div>
    <table style="width:100%;font-size:12px">
      <tr><td style="padding:4px 0;color:var(--ink2)">Estimated Gross Bill</td><td style="text-align:right;font-weight:700">${fmt(gross)}</td></tr>
      ${rrExcess ? `<tr><td style="padding:4px 0;color:var(--err)">Room Rent Excess (₹${wardRate.toLocaleString('en-IN')}/d − limit ₹${rrlt.toLocaleString('en-IN')}/d × ${los}d)</td><td style="text-align:right;color:var(--err);font-weight:600">+${fmt(rrExcess)}</td></tr>` : ''}
      ${copay ? `<tr><td style="padding:4px 0;color:var(--muted)">Co-pay ${copay}%</td><td style="text-align:right;color:var(--muted)">+${fmt(copayAmt)}</td></tr>` : ''}
      ${preauth ? `<tr><td style="padding:4px 0;color:var(--ink2)">Insurance Covers (pre-auth cap)</td><td style="text-align:right;color:var(--ok)">−${fmt(insCovers)}</td></tr>` : ''}
      <tr style="border-top:2px solid var(--border)"><td style="padding:6px 0;font-weight:800">Est. Patient Liability</td><td style="text-align:right;font-weight:900;color:var(--p);font-size:15px">${fmt(patientLiable)}</td></tr>
    </table>`;
}

// CE2 live recalculate — called when ward type or LOS changes on CE2 screen
async function _ce2Recalc() {
  const wardEl = document.getElementById('ce2-ward');
  const losEl  = document.getElementById('ce2-los');
  if (!wardEl || !losEl) return;
  _CE.wardType = wardEl.value;
  _CE.losDays  = parseInt(losEl.value) || _CE.losDays || 7;

  const btn = document.getElementById('ce2-recalc-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Updating…'; }

  const base = window.FOQAL_API_BASE || `http://${location.hostname}:3802`;
  try {
    const selectedIcd = _CE.diagnosisCode || '';
    const resp = await fetch(`${base}/api/billing/generate-estimate`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        hadm_id:           _CE.hadm_id,
        ward_type:         _CE.wardType,
        los_days:          _CE.losDays,
        is_ab_beneficiary: _CE.isAbBeneficiary,
        ab_scheme:         _CE.abScheme || null,
        icd_override:      selectedIcd || null,
        payment_mode:      _CE.paymentMode || null,
        copay_pct:         _CE.copayPct ? parseFloat(_CE.copayPct) : null,
        room_rent_limit:   _CE.roomRentLimit ? parseInt(_CE.roomRentLimit) : null,
        preauth_amount:    _CE.preauthAmt ? parseInt(_CE.preauthAmt.replace(/[^\d]/g,'')) : null,
      }),
    });
    if (resp.ok) {
      _CE.estimateData = await resp.json();
    }
  } catch(e) {
    console.warn('ce2 recalc failed', e);
  }
  showScreen('ce2');
}

async function _ce1Save() {
  const payMode = document.querySelector('input[name="pay"]:checked')?.value || 'Cashless';
  _CE.paymentMode      = payMode;

  _CE.tpaName          = document.getElementById('ce1-tpa')?.value   || '';
  _CE.sumInsured       = document.getElementById('ce1-sumins')?.value || '';
  _CE.claimNo          = document.getElementById('ce1-claimno')?.value || '';
  _CE.preauthNo        = document.getElementById('ce1-pano')?.value  || '';
  _CE.preauthAmt       = document.getElementById('ce1-paamt')?.value || '';
  _CE.copayPct         = document.getElementById('ce1-copay')?.value || '';
  _CE.roomRentLimit    = document.getElementById('ce1-rrlt')?.value  || '';
  _CE.losDays          = parseInt(document.getElementById('ce1-los')?.value)  || _CE.losDays || 7;
  _CE.wardType         = document.getElementById('ce1-ward')?.value  || 'Semi-private Ward';
  _CE.dischargeDate    = document.getElementById('ce1-disc')?.value  || _CE.dischargeDate || '';
  _CE.isAbBeneficiary  = document.getElementById('ab-chk')?.checked || false;
  _CE.abScheme         = document.getElementById('ce1-abscheme')?.value || '';
  if (!_CE.mrn) _CE.mrn = document.getElementById('ce1-mrn')?.value || '';
  // If no hadm_id yet but MRN field has a pure number, treat it as hadm_id for ward provision
  if (!_CE.hadm_id) {
    const _mrnVal = parseInt(_CE.mrn);
    if (_mrnVal > 0) _CE.hadm_id = _mrnVal;
  }

  const preauthAmtInt  = _CE.preauthAmt ? parseInt(_CE.preauthAmt.replace(/[^\d]/g,'')) : null;
  const copayPctFloat  = _CE.copayPct   ? parseFloat(_CE.copayPct) : null;
  const rrltInt        = _CE.roomRentLimit ? parseInt(_CE.roomRentLimit.replace(/[^\d]/g,'')) : null;

  // Generate estimate — use backend for real patients, client-side for manual entry
  const base = window.FOQAL_API_BASE || `http://${location.hostname}:3802`;
  const genBtn = document.querySelector('button[onclick="_ce1Save()"]');
  if (genBtn) { genBtn.disabled = true; genBtn.textContent = 'Generating…'; }

  const selectedIcd = document.getElementById('ce1-diag')?.value || _CE.diagnosisCode || '';

  if (_CE.hadm_id) {
    // Real patient — call backend with insurance fields so scheme/liability is computed
    try {
      const resp = await fetch(`${base}/api/billing/generate-estimate`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          hadm_id:           _CE.hadm_id,
          ward_type:         _CE.wardType,
          los_days:          _CE.losDays,
          is_ab_beneficiary: _CE.isAbBeneficiary,
          ab_scheme:         _CE.abScheme || null,
          icd_override:      selectedIcd || null,
          payment_mode:      _CE.paymentMode,
          copay_pct:         copayPctFloat,
          room_rent_limit:   rrltInt,
          preauth_amount:    preauthAmtInt,
          patient_name:      _CE.patientName || null,
        }),
      });
      if (resp.ok) {
        _CE.estimateData = await resp.json();
        if (_CE.estimateData?.ward_admitted) {
          const _wardLabel = _CE.estimateData.ward_type === 'General Ward' ? 'General Ward' : 'Ward 4B – CCU';
          _showBillingToast(
            `🏥 Patient admitted to <strong>${_wardLabel}</strong>.<br>` +
            '<span style="font-size:11px;font-weight:400">Syncing clinical data from MIMIC… Ward board shows "Data Loading" until complete.</span>',
            '#16a34a'
          );
          // Fire single prefetch-all — runs full BQ ETL, writes all tabs to Cloud SQL,
          // then marks data_fetch_status='fetched'. Ward board and upload.html read Cloud SQL after.
          const _dataBase = window.FOQAL_DATA_BASE || `http://${location.hostname}:3803`;
          const _wardBase = window.FOQAL_WARD_BASE || `http://${location.hostname}:7806`;
          fetch(`${_dataBase}/api/patient/${_CE.hadm_id}/prefetch-all`, { method: 'POST' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d?.status === 'fetched') {
                // Immediately trigger vitals sync on ward backend so NEWS2 shows without waiting 15 min
                return fetch(`${_wardBase}/api/patients/${_CE.hadm_id}/sync-vitals`, { method: 'POST' });
              }
            })
            .then(r => r ? r.json() : null)
            .then(d => {
              if (d) {
                _showBillingToast('✅ Clinical data synced. Ward board updated with latest vitals.', '#2563eb');
              }
            })
            .catch(() => {});
        }
      }
    } catch(e) {
      console.warn('generate-estimate API error:', e);
    }
  }

  // No hadm_id (manual entry) OR backend failed → calculate client-side
  if (!_CE.estimateData) {
    _CE.estimateData = _calcEstimateClient(selectedIcd, _CE.wardType, _CE.losDays);
  }

  const est = _CE.estimateData;
  await _ceSaveRecord({
    encounter_id:    _CE.encounterId,
    payment_mode:    _CE.paymentMode,
    insurance_co:    _CE.insuranceCo,
    policy_number:   _CE.policyNo,
    preauth_number:  _CE.preauthNo,
    preauth_amount:  preauthAmtInt,
    copay_pct:       copayPctFloat,
    room_rent_limit: rrltInt,
    ward_type:       _CE.wardType,
    is_ab_beneficiary: _CE.isAbBeneficiary,
    ab_scheme:       _CE.abScheme || null,
    hbp_code:        est?.hbp_code || null,
    hbp_package_name:est?.hbp_package_name || null,
    hbp_rate:        est?.hbp_rate || null,
    floor_est:       est?.floor_est || null,
    expected_est:    est?.expected_est || null,
    ceiling_est:     est?.ceiling_est || null,
    line_items:      est?.line_items || null,
    // Migration 017 — expected discharge and scheme/insurance breakdown
    expected_discharge_date: _CE.dischargeDate || null,
    expected_los_days:       _CE.losDays || null,
    patient_pays_estimate:   est?.patient_pays_estimate ?? null,
    govt_pays:               est?.govt_pays ?? null,
    room_rent_excess:        est?.room_rent_excess ?? null,
    scheme_note:             est?.scheme_note || null,
    billing_phase:   'initial_estimate',
  });
  showScreen('ce2');
}

function _openCe2bModal() {
  const est  = _CE.estimateData;
  const floor   = est?.floor_est    || 320000;
  const expected= est?.expected_est || 480000;
  const ceiling = est?.ceiling_est  || 650000;
  const fmt = n => '₹' + (n||0).toLocaleString('en-IN');
  const band = _CE.cost || 'expected';
  const bandAmt = band === 'floor' ? floor : band === 'ceiling' ? ceiling : expected;

}

function _closeCe2bModal() {
  document.getElementById('ce2b-modal').style.display = 'none';
}

function _ce2bSave() {
  const band = _CE.cost;
  const est  = _CE.estimateData;
  const floor   = est?.floor_est    || 320000;
  const expected= est?.expected_est || 480000;
  const ceiling = est?.ceiling_est  || 650000;
  _ceSaveRecord({
    selected_band: band,
    floor_est:     floor,
    expected_est:  expected,
    ceiling_est:   ceiling,
    billing_phase: 'estimate_shared',
  });
  // Cache phase locally so CE0 dashboard shows updated status immediately
  const _phcache = JSON.parse(sessionStorage.getItem('billing_phase_cache') || '{}');
  const _cacheKey = _CE.hadm_id || ('manual_' + Date.now());
  _phcache[_cacheKey] = 'estimate_shared';
  sessionStorage.setItem('billing_phase_cache', JSON.stringify(_phcache));

  // Store completed entry — update existing if same patient, else prepend
  const _completed = JSON.parse(sessionStorage.getItem('completed_estimates') || '[]');
  const _cacheKey2 = _CE.hadm_id || _CE.mrn || null;
  const _existIdx  = _cacheKey2 ? _completed.findIndex(e => (e.hadm_id && e.hadm_id == _CE.hadm_id) || (!_CE.hadm_id && e.mrn === _CE.mrn)) : -1;
  const _newEntry  = {
    hadm_id:     _CE.hadm_id,
    mrn:         _CE.mrn || '—',
    name:        _CE.patientName || 'Manual Entry',
    diagnosis:   _CE.diagnosis || '—',
    ward:        _CE.wardType || '—',
    band:        band,
    amt:         band==='floor'?floor:band==='ceiling'?ceiling:expected,
    insurance:   _CE.insuranceCo || '—',
    ts:          new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
    isManual:    !_CE.hadm_id,
  };
  if (_existIdx >= 0) {
    _completed[_existIdx] = _newEntry;
  } else {
    _completed.unshift(_newEntry);
  }
  sessionStorage.setItem('completed_estimates', JSON.stringify(_completed.slice(0, 100)));

  _closeCe2bModal();
  showScreen('ce3');
}

function _showBillingToast(html, color) {

// Opens CE5 directly for Final Bill Overdue patients — fetches both APIs in parallel,
// never renders CE4 at all, so no loading screen flash.
function _ceFinalBillView(hadm_id) {
  _ce4Data = null;
  _ce4Fetching = false;
  document.getElementById('main').innerHTML =
    '<div style="padding:80px;text-align:center;color:var(--muted)">Loading final bill…</div>';
  const base = window.FOQAL_API_BASE || `http://${location.hostname}:7005`;
  Promise.all([
    fetch(`${base}/api/billing/patient/${hadm_id}`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`${base}/api/billing/reconciliation/${hadm_id}`).then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([patient, recon]) => {
    if (patient) {
      _CE.hadm_id             = patient.hadm_id;
      _CE.mrn                 = patient.subject_id ? String(patient.subject_id) : `PT-${patient.hadm_id}`;
      _CE.patientName         = _bilName(patient.hadm_id);
      _CE.age                 = patient.anchor_age;
      _CE.gender              = patient.gender;
      _CE.diagnosis           = patient.primary_diagnosis_title || '';
      _CE.admitDate           = patient.admit_time ? patient.admit_time.slice(0,10) : '';
      _CE.dischargeDate       = patient.expected_discharge || (patient.discharge_time ? patient.discharge_time.slice(0,10) : '');
      _CE.actualDischargeDate = patient.discharge_time ? patient.discharge_time.slice(0,10) : '';
      _CE.losDays             = patient.expected_los || patient.los_days || 7;
      _CE.dischargeType       = patient.discharge_type || 'Standard';
      _CE.encounterId         = patient.encounter_id;
      _CE.paymentMode         = patient.payment_mode || 'Cashless';
      _CE.insuranceCo         = patient.insurance_co || '';
      _CE.policyNo            = patient.policy_number || '';
      _CE.preauthNo           = patient.preauth_number || '';
      _CE.preauthAmt          = patient.preauth_amount ? String(patient.preauth_amount) : '';
    }
    if (recon) {
      _ce4Data = recon;
      if (recon.actuals_saved) {
        const s = recon.actuals_saved;
        if (s.actual_charges != null) _CE.actualCharges = s.actual_charges;
        if (s.insurance_paid != null) _CE.insurancePaid = s.insurance_paid;
        if (s.advance_paid   != null) _CE.advancePaid   = s.advance_paid;
      }
    }
    CURRENT = 'ce5';
    document.getElementById('main').innerHTML = SCREENS.ce5();
  });
}

async function _ce4Load() {
  if (!_CE.hadm_id) return;
  _ce4Fetching = true;
  const base = window.FOQAL_API_BASE || `http://${location.hostname}:7005`;
  try {
    const resp = await fetch(`${base}/api/billing/reconciliation/${_CE.hadm_id}`);
    if (!resp.ok) throw new Error(resp.status);
    _ce4Data = await resp.json();
    // Sync saved actuals back into _CE for CE5
    if (_ce4Data.actuals_saved) {
      const s = _ce4Data.actuals_saved;
      if (s.actual_charges != null) _CE.actualCharges = s.actual_charges;
      if (s.insurance_paid  != null) _CE.insurancePaid  = s.insurance_paid;
      if (s.advance_paid    != null) _CE.advancePaid    = s.advance_paid;
    }
  } catch(e) {
    console.warn('CE4 reconciliation load failed:', e);
  } finally {
    _ce4Fetching = false;
  }
  if (CURRENT === 'ce4') {
    document.getElementById('main').innerHTML = SCREENS.ce4();
    _ce4ComputeVariance();  // pre-compute if actuals already saved
    _ce4Distill();          // async AI distillation of diagnosis/procedures/meds
  }
}

async function _ce4Distill() {
  if (!_CE.hadm_id) return;
  const base = window.FOQAL_API_BASE || `http://${location.hostname}:7005`;
  // Show loading state in the three text fields
  const dxEl   = document.getElementById('ce4-final-dx');
  const procEl = document.getElementById('ce4-procedures');
  const medEl  = document.getElementById('ce4-meds');
  if (dxEl)   dxEl.value   = 'Summarising with AI…';
  if (procEl) procEl.value = 'Summarising with AI…';
  if (medEl)  medEl.value  = 'Summarising with AI…';
  try {
    const resp = await fetch(`${base}/api/billing/ce4-distill/${_CE.hadm_id}`);
    if (!resp.ok) throw new Error(resp.status);
    const d = await resp.json();
    if (dxEl   && d.final_diagnosis) dxEl.value   = d.final_diagnosis;
    if (procEl && d.procedures)      procEl.value  = d.procedures;
    if (medEl  && d.discharge_meds)  medEl.value   = d.discharge_meds;
  } catch(e) {
    console.warn('CE4 distill failed:', e);
    if (dxEl)   dxEl.value   = dxEl.dataset.original   || dxEl.value;
    if (procEl) procEl.value = procEl.dataset.original  || procEl.value;
    if (medEl)  medEl.value  = medEl.dataset.original   || medEl.value;
  }
}

function _ce4ComputeVariance() {
  if (!_ce4Data) return;
  const reconItems = _ce4Data.reconciliation?.computed_actual_items || [];
  const lineItems  = (_ce4Data.estimate.line_items?.length)
    ? _ce4Data.estimate.line_items
    : (_ce4Data.reconciliation?.computed_estimate_items || reconItems);
  let estTotal = 0, actTotal = 0, allFilled = true;
  const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');

  lineItems.forEach((item, i) => {
    const est = item.amount || 0;
    estTotal += est;
    const inp = document.getElementById(`ce4-act-${i}`);
    const raw = inp ? inp.value.trim() : '';
    if (raw === '') { allFilled = false; return; }
    const actVal = parseFloat(raw);
    if (isNaN(actVal)) { allFilled = false; return; }
    actTotal += actVal;
    const diff = actVal - est;
    const varEl = document.getElementById(`ce4-var-${i}`);
    if (varEl) {
      const sign = diff > 0 ? '+' : '';
      varEl.textContent = diff === 0 ? '₹0'
        : `${sign}₹${Math.abs(Math.round(diff)).toLocaleString('en-IN')}`;
      varEl.style.color = diff > 0 ? 'var(--t2)' : diff < 0 ? 'var(--t3)' : 'var(--muted)';
      varEl.style.fontWeight = diff !== 0 ? '700' : '400';
    }
  });

  const totalRow = document.getElementById('ce4-total-row');
  const alertEl  = document.getElementById('ce4-variance-alert');

  if (!allFilled) {
    if (totalRow) totalRow.innerHTML = `<td colspan="4" style="padding:8px 4px;color:var(--muted);font-style:italic">Enter all actual amounts above to see totals</td>`;
    if (alertEl)  { alertEl.className = 'alert al-info'; alertEl.textContent = 'Enter actual charges for each line item above to compute variance.'; }
    return;
  }

  const diff = actTotal - estTotal;
  const pct  = estTotal > 0 ? (diff / estTotal * 100) : 0;
  const sign = diff >= 0 ? '+' : '';

  if (totalRow) {
    totalRow.innerHTML = `
      <td style="padding:8px 4px;font-weight:800">Total</td>
      <td style="padding:8px 4px;text-align:right;font-weight:700">${fmt(estTotal)}</td>
      <td style="padding:8px 4px;text-align:right;font-weight:700;color:${diff>0?'var(--t2)':'var(--ink)'}">${fmt(actTotal)}</td>
      <td style="padding:8px 4px;text-align:right;font-weight:800;color:${diff>0?'var(--t2)':diff<0?'var(--t3)':'var(--muted)'}">
        ${diff===0?'₹0':`${sign}₹${Math.abs(Math.round(diff)).toLocaleString('en-IN')}`} (${sign}${pct.toFixed(1)}%)
      </td>`;
  }

  if (alertEl) {
    const absPct = Math.abs(pct);
    if (absPct <= 15) {
      alertEl.className = 'alert al-ok';
      alertEl.innerHTML = `✅ Actual charges ${diff>=0?'exceed estimate':'below estimate'} by ₹${Math.abs(Math.round(diff)).toLocaleString('en-IN')} (${sign}${pct.toFixed(1)}%). Within CE4 variance threshold (≤15%). No additional authorisation required.`;
    } else if (absPct <= 30) {
      alertEl.className = 'alert al-warn';
      alertEl.innerHTML = `⚠️ Variance of ${sign}${pct.toFixed(1)}% exceeds 15% threshold. Senior billing supervisor approval recommended before generating final bill.`;
    } else {
      alertEl.className = 'alert al-err';
      alertEl.innerHTML = `🔴 Significant variance: ${sign}${pct.toFixed(1)}%. Exceeds 30% threshold. Medical director authorisation required before generating final bill.`;
    }
  }

  _CE.actualCharges = Math.round(actTotal);
}

async function _ce4Save() {
  if (!_ce4Data) return;
  const lineItems = (_ce4Data.estimate.line_items?.length)
    ? _ce4Data.estimate.line_items
    : (_ce4Data.reconciliation?.computed_estimate_items || _ce4Data.reconciliation?.computed_actual_items || []);
  const actualLineItems = lineItems.map((item, i) => {
    const inp = document.getElementById(`ce4-act-${i}`);
    const amount = Math.round(parseFloat(inp?.value || '0') || 0);
    return { name: item.name, amount };
  });
  const actualTotal = actualLineItems.reduce((s, x) => s + x.amount, 0);
  const notes = document.getElementById('ce4-notes')?.value || '';

  if (actualTotal === 0 && lineItems.length > 0) {
    alert('Please enter actual charges before generating the final bill.');
    return;
  }

  _CE.actualCharges = actualTotal;
  const saveBtn = document.getElementById('ce4-save-btn');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }

  const _recon = _ce4Data?.reconciliation || {};
  await _ceSaveRecord({
    actual_line_items:    actualLineItems,
    actual_charges:       actualTotal,
    reconciliation_notes: notes || null,
    actual_los_days:      _recon.actual_los || null,
    billing_phase:        'final_bill_generated',
  });

  // Keep _ce4Data alive so CE5 can read reconciliation/ab_info
  // It is cleared in _ceSelectPatient() when the next patient is loaded
  showScreen('ce5');
}

function _ce5Print() {
  const w = window.open('', '_blank', 'width=900,height=700');
  w.document.write(_ce5PrintHtml(false));
  w.document.close();
  w.focus();
  setTimeout(() => { w.print(); }, 600);
}

function _ce5Download() {
  const w = window.open('', '_blank', 'width=900,height=700');
  w.document.write(_ce5PrintHtml(true));
  w.document.close();
  w.focus();
  setTimeout(() => {
    w.print();  // browser print dialog → Save as PDF
    // Add hint
    const hint = w.document.createElement('div');
    hint.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fef9c3;color:#854d0e;padding:10px;text-align:center;font-size:13px;z-index:9999;font-family:sans-serif';
    hint.textContent = 'In the print dialog → change destination to "Save as PDF" to download.';
    w.document.body.prepend(hint);
  }, 400);
}

function _ce5Email() {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:24px;right:24px;background:#16a34a;color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)';
  toast.textContent = `📧 Bill emailed to patient (${_CE.mrn || 'PT'}) — copy saved to records.`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

/* ── CE5 — Insurance claim submission ── */
function _ce5SubmitClaim(insLabel) {
  const btn    = document.getElementById('ce5-submit-claim-btn');
  const badge  = document.getElementById('ce5-claim-status-badge');
  if (btn)  { btn.disabled = true; btn.textContent = 'Submitting…'; }
  _ceSaveRecord({ billing_phase: 'claim_submitted' }).then(() => {
    if (badge) { badge.className = 'bd bd-ok'; badge.textContent = 'Submitted to ' + insLabel; }
    if (btn)   { btn.textContent = '✓ Submitted'; btn.style.color = 'var(--ok)'; }
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:24px;right:24px;background:#16a34a;color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)';
    toast.textContent = `✅ Claim submitted to ${insLabel}. Reference saved.`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  });
}

function _ce5MarkPaid() {
  const ref = document.getElementById('ce5-payref')?.value || '';
  const mode = document.querySelector('input[name="pay-mode"]:checked')?.nextSibling?.textContent?.trim() || 'UPI';
  _CE.paymentRef = ref;
  _ceSaveRecord({
    payment_ref:         ref,
    payment_mode_final:  mode,
    billing_phase:       'paid',
  }).then(() => {
    closeModal();
    showScreen('ce0');
  });
}

}

  document.getElementById('modal-overlay').classList.remove('open');

/* ════════════════════════════════════
   CE2 — COST BANDS
════════════════════════════════════ */
ce2: () => {
  const est   = _CE.estimateData;
  const floor = est?.floor_est    || 320000;
  const exp   = est?.expected_est || 480000;
  const ceil  = est?.ceiling_est  || 650000;
  const fmt   = n => '₹' + (n||0).toLocaleString('en-IN');

  const selAmt = _CE.cost === 'floor' ? floor : _CE.cost === 'ceiling' ? ceil : exp;

  // Line items: use real data or show a loading note
  const lineItems = est?.line_items || [];
  const lineTotal = lineItems.reduce((s, i) => s + (i.amount || 0), 0);

  const lineTable = lineItems.length
    ? `<table style="width:100%;font-size:12.5px">
      <thead><tr>
        <th style="background:none;font-size:10px;padding:6px 0">Line Item</th>
        <th style="background:none;font-size:10px;padding:6px 0;text-align:right">Amount</th>
        <th style="background:none;font-size:10px;padding:6px 0;text-align:right">%</th>
      </tr></thead>
      <tbody>
        ${lineItems.map(i => `<tr style="border-bottom:1px solid var(--border)">
          <td style="padding:7px 0;color:var(--ink2)">${i.name}</td>
          <td style="padding:7px 0;text-align:right;font-weight:600">${fmt(i.amount)}</td>
          <td style="padding:7px 0;text-align:right;color:var(--muted);font-size:11px">${i.pct}%</td>
        </tr>`).join('')}
        <tr style="border-top:2px solid var(--border)">
          <td style="padding:8px 0;font-weight:800">Total (Expected)</td>
          <td style="padding:8px 0;text-align:right;font-weight:900;color:var(--p);font-size:15px" colspan="2">${fmt(lineTotal)}</td>
        </tr>
      </tbody>
    </table>`
    : `<div style="color:var(--muted);font-size:12px;padding:12px 0">Breakdown not available — estimate was not generated from backend.</div>`;

  // Insurance / scheme breakdown — use backend-computed values if available
  const preauthAmt     = _CE.preauthAmt ? parseInt(_CE.preauthAmt.replace(/[^\d]/g,'')) : 0;
  const ptLiable       = est?.patient_pays_estimate != null ? est.patient_pays_estimate : (exp - (preauthAmt || Math.round(exp * 0.52)));
  const insEst         = est?.govt_pays != null ? est.govt_pays : (preauthAmt || Math.round(exp * 0.52));
  const rrExcessEst    = est?.room_rent_excess || 0;
  const schemeNote     = est?.scheme_note || null;

  // PM-JAY reference
  const pmjayCard = est ? `
    <div class="card">
      <div class="card-title">PM-JAY / NHA Reference</div>
      <table style="width:100%;font-size:12.5px"><tbody>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">HBP Code</td><td style="padding:7px 0;text-align:right;font-family:var(--mono);font-weight:700">${est.hbp_code}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Package</td><td style="padding:7px 0;text-align:right;font-size:11.5px">${est.hbp_package_name}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Govt. package rate</td><td style="padding:7px 0;text-align:right;font-weight:700;color:var(--t3)">${fmt(est.hbp_rate)}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Private est. (×12)</td><td style="padding:7px 0;text-align:right;font-weight:700">${fmt(est.expected_est)}</td></tr>
        <tr><td style="padding:7px 0;color:var(--muted);font-size:10px" colspan="2">${est.pmjay_reference}</td></tr>
      </tbody></table>
    </div>` : '';

  return `
<div class="bc">
  <span class="bc-link" onclick="showScreen('ce0')">Module B</span>
  <span class="bc-sep">/</span>
  <span class="bc-link" onclick="showScreen('ce1')">CE Input</span>
  <span class="bc-sep">/</span><span>Cost Estimate</span>
</div>
${stepFlow('ce2')}
<div class="sh">
  <h1 class="sh-title">Cost Estimate — ${_CE.mrn || 'Patient'}</h1>
  <span class="sh-id">CE2</span>
  <div class="sh-actions">
    <span class="muted small">${[_CE.patientName, _CE.age ? _CE.age+'Y' : null, _CE.gender, _CE.diagnosis].filter(Boolean).join(' · ')}</span>
  </div>
</div>
<div class="cb-row">
  <div class="cb-opt${_CE.cost==='floor'?' sel':''}" onclick="_CE.cost='floor';showScreen('ce2')">
    <div class="cb-tag">Floor Estimate</div>
    <div class="cb-amt">${fmt(floor)}</div>
    <div class="cb-desc">Conservative — Best case scenario. No complications, standard LOS.</div>
  </div>
  <div class="cb-opt${_CE.cost==='expected'?' sel':''}" onclick="_CE.cost='expected';showScreen('ce2')">
    <div class="cb-tag">Expected</div>
    <div class="cb-amt">${fmt(exp)}</div>
    <div class="cb-desc">Most likely — Based on ${_CE.diagnosis ? _CE.diagnosis.split(' ')[0] : 'diagnosis'} profile · ${_CE.losDays || est?.los_days || 7}-day est. LOS${est?.complexity > 1 ? ' · complexity ×' + est.complexity.toFixed(2) : ''}.</div>
    <div class="cb-rec">★ Recommended</div>
  </div>
  <div class="cb-opt${_CE.cost==='ceiling'?' sel':''}" onclick="_CE.cost='ceiling';showScreen('ce2')">
    <div class="cb-tag">Ceiling</div>
    <div class="cb-amt">${fmt(ceil)}</div>
    <div class="cb-desc">Worst case — Includes potential complications, extended stay, procedures.</div>
  </div>
</div>

<div class="grid2">
  <div class="card">
    <div class="card-title">Cost Breakdown — Expected ${fmt(exp)}</div>
    ${lineTable}
  </div>
  <div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">${_CE.isAbBeneficiary && _CE.abScheme ? _CE.abScheme + ' Coverage' : 'Mediclaim Breakdown' + (_CE.insuranceCo ? ' — ' + _CE.insuranceCo.split(' ')[0] : '')}</div>
      ${schemeNote ? `<div class="alert al-ok" style="margin-bottom:8px;font-size:12px">✅ ${schemeNote}</div>` : ''}
      <table style="width:100%;font-size:12.5px"><tbody>
        ${!_CE.isAbBeneficiary && preauthAmt ? `<tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Pre-auth approved</td><td style="padding:7px 0;text-align:right;font-weight:700">${fmt(preauthAmt)}</td></tr>` : ''}
        ${_CE.isAbBeneficiary ? `<tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Scheme reimburses</td><td style="padding:7px 0;text-align:right;font-weight:700;color:var(--ok)">${fmt(insEst)}</td></tr>` : `<tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Est. insurance payout</td><td style="padding:7px 0;text-align:right;font-weight:700">${fmt(insEst)}</td></tr>`}
        ${rrExcessEst ? `<tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--err)">Room rent excess</td><td style="padding:7px 0;text-align:right;color:var(--err);font-weight:600">+${fmt(rrExcessEst)}</td></tr>` : ''}
        <tr style="border-top:2px solid var(--border)"><td style="padding:7px 0;font-weight:800">Estimated Patient Liability</td><td style="padding:7px 0;text-align:right;font-weight:900;font-size:15px;color:${ptLiable === 0 ? 'var(--ok)' : 'var(--p)'}">${fmt(ptLiable)}</td></tr>
        ${!_CE.isAbBeneficiary ? `<tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Co-pay clause</td><td style="padding:7px 0;text-align:right">${_CE.copayPct ? _CE.copayPct + '% of approved' : '—'}</td></tr>
        <tr><td style="padding:7px 0;color:var(--muted)">Room rent limit</td><td style="padding:7px 0;text-align:right">${_CE.roomRentLimit ? '₹' + parseInt(_CE.roomRentLimit.replace(/[^\d]/g,'')).toLocaleString('en-IN') + '/day' : '—'}</td></tr>` : ''}
      </tbody></table>
    </div>
    ${pmjayCard}
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
      <button class="btn btn-sec" onclick="showScreen('ce1')">← Recalculate</button>
      <button class="btn btn-pri" onclick="showScreen('ce2b')">Confirm →</button>
    </div>
  </div>
</div>`;
},

/* ════════════════════════════════════
   CE4 — CE RECONCILIATION
════════════════════════════════════ */
ce4: () => {
  const hdr = `
<div class="bc">
  <span class="bc-link" onclick="showScreen('ce0')">Module B</span>
  <span class="bc-sep">/</span><span>Reconciliation</span>
</div>
${stepFlow('ce4')}
<div class="sh">
  <h1 class="sh-title">CE4 — Cost Reconciliation${_CE.patientName ? ' — ' + _CE.patientName : ''}</h1>
  <span class="sh-id">CE4</span>
</div>`;

  if (!_ce4Data) {
    return hdr + `<div style="padding:48px;text-align:center;color:var(--muted)">Loading reconciliation data…</div>`;
  }

  const { patient, discharge, estimate, ab_info, actuals_saved, reconciliation } = _ce4Data;
  const reconItems   = reconciliation?.computed_actual_items || [];
  // If no CE1 estimate was saved, use CE1-formula computed items (expected LOS × LOS-complexity)
  // so the estimated column is always different from the actual column
  const lineItems    = (estimate.line_items?.length)
    ? estimate.line_items
    : (reconciliation?.computed_estimate_items || reconItems);
  const savedActuals = actuals_saved ? (actuals_saved.actual_line_items || []) : [];
  const fmt = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');

  const signedBadge = discharge.signed_at
    ? `✅ <b>Auto-populated from Module A</b> — Signed by <b>${discharge.signed_by || 'Doctor'}</b> on ${discharge.signed_at}`
    : `⏳ <b>Pending signature</b> — Discharge summary not yet signed off`;
  const alertClass = discharge.signed_at ? 'al-ok' : 'al-warn';

  const losStr = (() => {
    const actual = discharge.actual_los || 0;
    const expected = reconciliation?.expected_los;
    const diff = reconciliation?.los_diff;
    const losDates = [discharge.admit_date, discharge.discharge_date].filter(Boolean).join(' – ');
    if (expected && diff !== undefined) {
      const diffStr = diff > 0 ? `+${diff} days longer than estimated` : diff < 0 ? `${diff} days shorter than estimated` : 'matched estimate';
      return `Actual: ${actual} days (${losDates}) · Estimated: ${expected} days · ${diffStr}`;
    }
    const parts = [actual + ' day' + (actual !== 1 ? 's' : '')];
    if (losDates) parts.push(losDates);
    return parts.join(' ');
  })();

  const bandLabel = { floor: 'Conservative', expected: 'Expected', ceiling: 'Worst-case' }[estimate.selected_band] || 'Expected';
  const estBandDisplay = `${bandLabel} band — ${fmt(estimate.est_total)}`;

  const varRows = lineItems.map((item, i) => {
    const est      = item.amount || 0;
    const saved    = savedActuals[i]?.amount;
    // Pre-fill with MIMIC-derived actual estimate if not yet manually entered
    const computed = reconItems[i]?.amount;
    const preVal   = saved != null ? saved : (computed != null ? computed : '');
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:6px 4px;font-size:12px">${item.name}</td>
      <td style="padding:6px 4px;text-align:right;font-size:12px;color:var(--ink2)">${fmt(est)}</td>
      <td style="padding:6px 4px;text-align:right">
        <input type="number" id="ce4-act-${i}" data-est="${est}" value="${preVal}"
          placeholder="0"
          style="width:110px;text-align:right;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit"
          oninput="_ce4ComputeVariance()">
      </td>
      <td id="ce4-var-${i}" style="padding:6px 4px;text-align:right;font-size:12px;color:var(--muted)">—</td>
    </tr>`;
  }).join('');

  const _schemeSummary = reconciliation?.scheme_summary || '';
  const _patientFinal  = reconciliation?.patient_pay_final;
  const _govtFinal     = reconciliation?.govt_pay_final;
  const _reconPayMode  = (reconciliation?.payment_mode || '').toLowerCase();
  const _reconInsCo    = reconciliation?.insurance_co || '';
  const abBlock = (() => {
    if (ab_info.is_ab_beneficiary) {
      const scheme = ab_info.ab_scheme || 'PM-JAY';
      const schemeClass = scheme.includes('CGHS') ? 'al-info' : 'al-ok';
      const schemeIcon  = scheme.includes('CGHS') ? 'ℹ️' : '✅';
      const patientLine = _patientFinal != null
        ? `<br><b>Patient pays: ${fmt(_patientFinal)}</b>${_govtFinal ? ` · Scheme reimburses: ${fmt(_govtFinal)}` : ''}`
        : '';
      return `<div class="alert ${schemeClass}" style="margin-bottom:12px">
        ${schemeIcon} <b>${scheme} — ${estimate.hbp_package_name || estimate.hbp_code || '—'}</b><br>
        ${_schemeSummary || `Government reimburses up to ${fmt(ab_info.hbp_rate)}.`}${patientLine}
      </div>`;
    }
    if (_reconPayMode === 'cashless' && _schemeSummary) {
      const insLabel = _reconInsCo || 'Insurance';
      return `<div class="alert al-ok" style="margin-bottom:12px">
        🏥 <b>${insLabel} — Cashless</b><br>
        ${_schemeSummary}<br>
        <b>Patient liability: ${fmt(_patientFinal)}</b>
      </div>`;
    }
    if (_reconPayMode === 'reimbursement' && _schemeSummary) {
      const insLabel = _reconInsCo || 'Insurance';
      return `<div class="alert al-info" style="margin-bottom:12px">
        📋 <b>${insLabel} — Reimbursement</b><br>
        ${_schemeSummary}
      </div>`;
    }
    return '';
  })();

  // Primary diagnosis for display — must match CE1
  const primaryDxBlock = reconciliation?.primary_diagnosis_code ? `
    <div class="fg">
      <label class="fl">Primary Diagnosis (same as CE1)</label>

/* ════════════════════════════════════
   CE5 — FINAL BILL
════════════════════════════════════ */
ce5: () => {
  const fmt = n => '₹' + Math.round(n||0).toLocaleString('en-IN');
  const ab_info = _ce4Data?.ab_info || {};
  const recon   = _ce4Data?.reconciliation || {};
  const abScheme = (ab_info.ab_scheme || '').toUpperCase();
  const isPmjay  = ab_info.is_ab_beneficiary && (abScheme.includes('PM-JAY') || abScheme.includes('PMJAY') || abScheme === '');
  const isCghs   = ab_info.is_ab_beneficiary && abScheme.includes('CGHS');
  const isEsi    = ab_info.is_ab_beneficiary && abScheme.includes('ESI');
  const isGovt   = isPmjay || isCghs || isEsi;

  // Prefer CE4-computed actual_gross; fall back to saved _CE.actualCharges
  const gross = recon.actual_gross || _CE.actualCharges || 0;

  // CE4 always computes patient_pay_final — use it as the ground truth for balance
  const patientPayFinal = recon.patient_pay_final ?? null;

  let billSummaryHtml = '';
  let headerAlert     = '';

  if (isPmjay) {
    const hbpRate  = ab_info.hbp_rate || recon.govt_pay_final || 0;
    const writeOff = Math.max(0, gross - hbpRate);
    headerAlert = `<div class="alert al-ok" style="font-size:13.5px;font-weight:700">
      ✅ PM-JAY Cashless — No payment required from patient
    </div>`;
    billSummaryHtml = `<table style="width:100%;font-size:13.5px"><tbody>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">Gross Hospital Charges</td>
        <td style="padding:9px 0;text-align:right;font-weight:600">${fmt(gross)}</td>
      </tr>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">PM-JAY Package Rate (Govt. pays)</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--ok)">− ${fmt(hbpRate)}</td>
      </tr>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted);font-size:11px">Hospital Adjustment (internal write-off)</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--muted);font-size:11px">− ${fmt(writeOff)}</td>
      </tr>
      <tr style="border-top:2px solid var(--border)">
        <td style="padding:10px 0;font-weight:900;font-size:16px">Patient Balance</td>
        <td style="padding:10px 0;text-align:right;font-weight:900;font-size:24px;color:var(--ok)">₹0</td>
      </tr>
    </tbody></table>`;
  } else if (isCghs || isEsi) {
    const schemeName  = isCghs ? 'CGHS' : 'ESI';
    const govtPays    = recon.govt_pay_final || 0;
    const patientPays = patientPayFinal ?? Math.max(0, gross - govtPays);
    headerAlert = patientPays === 0
      ? `<div class="alert al-ok" style="font-size:13.5px;font-weight:700">✅ ${schemeName} Cashless — No payment required from patient</div>`
      : `<div class="alert al-warn" style="font-size:13.5px;font-weight:700">⚠️ ${schemeName} — Patient must pay balance before discharge</div>`;
    billSummaryHtml = `<table style="width:100%;font-size:13.5px"><tbody>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">Gross Hospital Charges</td>
        <td style="padding:9px 0;text-align:right;font-weight:600">${fmt(gross)}</td>
      </tr>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">${schemeName} Covers</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--ok)">− ${fmt(govtPays)}</td>
      </tr>
      <tr style="border-top:2px solid var(--border)">
        <td style="padding:10px 0;font-weight:900;font-size:16px">Patient Balance</td>
        <td style="padding:10px 0;text-align:right;font-weight:900;font-size:24px;color:${patientPays===0?'var(--ok)':'var(--t1)'}">${fmt(patientPays)}</td>
      </tr>
    </tbody></table>`;
  } else {
    // Private cashless / reimbursement / self-pay
    const payMode     = (recon.payment_mode || _CE.paymentMode || '').toLowerCase();
    const insCo       = recon.insurance_co  || _CE.insuranceCo || '';
    const insLabel    = insCo ? ` (${insCo.split(' ')[0]})` : '';
    // Patient pay = CE4's computed patient_pay_final; insurance absorbs the rest
    const balance     = patientPayFinal ?? (_CE.balanceDue || 0);
    const insCovered  = patientPayFinal != null ? Math.max(0, gross - balance) : (_CE.insurancePaid || 0);
    const advance     = _CE.advancePaid || 0;
    const netBalance  = Math.max(0, balance - advance);
    headerAlert = netBalance === 0
      ? `<div class="alert al-ok" style="font-size:13.5px;font-weight:700">✅ Fully settled — No balance due</div>`
      : `<div class="alert al-err" style="font-size:13.5px;font-weight:700">⚠️ PATIENT MUST SETTLE BALANCE BEFORE DISCHARGE</div>`;
    const insRow = payMode !== 'self-pay' && insCovered > 0 ? `
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">${payMode === 'reimbursement' ? 'Insurance (Reimbursement)' + insLabel : 'Insurance Cashless' + insLabel}</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--t3)">− ${fmt(insCovered)}</td>
      </tr>` : '';
    const advRow = advance > 0 ? `
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">Advance Paid</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--t3)">− ${fmt(advance)}</td>
      </tr>` : '';
    billSummaryHtml = `<table style="width:100%;font-size:13.5px"><tbody>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">Gross Charges</td>
        <td style="padding:9px 0;text-align:right;font-weight:600">${fmt(gross)}</td>
      </tr>
      ${insRow}${advRow}
      <tr style="border-top:2px solid var(--border)">
        <td style="padding:10px 0;font-weight:900;font-size:16px">Balance Due</td>
        <td style="padding:10px 0;text-align:right;font-weight:900;font-size:24px;color:${netBalance===0?'var(--ok)':'var(--t1)'}">${fmt(netBalance)}</td>
      </tr>
    </tbody></table>`;
  }

  return `
<div class="bc">
  <span class="bc-link" onclick="showScreen('ce0')">Module B</span>
  <span class="bc-sep">/</span>
  <span class="bc-link" onclick="showScreen('ce4')">Reconciliation</span>
  <span class="bc-sep">/</span><span>Final Bill</span>
</div>
${stepFlow('ce5')}
<div class="sh">
  <h1 class="sh-title">Final Bill — ${_CE.mrn || 'Patient'}</h1>
  <span class="sh-id">CE5</span>
</div>
${headerAlert}
<div class="grid2">
  <div class="card">
    <div class="card-title">Bill Summary</div>
    ${billSummaryHtml}
    <div class="divider"></div>
    <div class="card-title">Payment Mode</div>
    <label class="radio-row"><input type="radio" name="pay-mode" value="cash" onchange="_ce5PayMode(this)"> Cash</label>
    <label class="radio-row"><input type="radio" name="pay-mode" value="upi"  onchange="_ce5PayMode(this)" checked> UPI / QR Code</label>
    <label class="radio-row"><input type="radio" name="pay-mode" value="card" onchange="_ce5PayMode(this)"> Credit / Debit Card</label>
    <label class="radio-row"><input type="radio" name="pay-mode" value="neft" onchange="_ce5PayMode(this)"> NEFT / RTGS</label>
    <div id="ce5-pay-panel" style="margin:12px 0">
      <div style="background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center">
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Scan to pay via UPI</div>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=upi://pay?pa=foqalcare.pay@icici&tn=Hospital+Bill&am=0" alt="UPI QR" style="width:120px;height:120px;border-radius:4px;display:block;margin:0 auto 8px" onerror="this.outerHTML='<div style=\'width:120px;height:120px;background:var(--border);border-radius:6px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)\'>QR</div>'">
        <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink1);margin-bottom:2px">foqalcare.pay@icici</div>
        <div style="font-size:11px;color:var(--muted)">ICICI Bank · Foqal CareOS</div>
      </div>
    </div>
    <button class="btn btn-pri" style="width:100%;justify-content:center;margin-top:4px" onclick="openModal('payment-confirm')">
      Mark as Paid &amp; Release Patient
    </button>
  </div>
  <div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">Patient Details</div>
      <table style="width:100%;font-size:12.5px"><tbody>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Name</td><td style="padding:7px 0;font-weight:700">${_CE.patientName || '—'}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">MRN</td><td style="padding:7px 0;font-family:var(--mono)">${_CE.mrn || '—'}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Admission</td><td style="padding:7px 0">${_CE.admitDate || '—'}${_CE.losDays ? ' (' + _CE.losDays + ' days)' : ''}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Discharge</td><td style="padding:7px 0">${_CE.dischargeDate || '—'}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Discharge Type</td><td style="padding:7px 0">${_CE.dischargeType || '—'}</td></tr>
        <tr><td style="padding:7px 0;color:var(--muted)">Bill generated</td><td style="padding:7px 0;font-family:var(--mono);font-size:11.5px">${new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td></tr>
      </tbody></table>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">Bill Actions</div>
      <div style="display:flex;flex-direction:column;gap:8px">

    ${(() => {
      const recon = _ce4Data?.reconciliation || {};
      const insCo = recon.insurance_co || _CE.insuranceCo || '';
      const payMode = (recon.payment_mode || _CE.paymentMode || '').toLowerCase();

          <tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 0;color:var(--muted)">Type</td><td style="padding:6px 0">${claimType}</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 0;color:var(--muted)">Pre-auth no.</td><td style="padding:6px 0;font-family:var(--mono)">${_CE.preauthNo || '—'}</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 0;color:var(--muted)">Claim status</td><td style="padding:6px 0"><span id="ce5-claim-status-badge" class="bd bd-t2">Pending Submission</span></td></tr>

    })()}
    ${(() => {
      const dischMeds = _ce4Data?.discharge?.discharge_meds || '';
      const medsLines = dischMeds.split('\n').filter(l => l.trim());
      const medsHtml = medsLines.length
        ? medsLines.map(l => `<div style="padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px">${l.trim()}</div>`).join('')

},
