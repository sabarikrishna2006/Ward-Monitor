  // The header total depends on _liveMl -- refresh it here now that this
  // function is the only remaining path that updates when real ML data
  // arrives (the old trigger, _liveRevealNext, no longer fires now that
  // the random-cost activity feed it drove has been removed).
  _liveUpdateHeader();
}

async function _liveFetch() {
  if (!_CE.hadm_id) return;
  const base = window.FOQAL_API_BASE || 'http://localhost:6017';
  try {
    const res = await fetch(`${base}/api/billing/live-charges/${_CE.hadm_id}`);
    if (!res.ok) return;
    const fresh = await res.json();
    const hadCharges = (_liveData?.charges || []).length > 0;
    const nowHasCharges = (fresh.charges || []).length > 0;
    _liveData = fresh;

    if (CURRENT !== 'ce_live') return;

    const feed = document.getElementById('live-feed');

    if (!nowHasCharges) {
      // Still waiting — show "no activity yet" placeholder and poll fast
      if (feed && !feed.querySelector('[data-waiting]')) {
        feed.innerHTML = `<div data-waiting="1" style="padding:48px 24px;text-align:center">
          <div style="font-size:32px;margin-bottom:12px;animation:livePulse 2s ease-in-out infinite">🏥</div>
          <div style="font-size:14px;font-weight:600;color:#374151;margin-bottom:6px">No procedures recorded yet</div>
          <div style="font-size:12px;color:#9ca3af">Charges will appear here as activity is logged</div>
          <div style="margin-top:16px;display:flex;justify-content:center;gap:6px">
            <span style="width:8px;height:8px;border-radius:50%;background:#d1d5db;animation:liveDot 1.4s ease-in-out infinite"></span>
            <span style="width:8px;height:8px;border-radius:50%;background:#d1d5db;animation:liveDot 1.4s ease-in-out .2s infinite"></span>
            <span style="width:8px;height:8px;border-radius:50%;background:#d1d5db;animation:liveDot 1.4s ease-in-out .4s infinite"></span>
          </div>
        </div>`;
      }
      _liveWaiting = true;
      _liveSchedulePoll(5000); // poll every 5s while waiting
    } else {
      if (_liveWaiting || !hadCharges) {
        // Charges just appeared — clear placeholder, kick off reveal
        _liveWaiting = false;
        _liveShown = 0;
        if (feed) feed.innerHTML = '';
        clearTimeout(_liveTimer);
        _liveRevealNext();
        _liveSchedulePoll(20000); // back to slow poll
      } else {
        // Normal refresh — just update header
        _liveRevealNext();
      }
    }

    _liveUpdateHeader();

    // Auto-transition if reconciliation is ready
    if (_liveData.billing_phase === 'reconciliation_pending') {
      clearTimeout(_liveTimer);
      clearInterval(_livePhaseTimer);
      setTimeout(() => showScreen('ce4'), 1200);
    }
  } catch(e) {}
}

function _liveSchedulePoll(ms) {
  clearInterval(_livePhaseTimer);
  _livePhaseTimer = setInterval(_liveFetch, ms);
}

function _liveStart() {
  _liveShown   = 0;
  _liveWaiting = false;
  clearTimeout(_liveTimer);
  clearInterval(_livePhaseTimer);
  clearInterval(_liveMlTimer);
  _liveFetch();
  _liveSchedulePoll(20000);
  _liveFetchMl();
  _liveMlTimer = setInterval(_liveFetchMl, _LIVE_ML_POLL_MS);
}

function _liveStop() {
  clearTimeout(_liveTimer);
  clearInterval(_livePhaseTimer);
  clearInterval(_liveMlTimer);
}

function _liveUpdateHeader() {
  if (!_liveData) return;
  const totalEl = document.getElementById('live-running-total');
  const barEl   = document.getElementById('live-progress-bar');
  const phaseEl = document.getElementById('live-phase-badge');
  if (!totalEl) return;

  // Only ever show the ML model's real cumulative cost here -- never the
  // legacy random per-event tally. Showing a fabricated number (even
  // briefly, before _liveMl loads) is worse than showing "loading", since
  // it looks like a real charge and can't be told apart from one.
  if (!_liveMl) {
    totalEl.textContent = 'Loading…';
    const barWrap = barEl?.parentElement;
    if (barWrap) barWrap.style.display = 'none';
  } else {
    const charged = _liveMl.cumulative_cost_so_far;
    const est     = _liveMl.predicted_final_bill_p50 || 0;
    totalEl.textContent = '₹' + charged.toLocaleString('en-IN');
    const barWrap = barEl?.parentElement;
    if (barWrap) barWrap.style.display = est > 0 ? '' : 'none';
    if (barEl && est > 0) {
      const pct = Math.min(100, Math.round(charged / est * 100));
      barEl.style.width = pct + '%';
      barEl.style.background = pct > 90 ? '#dc2626' : pct > 70 ? '#d97706' : '#059669';
    }
  }
  if (phaseEl) {
    const phase = _liveData.billing_phase || 'initial_estimate';
    const phaseMap = { initial_estimate:'Estimate Saved', estimate_shared:'Estimate Shared', reconciliation_pending:'Ready for Reconciliation' };
    phaseEl.textContent = phaseMap[phase] || phase;
    phaseEl.style.background = phase === 'reconciliation_pending' ? '#059669' : '#0369a1';
  }
}

function _liveNextDelay(prevTime, curTime) {
  // Same-day charges reveal at a steady clip; crossing into a new calendar
  // day adds a long pause so the tracker reads as days actually passing,
  // not the whole admission dumping out in a few seconds.
  if (!prevTime) return _LIVE_REVEAL_INTERVAL;
  return prevTime.slice(0, 10) === curTime.slice(0, 10)
    ? _LIVE_REVEAL_INTERVAL
    : _LIVE_DAY_GAP_INTERVAL;
}

function _liveRevealNext() {
  if (!_liveData) return;
  const charges = _liveData.charges || [];
  clearTimeout(_liveTimer);
  if (_liveShown >= charges.length) return;

  const prevTime = _liveShown > 0 ? charges[_liveShown - 1].time : null;
  const c    = charges[_liveShown];
  _liveShown++;
  const feed = document.getElementById('live-feed');
  if (!feed) return;

  const icons = { medication:'💊', procedure:'🔬', procedure_event:'⚕️' };
  const colors = { medication:'#0369a1', procedure:'#7c3aed', procedure_event:'#059669' };
  const ic   = icons[c.type]  || '📋';
  const col  = colors[c.type] || '#374151';

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;animation:fadeSlideIn .4s ease;border-left:3px solid ' + col;
  row.innerHTML = `
    <span style="font-size:18px;flex-shrink:0">${ic}</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:700;color:#111827">${c.name}</div>
      <div style="font-size:11px;color:#6b7280;margin-top:1px">${c.detail || ''} · ${(c.time||'').slice(0,16)}</div>
    </div>
    <div style="text-align:right;flex-shrink:0">
      <div style="font-size:10px;color:#9ca3af;font-weight:700;text-transform:uppercase">${c.category || c.type || 'Logged'}</div>
    </div>`;
  feed.prepend(row);
  _liveUpdateHeader();

  if (_liveShown < charges.length) {
    _liveTimer = setTimeout(_liveRevealNext, _liveNextDelay(prevTime, c.time));
  }
}

  const fmt      = n => 'Rs.' + (n||0).toLocaleString('en-IN');
  const band     = _CE.cost || 'expected';
  const bandAmt  = band==='floor' ? (ml?.predicted_final_bill_p10||0) : band==='ceiling' ? (ml?.predicted_final_bill_p90||0) : (ml?.predicted_final_bill_p50||0);
  const bandLabel= band === 'floor' ? 'Low' : band === 'ceiling' ? 'High' : 'Typical';
  const now      = new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

  const bd = ml?.cost_breakdown || {};
  const lineText = [
    ['Ward Charges', bd.ward], ['ICU / CCU Charges', bd.icu], ['Procedures', bd.procedures],
    ['Medicines & Consumables', bd.medicines], ['Labs & Diagnostics', bd.labs],
  ].filter(([, amt]) => amt).map(([name, amt]) => `  ${name}: ${fmt(amt)}`).join('\n');

  const subject = encodeURIComponent(`Cost Estimate — ${_CE.mrn||'Patient'} | Foqal CareOS`);
  const body = encodeURIComponent(
`Dear Patient / Family,

Please find below the cost estimate for your hospitalisation at our facility.

━━━━━━━━━━━━━━━━━━━━━━
PATIENT DETAILS
━━━━━━━━━━━━━━━━━━━━━━
Patient MRN  : ${_CE.mrn||'—'}
Name         : ${_CE.patientName||'—'}
Diagnosis    : ${_CE.diagnosis||'—'}
Admission    : ${_CE.admitDate||'—'} (${_CE.losDays||'—'} days)
Ward / Bed   : ${_CE.wardType||'—'}

━━━━━━━━━━━━━━━━━━━━━━
COST ESTIMATE
━━━━━━━━━━━━━━━━━━━━━━
Selected Estimate : ${bandLabel} — ${fmt(bandAmt)}
Low     : ${fmt(ml?.predicted_final_bill_p10||0)}
Typical : ${fmt(ml?.predicted_final_bill_p50||0)}
High    : ${fmt(ml?.predicted_final_bill_p90||0)}

COST BREAKDOWN
${lineText}

━━━━━━━━━━━━━━━━━━━━━━
Note: This is an ML-predicted estimate (XGBoost quantile model, trained on real DCM admissions), not a fixed quote. Actual charges may vary at discharge during reconciliation.

Generated: ${now}
Foqal CareOS — Billing Department
`);

  if (email) {
    // Open Gmail compose in new tab — works on any browser without a mail client
    const gmailUrl = `https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(email)}&su=${subject}&body=${body}`;
    window.open(gmailUrl, '_blank');
  }

  const btn = document.querySelector('[onclick="_ce3Notify()"]');
  const ok  = document.getElementById('ce3-notify-ok');
  if (btn) { btn.textContent = 'Gmail opened!'; btn.style.background = '#16a34a'; btn.disabled = true; }
  if (ok)  { ok.textContent = email ? `Compose window opened for ${email} — click Send in Gmail` : 'Check your browser'; ok.style.display = 'block'; }
}
</script>

<!-- CE2b modal -->
<div id="ce2b-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:460px;padding:28px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.25);position:relative">
    <div style="font-size:15px;font-weight:800;color:var(--ink);margin-bottom:18px">Confirm Estimate Save</div>
    <table style="width:100%;font-size:13px;border-collapse:collapse;margin-bottom:16px"><tbody>
      <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 0;color:var(--muted);width:110px">Patient</td><td id="ce2b-patient" style="padding:9px 0;font-weight:700"></td></tr>
      <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 0;color:var(--muted)">Selected band</td><td id="ce2b-band" style="padding:9px 0;font-weight:700"></td></tr>
      <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 0;color:var(--muted)">Entered by</td><td id="ce2b-enteredby" style="padding:9px 0"></td></tr>
      <tr><td style="padding:9px 0;color:var(--muted)">Timestamp</td><td id="ce2b-ts" style="padding:9px 0;font-family:var(--mono);font-size:11.5px"></td></tr>
    </tbody></table>
    <div class="alert al-warn" style="margin-bottom:18px">⚠️ This estimate will be shared with the patient. Actual charges may vary at discharge (reconciliation).</div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sec" onclick="_closeCe2bModal()">← Back</button>
      <button class="btn btn-pri" onclick="_ce2bSave()">Save &amp; Proceed →</button>
    </div>
  </div>
</div>

<!-- Signed discharge summary modal (read-only, Final Bill Completed tab) -->
<div id="ds-summary-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:760px;max-height:85vh;padding:28px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.25);position:relative;overflow:auto">
    <div id="ds-summary-modal-body"></div>
  </div>
</div>
</body>
</html>
