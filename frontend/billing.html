  <tr><td class="label" style="padding-right:24px">Patient</td><td><b>${_CE.mrn||'—'} — ${_CE.patientName||'—'}</b></td></tr>
  <tr><td class="label">Diagnosis</td><td>${_CE.diagnosis||'—'}</td></tr>
  <tr><td class="label">Admission</td><td>${_CE.admitDate||'—'} &nbsp;(${_CE.losDays||'—'} days)</td></tr>
  <tr><td class="label">Ward / Bed</td><td>${_CE.wardType||'—'}</td></tr>
  <tr><td class="label">HBP Code</td><td>${est?.hbp_code||'—'} — ${est?.hbp_package_name||'—'}</td></tr>
</tbody></table>
<div class="section">
  <div class="label">Selected Estimate Band</div>
  <div class="val">${fmt(bandAmt)} (${bandLabel})</div>
  <div style="font-size:11px;color:#555;margin-top:4px">Floor: ${fmt(est?.floor_est||0)} &nbsp;·&nbsp; Expected: ${fmt(est?.expected_est||0)} &nbsp;·&nbsp; Ceiling: ${fmt(est?.ceiling_est||0)}</div>
</div>
<div class="section">
  <b style="font-size:12px">Cost Breakdown</b>
  <table><thead><tr><th>Line Item</th><th style="text-align:right">Amount</th><th style="text-align:right">%</th></tr></thead>
  <tbody>${lineRows}</tbody></table>
</div>
<div class="section">
  <b style="font-size:12px">Insurance / Payment</b>
  <table style="width:auto"><tbody>
    <tr><td class="label" style="padding-right:24px">Mode</td><td>${_CE.paymentMode||'—'}</td></tr>
    <tr><td class="label">Insurer</td><td>${_CE.insuranceCo||'—'}</td></tr>
    <tr><td class="label">Pre-auth No.</td><td>${_CE.preauthNo||'—'}</td></tr>
  </tbody></table>
</div>
<div class="footer">⚠ This is a cost estimate only. Actual charges may vary at discharge (CE4 reconciliation). &nbsp;|&nbsp; NHA HBP 2.2 reference rates · Private multiplier ×12</div>
</body></html>`;
}

function _ce3Print() {
  const w = window.open('','_blank','width=800,height=900');
  w.document.write(_ce3PrintHtml());
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 400);
}

function _ce3Pdf() {
  const w = window.open('','_blank','width=800,height=900');
  const html = _ce3PrintHtml().replace(
    '</body>',
    `<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:6px;padding:10px 14px;margin-top:20px;font-size:12px;color:#92400e">
      <b>To save as PDF:</b> In the print dialog, set <b>Destination → Save as PDF</b>, then click Save.
    </div></body>`
  );
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 400);
}

function _ce3Notify() {
  const email  = document.getElementById('ce3-email')?.value?.trim();
  const mobile = document.getElementById('ce3-mobile')?.value?.trim();
  if (!email && !mobile) {
    alert('Enter at least an email address or mobile number.');
    return;
  }

  const est      = _CE.estimateData;
  const fmt      = n => 'Rs.' + (n||0).toLocaleString('en-IN');
  const band     = _CE.cost || 'expected';
  const bandAmt  = band==='floor' ? (est?.floor_est||0) : band==='ceiling' ? (est?.ceiling_est||0) : (est?.expected_est||0);
  const bandLabel= band.charAt(0).toUpperCase()+band.slice(1);
  const now      = new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

  const lineText = (est?.line_items||[]).map(i => `  ${i.name}: ${fmt(i.amount)} (${i.pct}%)`).join('\n');

  const subject = encodeURIComponent(`Cost Estimate — ${_CE.mrn||'Patient'} | Foqal CareOS`);
  const body = encodeURIComponent(
`Dear Patient / Family,

Please find below the cost estimate for your hospitalisation at our facility.

━━━━━━━━━━━━━━━━━━━━━━
PATIENT DETAILS
━━━━━━━━━━━━━━━━━━━━━━
Patient MRN  : ${_CE.mrn||'—'}
Name         : ${_CE.patientName||'—'}
Diagnosis    : ${_CE.diagnosis||'—'}
Admission    : ${_CE.admitDate||'—'} (${_CE.losDays||'—'} days)
Ward / Bed   : ${_CE.wardType||'—'}

━━━━━━━━━━━━━━━━━━━━━━
COST ESTIMATE
━━━━━━━━━━━━━━━━━━━━━━
Selected Band  : ${bandLabel} — ${fmt(bandAmt)}
Floor Estimate : ${fmt(est?.floor_est||0)}
Expected       : ${fmt(est?.expected_est||0)}
Ceiling        : ${fmt(est?.ceiling_est||0)}

COST BREAKDOWN
${lineText}

━━━━━━━━━━━━━━━━━━━━━━
INSURANCE / PAYMENT
━━━━━━━━━━━━━━━━━━━━━━
Payment Mode : ${_CE.paymentMode||'—'}
Insurer      : ${_CE.insuranceCo||'—'}
Pre-auth No. : ${_CE.preauthNo||'—'}

━━━━━━━━━━━━━━━━━━━━━━
Note: This is a cost estimate only. Actual charges may vary at discharge during CE4 reconciliation. Reference: NHA HBP 2.2 rates × private multiplier.

Generated: ${now}
Foqal CareOS — Billing Department
`);

  if (email) {
    // Open Gmail compose in new tab — works on any browser without a mail client
    const gmailUrl = `https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(email)}&su=${subject}&body=${body}`;
    window.open(gmailUrl, '_blank');
  }

  const btn = document.querySelector('[onclick="_ce3Notify()"]');
  const ok  = document.getElementById('ce3-notify-ok');
  if (btn) { btn.textContent = 'Gmail opened!'; btn.style.background = '#16a34a'; btn.disabled = true; }
  if (ok)  { ok.textContent = email ? `Compose window opened for ${email} — click Send in Gmail` : 'Check your browser'; ok.style.display = 'block'; }
}
</script>

<!-- CE2b modal -->
<div id="ce2b-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:460px;padding:28px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.25);position:relative">
    <div style="font-size:15px;font-weight:800;color:var(--ink);margin-bottom:18px">Confirm Estimate Save</div>
    <table style="width:100%;font-size:13px;border-collapse:collapse;margin-bottom:16px"><tbody>
      <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 0;color:var(--muted);width:110px">Patient</td><td id="ce2b-patient" style="padding:9px 0;font-weight:700"></td></tr>
      <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 0;color:var(--muted)">Selected band</td><td id="ce2b-band" style="padding:9px 0;font-weight:700"></td></tr>
      <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 0;color:var(--muted)">Insurance</td><td id="ce2b-insurance" style="padding:9px 0"></td></tr>
      <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 0;color:var(--muted)">Pre-auth No.</td><td id="ce2b-preauth" style="padding:9px 0;font-family:var(--mono);font-size:11.5px"></td></tr>
      <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 0;color:var(--muted)">Entered by</td><td id="ce2b-enteredby" style="padding:9px 0"></td></tr>
      <tr><td style="padding:9px 0;color:var(--muted)">Timestamp</td><td id="ce2b-ts" style="padding:9px 0;font-family:var(--mono);font-size:11.5px"></td></tr>

      <button class="btn btn-pri" onclick="_ce2bSave()">Save &amp; Proceed →</button>
    </div>
  </div>
</div>
</body>
