/* ════════════════════════════════════
   CE4 — CE RECONCILIATION
════════════════════════════════════ */
ce4: () => {
  const hdr = `
<div class="bc">
  <span class="bc-link" onclick="showScreen('ce0')">Module B</span>
  <span class="bc-sep">/</span><span>Reconciliation</span>
</div>
${stepFlow('ce4')}
<div class="sh">
  <h1 class="sh-title">Cost Reconciliation</h1>
  <span class="sh-id">CE4</span>
</div>`;

  if (!_ce4Data) {
    return hdr + `<div style="padding:48px;text-align:center;color:var(--muted)">Loading reconciliation data…</div>`;
  }

  const { patient, discharge, estimate, ab_info, actuals_saved, reconciliation } = _ce4Data;
  const reconItems   = reconciliation?.computed_actual_items || [];
  // computed_estimate_items is always empty by design (the ML model predicts
  // a total range, not a per-category future breakdown -- no real
  // "estimated per line item" ever existed to show). Scale the real actual
  // breakdown's category MIX to the ML's quoted total instead: "if the bill
  // had come in at what was estimated, this is roughly how it would have
  // split by category." Keeps the Estimated column honest (a real, distinct
  // number) rather than just duplicating the Actual column with an always-0%
  // variance, which silently implied every estimate was perfect.
  const _estTotal  = estimate.est_total || 0;
  const _actualSum = reconItems.reduce((s, it) => s + (it.amount || 0), 0);
  const _hasRealEstimateItems = !!(estimate.line_items?.length || reconciliation?.computed_estimate_items?.length);
  const lineItems = _hasRealEstimateItems
    ? (estimate.line_items?.length ? estimate.line_items : reconciliation.computed_estimate_items)
    : (_actualSum > 0 && _estTotal > 0
        ? reconItems.map(it => ({ name: it.name, amount: Math.round((it.amount / _actualSum) * _estTotal) }))
        : reconItems);
  const savedActuals = actuals_saved ? (actuals_saved.actual_line_items || []) : [];
  const fmt = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');

  const signedBadge = discharge.signed_at
    ? `✅ <b>Auto-populated from Module A</b> — Signed by <b>${discharge.signed_by || 'Doctor'}</b> on ${discharge.signed_at}`
    : `⏳ <b>Pending signature</b> — Discharge summary not yet signed off`;
  const alertClass = discharge.signed_at ? 'al-ok' : 'al-warn';

  const losStr = (() => {
    const actual = discharge.actual_los || 0;
    const expected = reconciliation?.expected_los;
    const diff = reconciliation?.los_diff;
    const losDates = [discharge.admit_date, discharge.discharge_date].filter(Boolean).join(' – ');
    if (expected && diff !== undefined) {
      const diffStr = diff > 0 ? `+${diff} days longer than estimated` : diff < 0 ? `${diff} days shorter than estimated` : 'matched estimate';
      return `Actual: ${actual} days (${losDates}) · Estimated: ${expected} days · ${diffStr}`;
    }
    const parts = [actual + ' day' + (actual !== 1 ? 's' : '')];
    if (losDates) parts.push(losDates);
    return parts.join(' ');
  })();

  const bandLabel = { floor: 'Low', expected: 'Typical', ceiling: 'High' }[estimate.selected_band] || 'Typical';
  const estBandDisplay = `ML estimate, ${bandLabel} — ${fmt(estimate.est_total)}`;

  const varRows = lineItems.map((item, i) => {
    const est      = item.amount || 0;
    const saved    = savedActuals[i]?.amount;
    // Pre-fill with MIMIC-derived actual estimate if not yet manually entered
    const computed = reconItems[i]?.amount;
    const preVal   = saved != null ? saved : (computed != null ? computed : '');
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:6px 4px;font-size:12px">${item.name}</td>
      <td style="padding:6px 4px;text-align:right;font-size:12px;color:var(--ink2)">${fmt(est)}</td>
      <td style="padding:6px 4px;text-align:right">
        <input type="number" id="ce4-act-${i}" data-est="${est}" value="${preVal}"
          placeholder="0"
          style="width:110px;text-align:right;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit"
          oninput="_ce4ComputeVariance()">
      </td>
      <td id="ce4-var-${i}" style="padding:6px 4px;text-align:right;font-size:12px;color:var(--muted)">—</td>
    </tr>`;
  }).join('');

  const _schemeSummary = reconciliation?.scheme_summary || '';
  const _patientFinal  = reconciliation?.patient_pay_final;
  const _govtFinal     = reconciliation?.govt_pay_final;
  const _reconPayMode  = (reconciliation?.payment_mode || '').toLowerCase();
  const _reconInsCo    = reconciliation?.insurance_co || '';
  const abBlock = (() => {
    if (ab_info.is_ab_beneficiary) {
      const scheme = ab_info.ab_scheme || 'PM-JAY';
      const schemeClass = scheme.includes('CGHS') ? 'al-info' : 'al-ok';
      const schemeIcon  = scheme.includes('CGHS') ? 'ℹ️' : '✅';
      const patientLine = _patientFinal != null
        ? `<br><b>Patient pays: ${fmt(_patientFinal)}</b>${_govtFinal ? ` · Scheme reimburses: ${fmt(_govtFinal)}` : ''}`
        : '';
      return `<div class="alert ${schemeClass}" style="margin-bottom:12px">
        ${schemeIcon} <b>${scheme}</b><br>
        ${_schemeSummary || `Government reimburses up to ${fmt(_govtFinal)}.`}${patientLine}
      </div>`;
    }
    if (_reconPayMode === 'cashless' && _schemeSummary) {
      const insLabel = _reconInsCo || 'Insurance';
      return `<div class="alert al-ok" style="margin-bottom:12px">
        🏥 <b>${insLabel} — Cashless</b><br>
        ${_schemeSummary}<br>
        <b>Patient liability: ${fmt(_patientFinal)}</b>
      </div>`;
    }
    if (_reconPayMode === 'reimbursement' && _schemeSummary) {
      const insLabel = _reconInsCo || 'Insurance';
      return `<div class="alert al-info" style="margin-bottom:12px">
        📋 <b>${insLabel} — Reimbursement</b><br>
        ${_schemeSummary}
      </div>`;
    }
    return '';
  })();

  // Primary diagnosis for display — must match CE1
  const primaryDxBlock = reconciliation?.primary_diagnosis_code ? `
    <div class="fg">
      <label class="fl">Primary Diagnosis (same as CE1)</label>
      <input class="fi" value="${reconciliation.primary_diagnosis_code} — ${reconciliation.primary_diagnosis_title || ''}" readonly style="background:var(--surf)">
      <div class="fi-hint">✓ From MIMIC diagnoses (seq_num=1) — consistent with cost estimator</div>
    </div>` : '';

  const losHighlight = reconciliation?.los_diff
    ? (reconciliation.los_diff > 0 ? `style="color:var(--err)"` : `style="color:var(--ok)"`)
    : '';
  const complexityNote = reconciliation?.actual_complexity
    ? `Complexity: ×${reconciliation.actual_complexity} (ICU: ${reconciliation.icu_days}d, procedures: ${reconciliation.procedure_count})`
    : '';

  return hdr + `
<div class="alert ${alertClass}" style="margin-bottom:16px">${signedBadge}</div>
<div class="grid2">
  <div class="card">
    <div class="card-title">Auto-filled from Signed Discharge Summary</div>
    ${primaryDxBlock}
    <div class="fg">
      <label class="fl">Final Diagnosis (§13 — discharge summary) <span style="font-size:10px;color:var(--muted);font-weight:400">· AI-summarised for billing</span></label>
      <textarea class="fi" id="ce4-final-dx" rows="3" readonly style="background:var(--surf)" data-original="${(discharge.final_diagnosis || '').replace(/"/g,'&quot;')}">${discharge.final_diagnosis || 'Not documented'}</textarea>
      <div class="fi-hint">✓ From signed discharge summary — AI picks most billing-relevant diagnoses</div>
    </div>
    <div class="fg">
      <label class="fl">Procedures Performed (§10) <span style="font-size:10px;color:var(--muted);font-weight:400">· AI-summarised</span></label>
      <textarea class="fi" id="ce4-procedures" rows="4" readonly style="background:var(--surf)" data-original="${(discharge.procedures || '').replace(/"/g,'&quot;')}">${discharge.procedures || 'Not documented'}</textarea>
    </div>
    <div class="fg">
      <label class="fl">Length of Stay</label>
      <input class="fi" value="${losStr}" readonly style="background:var(--surf)" ${losHighlight}>
      ${complexityNote ? `<div class="fi-hint">${complexityNote}</div>` : ''}
    </div>
    <div class="fg">
      <label class="fl">Discharge Medications (§11) <span style="font-size:10px;color:var(--muted);font-weight:400">· AI-summarised</span></label>
      <textarea class="fi" id="ce4-meds" rows="4" readonly style="background:var(--surf)" data-original="${(discharge.discharge_meds || '').replace(/"/g,'&quot;')}">${discharge.discharge_meds || 'Not documented'}</textarea>
    </div>
    <div class="fg">
      <label class="fl">Signed by</label>
      <input class="fi" value="${discharge.signed_by ? discharge.signed_by + (discharge.signed_at ? ' · ' + discharge.signed_at : '') : 'Not yet signed'}" readonly style="background:var(--surf)">
    </div>
    <div class="fg" style="margin-top:8px">
      <label class="fl">Estimate reference</label>
      <input class="fi" value="${estBandDisplay}" readonly style="background:var(--surf);font-size:11px">
    </div>
  </div>
  <div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">Variance Analysis — actual vs. estimated charges</div>
      ${reconItems.length ? `<div class="fi-hint" style="margin-bottom:8px">Actuals pre-filled from MIMIC data (actual LOS × real complexity). Edit any line item if charges differ.</div>` : ''}
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="border-bottom:2px solid var(--border)">
          <th style="padding:6px 4px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Item</th>
          <th style="padding:6px 4px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Estimated</th>
          <th style="padding:6px 4px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Actual (₹)</th>
          <th style="padding:6px 4px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Variance</th>
        </tr></thead>
        <tbody>${varRows}</tbody>
        <tfoot><tr id="ce4-total-row" style="border-top:2px solid var(--border)">
          <td colspan="4" style="padding:8px 4px;color:var(--muted);font-style:italic">Enter all actual amounts above to see totals</td>
        </tr></tfoot>
      </table>
    </div>
    ${abBlock}
    <div id="ce4-variance-alert" class="alert al-info" style="margin-bottom:12px">Enter actual charges for each line item above to compute variance.</div>
    <div class="fg" style="margin-bottom:12px">
      <label class="fl">Reconciliation Notes (optional)</label>
      <textarea class="fi" id="ce4-notes" rows="2" placeholder="Any remarks on cost differences…">${actuals_saved?.reconciliation_notes || ''}</textarea>

    <div style="display:flex;gap:8px;justify-content:flex-end">

},

/* ════════════════════════════════════
   CE5 — FINAL BILL
════════════════════════════════════ */
ce5: () => {
  const fmt = n => '₹' + Math.round(n||0).toLocaleString('en-IN');
  const ab_info = _ce4Data?.ab_info || {};
  const recon   = _ce4Data?.reconciliation || {};
  const abScheme = (ab_info.ab_scheme || '').toUpperCase();
  const isPmjay  = ab_info.is_ab_beneficiary && (abScheme.includes('PM-JAY') || abScheme.includes('PMJAY') || abScheme === '');
  const isCghs   = ab_info.is_ab_beneficiary && abScheme.includes('CGHS');
  const isEsi    = ab_info.is_ab_beneficiary && abScheme.includes('ESI');
  const isGovt   = isPmjay || isCghs || isEsi;

  // Prefer CE4-computed actual_gross; fall back to saved _CE.actualCharges
  const gross = recon.actual_gross || _CE.actualCharges || 0;

  // CE4 always computes patient_pay_final — use it as the ground truth for balance
  const patientPayFinal = recon.patient_pay_final ?? null;

  let billSummaryHtml = '';
  let headerAlert     = '';

  if (isPmjay) {
    const hbpRate  = ab_info.hbp_rate || recon.govt_pay_final || 0;
    const writeOff = Math.max(0, gross - hbpRate);
    headerAlert = `<div class="alert al-ok" style="font-size:13.5px;font-weight:700">
      ✅ PM-JAY Cashless — No payment required from patient
    </div>`;
    billSummaryHtml = `<table style="width:100%;font-size:13.5px"><tbody>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">Gross Hospital Charges</td>
        <td style="padding:9px 0;text-align:right;font-weight:600">${fmt(gross)}</td>
      </tr>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">PM-JAY Covers (ML-quoted estimate)</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--ok)">− ${fmt(hbpRate)}</td>
      </tr>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted);font-size:11px">Hospital Adjustment (internal write-off)</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--muted);font-size:11px">− ${fmt(writeOff)}</td>
      </tr>
      <tr style="border-top:2px solid var(--border)">
        <td style="padding:10px 0;font-weight:900;font-size:16px">Patient Balance</td>
        <td style="padding:10px 0;text-align:right;font-weight:900;font-size:24px;color:var(--ok)">₹0</td>
      </tr>
    </tbody></table>`;
  } else if (isCghs || isEsi) {
    const schemeName  = isCghs ? 'CGHS' : 'ESI';
    const govtPays    = recon.govt_pay_final || 0;
    const patientPays = patientPayFinal ?? Math.max(0, gross - govtPays);
    headerAlert = patientPays === 0
      ? `<div class="alert al-ok" style="font-size:13.5px;font-weight:700">✅ ${schemeName} Cashless — No payment required from patient</div>`
      : `<div class="alert al-warn" style="font-size:13.5px;font-weight:700">⚠️ ${schemeName} — Patient must pay balance before discharge</div>`;
    billSummaryHtml = `<table style="width:100%;font-size:13.5px"><tbody>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">Gross Hospital Charges</td>
        <td style="padding:9px 0;text-align:right;font-weight:600">${fmt(gross)}</td>
      </tr>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">${schemeName} Covers</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--ok)">− ${fmt(govtPays)}</td>
      </tr>
      <tr style="border-top:2px solid var(--border)">
        <td style="padding:10px 0;font-weight:900;font-size:16px">Patient Balance</td>
        <td style="padding:10px 0;text-align:right;font-weight:900;font-size:24px;color:${patientPays===0?'var(--ok)':'var(--t1)'}">${fmt(patientPays)}</td>
      </tr>
    </tbody></table>`;
  } else {
    // Private cashless / reimbursement / self-pay
    const payMode     = (recon.payment_mode || _CE.paymentMode || '').toLowerCase();
    const insCo       = recon.insurance_co  || _CE.insuranceCo || '';
    const insLabel    = insCo ? ` (${insCo.split(' ')[0]})` : '';
    // Patient pay = CE4's computed patient_pay_final; insurance absorbs the rest
    const balance     = patientPayFinal ?? (_CE.balanceDue || 0);
    const insCovered  = patientPayFinal != null ? Math.max(0, gross - balance) : (_CE.insurancePaid || 0);
    const advance     = _CE.advancePaid || 0;
    const netBalance  = Math.max(0, balance - advance);
    headerAlert = netBalance === 0
      ? `<div class="alert al-ok" style="font-size:13.5px;font-weight:700">✅ Fully settled — No balance due</div>`
      : `<div class="alert al-err" style="font-size:13.5px;font-weight:700">⚠️ PATIENT MUST SETTLE BALANCE BEFORE DISCHARGE</div>`;
    const insRow = payMode !== 'self-pay' && insCovered > 0 ? `
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">${payMode === 'reimbursement' ? 'Insurance (Reimbursement)' + insLabel : 'Insurance Cashless' + insLabel}</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--t3)">− ${fmt(insCovered)}</td>
      </tr>` : '';
    const advRow = advance > 0 ? `
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">Advance Paid</td>
        <td style="padding:9px 0;text-align:right;font-weight:600;color:var(--t3)">− ${fmt(advance)}</td>
      </tr>` : '';
    billSummaryHtml = `<table style="width:100%;font-size:13.5px"><tbody>
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 0;color:var(--muted)">Gross Charges</td>
        <td style="padding:9px 0;text-align:right;font-weight:600">${fmt(gross)}</td>
      </tr>
      ${insRow}${advRow}
      <tr style="border-top:2px solid var(--border)">
        <td style="padding:10px 0;font-weight:900;font-size:16px">Balance Due</td>
        <td style="padding:10px 0;text-align:right;font-weight:900;font-size:24px;color:${netBalance===0?'var(--ok)':'var(--t1)'}">${fmt(netBalance)}</td>
      </tr>
    </tbody></table>`;
  }

  return `
<div class="bc">
  <span class="bc-link" onclick="showScreen('ce0')">Module B</span>
  <span class="bc-sep">/</span>
  <span class="bc-link" onclick="showScreen('ce4')">Reconciliation</span>
  <span class="bc-sep">/</span><span>Final Bill</span>
</div>
${stepFlow('ce5')}
<div class="sh">
  <h1 class="sh-title">Final Bill — ${_CE.mrn || 'Patient'}</h1>
  <span class="sh-id">CE5</span>
</div>
${headerAlert}
<div class="grid2">
  <div class="card">
    <div class="card-title">Bill Summary</div>
    ${billSummaryHtml}
  </div>
  <div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">Patient Details</div>
      <table style="width:100%;font-size:12.5px"><tbody>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Name</td><td style="padding:7px 0;font-weight:700">${_CE.patientName || '—'}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">MRN</td><td style="padding:7px 0;font-family:var(--mono)">${_CE.mrn || '—'}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Admission</td><td style="padding:7px 0">${_CE.admitDate || '—'}${_CE.losDays ? ' (' + _CE.losDays + ' days)' : ''}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Discharge</td><td style="padding:7px 0">${_CE.dischargeDate || '—'}</td></tr>
        <tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;color:var(--muted)">Discharge Type</td><td style="padding:7px 0">${_CE.dischargeType || '—'}</td></tr>
        <tr><td style="padding:7px 0;color:var(--muted)">Bill generated</td><td style="padding:7px 0;font-family:var(--mono);font-size:11.5px">${new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td></tr>
      </tbody></table>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">Bill Actions</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-sec btn-sm" style="justify-content:flex-start" onclick="_ce5Print()">🖨️ Print Bill (A4)</button>
        <button class="btn btn-sec btn-sm" style="justify-content:flex-start" onclick="_ce5Email()">📧 Email to Patient</button>
        <button class="btn btn-sec btn-sm" style="justify-content:flex-start" onclick="_ce5Download()">📄 Download PDF</button>
      </div>
    </div>
    ${(() => {
      const recon = _ce4Data?.reconciliation || {};
      const insCo = recon.insurance_co || _CE.insuranceCo || '';
      const payMode = (recon.payment_mode || _CE.paymentMode || '').toLowerCase();
      const isGovtScheme = _ce4Data?.ab_info?.is_ab_beneficiary;
      if (isGovtScheme || payMode === 'self-pay' || !insCo) return '';
      const insLabel = insCo.split(' ')[0];
      const claimType = payMode === 'reimbursement' ? 'Reimbursement' : 'Cashless';
      return `<div class="card" style="margin-bottom:12px">
        <div class="card-title">Insurance Claim Status</div>
        <table style="width:100%;font-size:12px"><tbody>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 0;color:var(--muted)">Insurer</td><td style="padding:6px 0;font-weight:600">${insCo}</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 0;color:var(--muted)">Type</td><td style="padding:6px 0">${claimType}</td></tr>
          ${claimType === 'Cashless' ? `<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 0;color:var(--muted)">Pre-auth no.</td><td style="padding:6px 0;font-family:var(--mono)">${_CE.preauthNo || '—'}</td></tr>` : ''}
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 0;color:var(--muted)">Claim status</td><td style="padding:6px 0"><span id="ce5-claim-status-badge" class="bd bd-t2">Pending Submission</span></td></tr>
          <tr><td style="padding:6px 0;color:var(--muted)">Submit claim</td><td style="padding:6px 0">
            <button id="ce5-submit-claim-btn" class="btn btn-sec btn-xs" onclick="_ce5SubmitClaim('${insLabel}')">Submit to ${insLabel}</button>
          </td></tr>
        </tbody></table>
        <div style="font-size:11px;color:var(--muted);margin-top:8px">After discharge, submit all documents (discharge summary, bills, investigation reports) to ${insLabel}'s TPA portal for claim settlement.</div>
      </div>`;
    })()}
    ${(() => {
      const dischMeds = _ce4Data?.discharge?.discharge_meds || '';
      const medsLines = dischMeds.split('\n').filter(l => l.trim());
      const medsHtml = medsLines.length
        ? medsLines.map(l => `<div style="padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px">${l.trim()}</div>`).join('')
        : '<div style="color:var(--muted);font-size:12px;padding:8px 0">Not available — generate discharge summary first.</div>';
      return `<div class="card" style="margin-top:12px">
        <div class="card-title" style="margin-bottom:8px">Discharge Medications</div>
        ${medsHtml}
      </div>`;
    })()}
  </div>
</div>`;
},

// Records a cash payment for a never-admitted OPD patient and moves them
// straight to "Final Bill Completed" — there's no encounter/discharge flow
// for these, so a full CE1→CE4→CE5 walk doesn't apply, this is the whole
// billing lifecycle for a walk-in visit.
async function _opdMarkPaid(hadmId, amount, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Recording…'; }
  const base = window.FOQAL_API_BASE || `http://${location.hostname}:6010`;
  try {
    const resp = await fetch(`${base}/api/billing/records/${hadmId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        billing_phase: 'paid',
        actual_charges: amount || null,
        payment_mode_final: 'Cash',
      }),
    });
    if (!resp.ok) throw new Error('save failed');
    closeModal();
    _showBillingToast('✅ Cash payment recorded — moved to Final Bill Completed.', '#16a34a');
    _loadBillingDashboard();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '💵 Take Cash Payment'; }
    _showBillingToast('⚠️ Failed to record payment — please try again.', '#dc2626');
  }
}

(function init() {
  const token = sessionStorage.getItem('foqal_token');
  const user  = JSON.parse(sessionStorage.getItem('foqal_user') || '{}');
  if (!token || user.role !== 'billing') {
    window.location.href = '/';
    return;
  }
  const nameEl = document.getElementById('billing-name');
  if (nameEl && user.full_name) nameEl.textContent = user.full_name;
  showScreen('ce0');
})();

/* ════════════════════════════════════════════════════════════════════
   CE_LIVE — Live Bill Tracker (Admission Phase)
   Polls /api/billing/live-charges/{hadm_id} every 20s.
   When billing_phase becomes reconciliation_pending → auto-switches to CE4.
════════════════════════════════════════════════════════════════════ */
let _liveData       = null;
let _liveMl         = null;  // ML prediction as of today (GET /api/billing/ml-estimate)
let _liveShown      = 0;   // how many charges have been "revealed" so far
let _liveTimer      = null;
let _livePhaseTimer = null;
let _liveMlTimer    = null;
const _LIVE_REVEAL_INTERVAL  = 900000; // ms between charges appearing (15 min)
const _LIVE_DAY_GAP_INTERVAL = 900000; // ms pause when the next charge crosses into a new calendar day (15 min)
const _LIVE_ML_POLL_MS       = 30000; // ML prediction refresh cadence -- picks up new hospital_day automatically

let _liveWaiting = false; // true = no charges yet, polling fast

async function _liveFetchMl() {
  if (!_CE.hadm_id) return;
  const base = window.FOQAL_API_BASE || 'http://localhost:6010';
  try {
    const res = await fetch(`${base}/api/billing/ml-estimate/${_CE.hadm_id}`);
    _liveMl = res.ok ? await res.json() : null;
  } catch (e) {
    _liveMl = null;
  }
  if (CURRENT === 'ce_live') _liveRenderMl();
}

function _liveRenderMl() {
  const dayBadge = document.getElementById('live-day-badge');
  const rangeBox = document.getElementById('live-ml-range');

      </div>`;
    if (bdBox) bdBox.innerHTML = '';
    if (todayBox) todayBox.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:8px 0">Loading today's activity…</div>`;
    _liveUpdateHeader();
    return;
  }

  if (dayBadge) dayBadge.textContent = `Day ${_liveMl.hospital_day}`;
  if (todayDayNum) todayDayNum.textContent = _liveMl.hospital_day;

  if (rangeBox) {
    rangeBox.innerHTML = `
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:120px;background:#f7edf7;border:1px solid #c060c0;border-radius:8px;padding:10px 14px">
          <div style="font-size:10px;color:#800080;font-weight:700;text-transform:uppercase">Floor</div>
          <div style="font-size:17px;font-weight:800;color:#111827">${fmt(_liveMl.predicted_final_bill_p10)}</div>
        </div>
        <div style="flex:1;min-width:120px;background:#f7edf7;border:2px solid #800080;border-radius:8px;padding:10px 14px">
          <div style="font-size:10px;color:#800080;font-weight:700;text-transform:uppercase">Most Likely</div>
          <div style="font-size:17px;font-weight:800;color:#111827">${fmt(_liveMl.predicted_final_bill_p50)}</div>
        </div>
        <div style="flex:1;min-width:120px;background:#f7edf7;border:1px solid #c060c0;border-radius:8px;padding:10px 14px">
          <div style="font-size:10px;color:#800080;font-weight:700;text-transform:uppercase">Ceiling</div>
          <div style="font-size:17px;font-weight:800;color:#111827">${fmt(_liveMl.predicted_final_bill_p90)}</div>
        </div>

  if (bdBox) {

      ['Medicines & Consumables', bd.medicines], ['Labs & Diagnostics', bd.labs],

          <tbody>${rows.map(([name, amt]) => `<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:6px 0;color:var(--ink2)">${name}</td>
            <td style="padding:6px 0;text-align:right;font-weight:600">${fmt(amt || 0)}</td>
          </tr>`).join('')}</tbody>
        </table>`;
  }

  if (todayBox) {
    const td = _liveMl.today_breakdown || {};
    const todayRows = [
      ['Labs (today)', td.labs], ['Medicines (today)', td.medicines], ['Procedures (today)', td.procedures],
      ['Ward Charge (today)', td.ward], ['ICU / CCU Charge (today)', td.icu],
    ];
    const todayTable = `<table style="width:100%;font-size:12.5px">
          <tbody>${todayRows.map(([name, amt]) => `<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:6px 0;color:var(--ink2)">${name}</td>
            <td style="padding:6px 0;text-align:right;font-weight:600">${fmt(amt || 0)}</td>
          </tr>`).join('')}
          <tr><td style="padding:8px 0 2px;font-weight:700;color:var(--ink)">Today's Total</td>
              <td style="padding:8px 0 2px;text-align:right;font-weight:800;color:var(--ink)">${fmt(td.total)}</td></tr>
          </tbody>
        </table>`;

    todayBox.innerHTML = `
      ${todayTable}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-size:12px;color:var(--ink2)">Cumulative Cost So Far</div>
        <div style="font-size:16px;font-weight:800;color:var(--ink)">${fmt(_liveMl.cumulative_cost_so_far)}</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <div style="font-size:12px;color:var(--ink2)">Predicted Final Cost (Most Likely)</div>
        <div style="font-size:16px;font-weight:800;color:#800080">${fmt(_liveMl.predicted_final_bill_p50)}</div>
      </div>`;

  // The header total depends on _liveMl -- refresh it here now that this
  // function is the only remaining path that updates when real ML data
  // arrives (the old trigger, _liveRevealNext, no longer fires now that
  // the random-cost activity feed it drove has been removed).
  _liveUpdateHeader();
}

async function _liveFetch() {
  if (!_CE.hadm_id) return;
  const base = window.FOQAL_API_BASE || 'http://localhost:6010';
  try {
    const res = await fetch(`${base}/api/billing/live-charges/${_CE.hadm_id}`);
    if (!res.ok) return;
    const fresh = await res.json();
    const hadCharges = (_liveData?.charges || []).length > 0;
    const nowHasCharges = (fresh.charges || []).length > 0;
    _liveData = fresh;

    if (CURRENT !== 'ce_live') return;

    const feed = document.getElementById('live-feed');

    if (!nowHasCharges) {
      // Still waiting — show "no activity yet" placeholder and poll fast
      if (feed && !feed.querySelector('[data-waiting]')) {
        feed.innerHTML = `<div data-waiting="1" style="padding:48px 24px;text-align:center">
          <div style="font-size:32px;margin-bottom:12px;animation:livePulse 2s ease-in-out infinite">🏥</div>
          <div style="font-size:14px;font-weight:600;color:#374151;margin-bottom:6px">No procedures recorded yet</div>
          <div style="font-size:12px;color:#9ca3af">Charges will appear here as activity is logged</div>
          <div style="margin-top:16px;display:flex;justify-content:center;gap:6px">
            <span style="width:8px;height:8px;border-radius:50%;background:#d1d5db;animation:liveDot 1.4s ease-in-out infinite"></span>
            <span style="width:8px;height:8px;border-radius:50%;background:#d1d5db;animation:liveDot 1.4s ease-in-out .2s infinite"></span>
            <span style="width:8px;height:8px;border-radius:50%;background:#d1d5db;animation:liveDot 1.4s ease-in-out .4s infinite"></span>
          </div>
        </div>`;
      }
      _liveWaiting = true;
      _liveSchedulePoll(5000); // poll every 5s while waiting
    } else {
      if (_liveWaiting || !hadCharges) {
        // Charges just appeared — clear placeholder, kick off reveal
        _liveWaiting = false;
        _liveShown = 0;
        if (feed) feed.innerHTML = '';
        clearTimeout(_liveTimer);
        _liveRevealNext();
        _liveSchedulePoll(20000); // back to slow poll
      } else {
        // Normal refresh — just update header
        _liveRevealNext();
      }
    }

    _liveUpdateHeader();

    // Auto-transition if reconciliation is ready
    if (_liveData.billing_phase === 'reconciliation_pending') {
      clearTimeout(_liveTimer);
      clearInterval(_livePhaseTimer);
      setTimeout(() => showScreen('ce4'), 1200);
    }
  } catch(e) {}
}

function _liveSchedulePoll(ms) {
  clearInterval(_livePhaseTimer);
  _livePhaseTimer = setInterval(_liveFetch, ms);
}

function _liveStart() {
  _liveShown   = 0;
  _liveWaiting = false;
  clearTimeout(_liveTimer);
  clearInterval(_livePhaseTimer);
  clearInterval(_liveMlTimer);
  _liveFetch();
  _liveSchedulePoll(20000);
  _liveFetchMl();
  _liveMlTimer = setInterval(_liveFetchMl, _LIVE_ML_POLL_MS);
}

function _liveStop() {
  clearTimeout(_liveTimer);
  clearInterval(_livePhaseTimer);
  clearInterval(_liveMlTimer);
}

function _liveUpdateHeader() {
  if (!_liveData) return;
  const totalEl = document.getElementById('live-running-total');
  const barEl   = document.getElementById('live-progress-bar');
  const phaseEl = document.getElementById('live-phase-badge');
  if (!totalEl) return;

  // Only ever show the ML model's real cumulative cost here -- never the
  // legacy random per-event tally. Showing a fabricated number (even
  // briefly, before _liveMl loads) is worse than showing "loading", since
  // it looks like a real charge and can't be told apart from one.
  if (!_liveMl) {
    totalEl.textContent = 'Loading…';
    const barWrap = barEl?.parentElement;
    if (barWrap) barWrap.style.display = 'none';
  } else {
    const charged = _liveMl.cumulative_cost_so_far;
    const est     = _liveMl.predicted_final_bill_p50 || 0;
    totalEl.textContent = '₹' + charged.toLocaleString('en-IN');
    const barWrap = barEl?.parentElement;
    if (barWrap) barWrap.style.display = est > 0 ? '' : 'none';
    if (barEl && est > 0) {
      const pct = Math.min(100, Math.round(charged / est * 100));
      barEl.style.width = pct + '%';
      barEl.style.background = pct > 90 ? '#dc2626' : pct > 70 ? '#d97706' : '#059669';
    }
  }
  if (phaseEl) {
    const phase = _liveData.billing_phase || 'initial_estimate';
    const phaseMap = { initial_estimate:'Estimate Saved', estimate_shared:'Estimate Shared', reconciliation_pending:'Ready for Reconciliation' };
    phaseEl.textContent = phaseMap[phase] || phase;
    phaseEl.style.background = phase === 'reconciliation_pending' ? '#059669' : '#0369a1';
  }
}

function _liveNextDelay(prevTime, curTime) {
  // Same-day charges reveal at a steady clip; crossing into a new calendar
  // day adds a long pause so the tracker reads as days actually passing,
  // not the whole admission dumping out in a few seconds.
  if (!prevTime) return _LIVE_REVEAL_INTERVAL;
  return prevTime.slice(0, 10) === curTime.slice(0, 10)
    ? _LIVE_REVEAL_INTERVAL
    : _LIVE_DAY_GAP_INTERVAL;
}

function _liveRevealNext() {
  if (!_liveData) return;
  const charges = _liveData.charges || [];
  clearTimeout(_liveTimer);
  if (_liveShown >= charges.length) return;

  const prevTime = _liveShown > 0 ? charges[_liveShown - 1].time : null;
  const c    = charges[_liveShown];
  _liveShown++;
  const feed = document.getElementById('live-feed');
  if (!feed) return;

  const icons = { medication:'💊', procedure:'🔬', procedure_event:'⚕️' };
  const colors = { medication:'#0369a1', procedure:'#7c3aed', procedure_event:'#059669' };
  const ic   = icons[c.type]  || '📋';
  const col  = colors[c.type] || '#374151';

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;animation:fadeSlideIn .4s ease;border-left:3px solid ' + col;
  row.innerHTML = `
    <span style="font-size:18px;flex-shrink:0">${ic}</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:700;color:#111827">${c.name}</div>
      <div style="font-size:11px;color:#6b7280;margin-top:1px">${c.detail || ''} · ${(c.time||'').slice(0,16)}</div>
    </div>
    <div style="text-align:right;flex-shrink:0">
      <div style="font-size:10px;color:#9ca3af;font-weight:700;text-transform:uppercase">${c.category || c.type || 'Logged'}</div>
    </div>`;
  feed.prepend(row);
  _liveUpdateHeader();

  if (_liveShown < charges.length) {
    _liveTimer = setTimeout(_liveRevealNext, _liveNextDelay(prevTime, c.time));
  }
}

  <b style="font-size:12px">Insurance / Payment</b>
  <table style="width:auto"><tbody>
    <tr><td class="label" style="padding-right:24px">Mode</td><td>${_CE.paymentMode||'—'}</td></tr>
    <tr><td class="label">Insurer</td><td>${_CE.insuranceCo||'—'}</td></tr>
    ${_CE.paymentMode==='Cashless' ? `
    <tr><td class="label">TPA</td><td>${_CE.tpaName||'—'}</td></tr>
    <tr><td class="label">Pre-auth No.</td><td>${_CE.preauthNo||'—'}</td></tr>
    <tr><td class="label">Co-pay</td><td>${_CE.copayPct ? _CE.copayPct+'%' : '—'}</td></tr>
    ` : ''}
    ${_CE.paymentMode==='Reimbursement' ? `
    <tr><td class="label">Sum Insured</td><td>${_CE.sumInsured ? fmt(parseInt(_CE.sumInsured)) : '—'}</td></tr>
    <tr><td class="label">Bill % Covered</td><td>${_CE.coveragePct ? _CE.coveragePct+'%' : '80% (default)'}</td></tr>
    <tr><td class="label">Claim No.</td><td>${_CE.claimNo||'Not yet filed'}</td></tr>
    ` : ''}
  </tbody></table>
</div>
<div class="footer">⚠ This is an ML-predicted estimate (XGBoost quantile model, trained on real DCM admissions), not a fixed quote. Actual charges may vary at discharge (reconciliation).</div>
</body></html>`;
}

function _ce3Print() {
  const w = window.open('','_blank','width=800,height=900');
  w.document.write(_ce3PrintHtml());
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 400);
}

function _ce3Pdf() {
  const w = window.open('','_blank','width=800,height=900');
  const html = _ce3PrintHtml().replace(
    '</body>',
    `<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:6px;padding:10px 14px;margin-top:20px;font-size:12px;color:#92400e">
      <b>To save as PDF:</b> In the print dialog, set <b>Destination → Save as PDF</b>, then click Save.
    </div></body>`
  );
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 400);
}

function _ce3Notify() {
  const email  = document.getElementById('ce3-email')?.value?.trim();
  const mobile = document.getElementById('ce3-mobile')?.value?.trim();
  if (!email && !mobile) {
    alert('Enter at least an email address or mobile number.');
    return;
  }

  const ml       = _CE.mlEstimateData;
  const fmt      = n => 'Rs.' + (n||0).toLocaleString('en-IN');
  const band     = _CE.cost || 'expected';
  const bandAmt  = band==='floor' ? (ml?.predicted_final_bill_p10||0) : band==='ceiling' ? (ml?.predicted_final_bill_p90||0) : (ml?.predicted_final_bill_p50||0);
  const bandLabel= band === 'floor' ? 'Low' : band === 'ceiling' ? 'High' : 'Typical';
  const now      = new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

  const bd = ml?.cost_breakdown || {};
  const lineText = [
    ['Ward Charges', bd.ward], ['ICU / CCU Charges', bd.icu], ['Procedures', bd.procedures],
    ['Medicines & Consumables', bd.medicines], ['Labs & Diagnostics', bd.labs],
  ].filter(([, amt]) => amt).map(([name, amt]) => `  ${name}: ${fmt(amt)}`).join('\n');

  const subject = encodeURIComponent(`Cost Estimate — ${_CE.mrn||'Patient'} | Foqal CareOS`);
  const body = encodeURIComponent(
`Dear Patient / Family,

Please find below the cost estimate for your hospitalisation at our facility.

━━━━━━━━━━━━━━━━━━━━━━
PATIENT DETAILS
━━━━━━━━━━━━━━━━━━━━━━
Patient MRN  : ${_CE.mrn||'—'}
Name         : ${_CE.patientName||'—'}
Diagnosis    : ${_CE.diagnosis||'—'}
Admission    : ${_CE.admitDate||'—'} (${_CE.losDays||'—'} days)
Ward / Bed   : ${_CE.wardType||'—'}

━━━━━━━━━━━━━━━━━━━━━━
COST ESTIMATE
━━━━━━━━━━━━━━━━━━━━━━
Selected Estimate : ${bandLabel} — ${fmt(bandAmt)}
Low     : ${fmt(ml?.predicted_final_bill_p10||0)}
Typical : ${fmt(ml?.predicted_final_bill_p50||0)}
High    : ${fmt(ml?.predicted_final_bill_p90||0)}

COST BREAKDOWN
${lineText}

━━━━━━━━━━━━━━━━━━━━━━
INSURANCE / PAYMENT
━━━━━━━━━━━━━━━━━━━━━━
Payment Mode : ${_CE.paymentMode||'—'}
Insurer      : ${_CE.insuranceCo||'—'}${_CE.paymentMode==='Cashless' ? `
TPA          : ${_CE.tpaName||'—'}
Pre-auth No. : ${_CE.preauthNo||'—'}
Co-pay       : ${_CE.copayPct ? _CE.copayPct+'%' : '—'}` : ''}${_CE.paymentMode==='Reimbursement' ? `
Sum Insured  : ${_CE.sumInsured ? fmt(parseInt(_CE.sumInsured)) : '—'}
Bill % Covered: ${_CE.coveragePct ? _CE.coveragePct+'%' : '80% (default)'}
Claim No.    : ${_CE.claimNo||'Not yet filed'}` : ''}

━━━━━━━━━━━━━━━━━━━━━━
Note: This is an ML-predicted estimate (XGBoost quantile model, trained on real DCM admissions), not a fixed quote. Actual charges may vary at discharge during reconciliation.

Generated: ${now}
Foqal CareOS — Billing Department
`);

  if (email) {
    // Open Gmail compose in new tab — works on any browser without a mail client
    const gmailUrl = `https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(email)}&su=${subject}&body=${body}`;
    window.open(gmailUrl, '_blank');
  }

  const btn = document.querySelector('[onclick="_ce3Notify()"]');
  const ok  = document.getElementById('ce3-notify-ok');
  if (btn) { btn.textContent = 'Gmail opened!'; btn.style.background = '#16a34a'; btn.disabled = true; }
  if (ok)  { ok.textContent = email ? `Compose window opened for ${email} — click Send in Gmail` : 'Check your browser'; ok.style.display = 'block'; }
}
</script>

      <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 0;color:var(--muted)">Entered by</td><td id="ce2b-enteredby" style="padding:9px 0"></td></tr>
