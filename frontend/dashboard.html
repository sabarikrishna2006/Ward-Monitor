<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foqal CareOS — Patient Queue</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f9fafb}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;color:#111827}
button,select{cursor:pointer;font-family:inherit;font-size:inherit}

:root{
  --p:#800080;--pl:#f7edf7;
  --ink:#111827;--ink2:#374151;--muted:#6b7280;
  --border:#e5e7eb;--surf:#f9fafb;
  --t1:#dc2626;--t1b:#fef2f2;
  --t2:#d97706;--t2b:#fffbeb;
  --t3:#059669;--t3b:#ecfdf5;
  --blue:#1d4ed8;--blueb:#eff6ff;
}

/* TOPBAR */
.topbar{
  height:48px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 32px;gap:12px;
  position:sticky;top:0;z-index:100;
}
.tlogo{font-size:15px;font-weight:900;color:var(--p);letter-spacing:-.3px}
.tdiv{width:1px;height:18px;background:var(--border)}
.tspace{flex:1}
.tuser{font-size:12px;color:var(--muted)}
.tbtn{
  padding:5px 12px;border:1px solid var(--border);background:#fff;
  border-radius:6px;font-size:11.5px;font-weight:500;color:var(--muted);
}
.tbtn:hover{background:var(--surf);color:var(--ink)}

/* PAGE */
.page{max-width:1320px;margin:0 auto;padding:28px 32px}

/* BREADCRUMB */
.bc{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:16px}
.bc-link{color:var(--p);cursor:pointer}.bc-link:hover{text-decoration:underline}
.bc-sep{color:var(--border)}.bc-cur{color:var(--muted)}

/* SCREEN HEADER */
.sh{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.sh-title{font-size:20px;font-weight:800;color:var(--ink);flex:1}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px 20px}
.stat-v{font-size:32px;font-weight:900;line-height:1}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.c-amber .stat-v{color:var(--t2)}
.c-purple .stat-v{color:var(--p)}
.c-green  .stat-v{color:var(--t3)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sf-pill{
  padding:4px 12px;border-radius:99px;font-size:11.5px;font-weight:500;
  border:1.5px solid var(--border);background:#fff;color:var(--ink2);
  cursor:pointer;font-family:inherit;transition:all .1s;
}
.sf-pill.active{background:var(--p);color:#fff;border-color:var(--p);font-weight:700}
.toggle-btn{
  padding:5px 12px;border:1px solid var(--border);background:#fff;
  border-radius:6px;font-size:12px;color:var(--muted);
}
.toggle-btn.active{background:var(--pl);color:var(--p);border-color:var(--p);font-weight:600}
.toggle-btn:hover{background:var(--surf)}
.tspace2{flex:1}
.row-count{font-size:12px;color:var(--muted)}

/* TABLE */
.tw{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{
  padding:10px 16px;text-align:left;font-size:10.5px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  background:var(--surf);border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--ink2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.data-row:hover td{background:#fafafa;cursor:pointer}
.mono{font-family:'SF Mono','Menlo','Consolas',monospace;font-size:11px}
.bold{font-weight:700;color:var(--ink)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700}
.bd-pending    {background:var(--t2b);color:var(--t2)}
.bd-review     {background:var(--blueb);color:var(--blue)}
.bd-signed     {background:var(--t3b);color:var(--t3)}
.bd-gray       {background:#f3f4f6;color:#4b5563}
.bd-red        {background:var(--t1b);color:var(--t1)}
.bd-processing {background:#f3e8ff;color:#7c3aed;animation:bdpulse 1.4s ease-in-out infinite}
.bd-amber      {background:#fffbeb;color:#d97706}
@keyframes bdpulse{0%,100%{opacity:1}50%{opacity:.6}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid transparent;transition:all .12s;white-space:nowrap}
.btn-pri{background:var(--p);color:#fff;border-color:var(--p)}
.btn-pri:hover{background:#5c0060}
.btn-sec{background:#fff;color:var(--ink);border-color:var(--border)}
.btn-sec:hover{background:var(--surf)}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e4e4e4 50%,#f0f0f0 75%);background-size:200%;animation:shimmer 1.4s infinite;border-radius:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ERROR */
.error-banner{background:var(--t1b);border:1px solid #fca5a5;border-radius:6px;padding:10px 14px;color:var(--t1);font-size:12.5px;margin-bottom:14px;display:none}
</style>
<script src="/config.js"></script>
</head>
<body>

<div class="topbar">
  <div class="tlogo">Foqal CareOS</div>
  <div class="tdiv"></div>
  <span class="tuser" id="topbar-user"></span>
  <div class="tspace"></div>
  <button class="tbtn" onclick="logout()">Sign Out</button>
</div>

<div class="page">

  <div class="sh">
    <div class="sh-title">My Patient Queue</div>
    <button class="tbtn" onclick="loadDashboard(false)" style="display:inline-flex;align-items:center;gap:5px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>

  <div class="error-banner" id="err-banner"></div>

  <!-- Summary-ready notifications (one per patient, auto-cleared on navigate) -->
  <div id="summary-ready-container"></div>

  <div class="stats">
    <div class="stat c-amber"><div class="stat-v" id="s-pending">—</div><div class="stat-l">Pending Upload</div></div>
    <div class="stat c-purple"><div class="stat-v" id="s-review">—</div><div class="stat-l">In Review</div></div>
    <div class="stat c-green"><div class="stat-v" id="s-signed">—</div><div class="stat-l">Signed This Month</div></div>
    <div class="stat"><div class="stat-v" id="s-time">—</div><div class="stat-l">Avg Generation Time</div></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar" id="sf-toolbar">
    <button class="sf-pill active" data-sf="">All</button>
    <button class="sf-pill" data-sf="Pending">Pending</button>
    <button class="sf-pill" data-sf="In Review">In Review</button>
    <button class="sf-pill" data-sf="Signed">Signed</button>
    <button class="sf-pill" data-sf="Revision Req.">Revision Requested</button>
    <button class="sf-pill" data-sf="Amendment Req.">Amendment Requested</button>
  </div>

  <div class="tw">
    <table>
      <thead>
        <tr>
          <th>Patient ID</th>
          <th>Name</th>
          <th>Age</th>
          <th>Diagnosis</th>
          <th>Ward</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="queue-body">
        <tr><td><div class="skeleton" style="height:12px;width:80px"></div></td><td><div class="skeleton" style="height:12px;width:110px"></div></td><td><div class="skeleton" style="height:12px;width:36px"></div></td><td><div class="skeleton" style="height:12px;width:160px"></div></td><td><div class="skeleton" style="height:12px;width:30px"></div></td><td><div class="skeleton" style="height:20px;width:64px;border-radius:10px"></div></td><td><div class="skeleton" style="height:28px;width:80px;border-radius:6px"></div></td></tr>
        <tr><td><div class="skeleton" style="height:12px;width:80px"></div></td><td><div class="skeleton" style="height:12px;width:130px"></div></td><td><div class="skeleton" style="height:12px;width:36px"></div></td><td><div class="skeleton" style="height:12px;width:140px"></div></td><td><div class="skeleton" style="height:12px;width:30px"></div></td><td><div class="skeleton" style="height:20px;width:64px;border-radius:10px"></div></td><td><div class="skeleton" style="height:28px;width:80px;border-radius:6px"></div></td></tr>
        <tr><td><div class="skeleton" style="height:12px;width:80px"></div></td><td><div class="skeleton" style="height:12px;width:100px"></div></td><td><div class="skeleton" style="height:12px;width:36px"></div></td><td><div class="skeleton" style="height:12px;width:170px"></div></td><td><div class="skeleton" style="height:12px;width:30px"></div></td><td><div class="skeleton" style="height:20px;width:64px;border-radius:10px"></div></td><td><div class="skeleton" style="height:28px;width:80px;border-radius:6px"></div></td></tr>
        <tr><td><div class="skeleton" style="height:12px;width:80px"></div></td><td><div class="skeleton" style="height:12px;width:120px"></div></td><td><div class="skeleton" style="height:12px;width:36px"></div></td><td><div class="skeleton" style="height:12px;width:150px"></div></td><td><div class="skeleton" style="height:12px;width:30px"></div></td><td><div class="skeleton" style="height:20px;width:64px;border-radius:10px"></div></td><td><div class="skeleton" style="height:28px;width:80px;border-radius:6px"></div></td></tr>
        <tr><td><div class="skeleton" style="height:12px;width:80px"></div></td><td><div class="skeleton" style="height:12px;width:115px"></div></td><td><div class="skeleton" style="height:12px;width:36px"></div></td><td><div class="skeleton" style="height:12px;width:155px"></div></td><td><div class="skeleton" style="height:12px;width:30px"></div></td><td><div class="skeleton" style="height:20px;width:64px;border-radius:10px"></div></td><td><div class="skeleton" style="height:28px;width:80px;border-radius:6px"></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
/* ── Session guard ── */
const user = JSON.parse(sessionStorage.getItem('foqal_user') || '{}');
if (!user.email) { window.location.href = '/'; }

document.getElementById('topbar-user').textContent = user.full_name || user.email || '';

function logout() { sessionStorage.clear(); window.location.href = '/'; }

// Show toast if redirected here after submit fix
(function() {
  const msg = sessionStorage.getItem('foqal_submit_toast');
  if (!msg) return;
  sessionStorage.removeItem('foqal_submit_toast');
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;background:#fff;border:2px solid #059669;border-radius:12px;padding:14px 18px;box-shadow:0 8px 32px rgba(0,0,0,.14);max-width:360px;font-family:system-ui,sans-serif;display:flex;align-items:center;gap:12px';
  el.innerHTML = '<div style="font-size:18px">✓</div><div style="font-size:13px;font-weight:600;color:#065f46">' + msg + '</div>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
})();

const API = window.FOQAL_API_BASE || `http://${location.hostname}:7015`;

/* ── Synthetic data helpers (seeded by hadm_id → deterministic) ── */
function seeded(hadmId, max) {
  let h = parseInt(hadmId) || 0;
  h = ((h >> 16) ^ h) * 0x45d9f3b;
  h = ((h >> 16) ^ h) * 0x45d9f3b;
  h = (h >> 16) ^ h;
  return Math.abs(h) % max;
}
function seeded2(hadmId, salt, max) {
  return seeded(hadmId * 31 + salt, max);
}

const NAMES_M = ['Rajesh','Mohan','Dinesh','Arun','Suresh','Vijay','Sanjay','Ramesh','Deepak','Nitin',
                  'Ashok','Prakash','Anil','Manoj','Rakesh','Vinod','Sunil','Ravi','Ajay','Amit'];
const NAMES_F = ['Priya','Kavita','Sunita','Anjali','Leela','Rekha','Suman','Anita','Meena','Geeta',
                  'Pooja','Neha','Divya','Shalini','Radha','Usha','Lata','Nisha','Swati','Kiran'];
const SURNAMES = ['Kumar','Singh','Joshi','Verma','Patel','Malhotra','Gupta','Sharma','Rao','Jain',
                   'Iyer','Menon','Nair','Desai','Varma','Devi','Reddy','Chatterjee','Mehta','Kapoor',
                   'Choudhary','Pillai','Krishnan','Bose','Agarwal','Bhatia','Saxena','Trivedi','Bhosale','Kulkarni'];
const DIAGNOSES = [
  'Dilated Cardiomyopathy','STEMI — Post PCI','Congestive Heart Failure',
  'Hypertensive Emergency','Atrial Fibrillation w/ RVR','Complete Heart Block',
  'Unstable Angina','Aortic Stenosis','NSTEMI','Cardiac Tamponade',
  'Pulmonary Embolism','Ventricular Tachycardia','Heart Failure with EF <35%','Mitral Regurgitation'
];
const WARDS     = ['4A','4B','4C','3A','3B'];
const RESIDENTS = ['Dr. R. Nair','Dr. D. Rao','Dr. A. Mehta','Dr. K. Singh'];

function synth(hadmId) {
  const isMale   = seeded(hadmId, 2) === 0;
  const first    = isMale ? NAMES_M[seeded(hadmId, NAMES_M.length)]
                           : NAMES_F[seeded2(hadmId, 7, NAMES_F.length)];
  const last     = SURNAMES[seeded2(hadmId, 17, SURNAMES.length)];
  const name     = `${first} ${last}`;
  const age      = 38 + seeded2(hadmId, 13, 38);           // 38–75
  const gender   = isMale ? 'M' : 'F';
  const diagnosis= DIAGNOSES[seeded2(hadmId, 3, DIAGNOSES.length)];
  const ward     = WARDS[seeded2(hadmId, 5, WARDS.length)];
  const resident = RESIDENTS[seeded2(hadmId, 11, RESIDENTS.length)];
  return { name, age, gender, diagnosis, ward, resident };
}

/* ── Status helpers ── */
function statusInfo(status) {
  switch (status) {
    case 'Pending Ingestion': return { label:'Pending',          cls:'bd-pending',    action:'upload'      };
    case 'Processing':        return { label:'Generating…',      cls:'bd-processing', action:'generating'  };
    case 'Files Ready':       return { label:'In Review',         cls:'bd-review',     action:'in-review'   };
    case 'In Progress':
    case 'Ready for Review':  return { label:'Pending',          cls:'bd-pending',    action:'upload'      };
    case 'Awaiting Review':   return { label:'In Review',        cls:'bd-review',     action:'in-review'   };
    case 'Signed Off':        return { label:'Signed',           cls:'bd-signed',     action:'signed'      };
    case 'Revision Requested':  return { label:'Revision Req.',  cls:'bd-red',        action:'view'        };
    case 'Amendment Requested': return { label:'Amendment Req.', cls:'bd-amber',      action:'view'        };
    default:                    return { label: status||'Unknown', cls:'bd-gray',      action:'view'        };
  }
}

/* ── State ── */
let _myRows   = [];
let _viewMode = 'mine';

/* ── Update stat cards from a row set ── */
function updateStats(rows) {
  let pending = 0, review = 0, signed = 0;
  for (const r of rows) {
    const s = r.status || '';
    if (['Pending Ingestion','In Progress','Ready for Review'].includes(s)) pending++;
    else if (['Processing','Awaiting Review'].includes(s)) review++;
    else if (s === 'Signed Off') signed++;
  }
  document.getElementById('s-pending').textContent = pending;
  document.getElementById('s-review').textContent  = review;
  document.getElementById('s-signed').textContent  = signed;
}

/* ── Filters ── */
let _sfActive = '';

function applyFilters(sf) {
  if (sf !== undefined) _sfActive = sf;
  const filtered = _myRows.filter(r => !_sfActive || r._statusLabel === _sfActive);
  renderRows(filtered);
}

function initStatusPills() {
  document.querySelectorAll('.sf-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sf-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters(btn.dataset.sf);
    });
  });
}

/* ── Render table rows ── */
const _STATUS_PRIO = {
  'Revision Requested':  0,
  'Amendment Requested': 1,
  'Pending Ingestion':   2,
  'Processing':          3,
  'In Progress':         4,
  'Ready for Review':    4,
  'Awaiting Review':     4,
  'Signed Off':          5,
};

function renderRows(rows) {
  const tbody = document.getElementById('queue-body');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8" style="padding:40px;text-align:center;color:var(--muted)">No patients match the current filter.</td></tr>`;
    return;
  }

  const sorted = [...rows].sort((a, b) =>
    (_STATUS_PRIO[a.status] ?? 3) - (_STATUS_PRIO[b.status] ?? 3)
  );

  // Save current queue order so upload.html can navigate prev/next
  _currentQueue = sorted.map(r => r.hadm_id);

  tbody.innerHTML = sorted.map(r => {
    const info = statusInfo(r.status);
    let rowStyle = '';
    if (r.status === 'Revision Requested')  rowStyle = 'background:#fef2f2;border-left:4px solid #dc2626;';
    if (r.status === 'Amendment Requested') rowStyle = 'background:#fffbeb;border-left:4px solid #f59e0b;';

    const rowClick = info.action === 'in-review' ? '' : `onclick="openPatient(${r.hadm_id})"`;
    const rowCursor = info.action === 'in-review' ? 'cursor:default;' : '';

    let actionHtml;
    if (info.action === 'upload') {
      actionHtml = `<button class="btn btn-sec" onclick="event.stopPropagation();openPatient(${r.hadm_id})">Upload →</button>`;
    } else if (info.action === 'generate') {
      actionHtml = `<button class="btn btn-sec" onclick="event.stopPropagation();openPatient(${r.hadm_id})">Generate Summary →</button>`;
    } else if (info.action === 'generating') {
      actionHtml = `<span style="font-size:11.5px;color:#6b7280;font-style:italic">—</span>`;
    } else if (info.action === 'in-review') {
      actionHtml = `<span style="font-size:11.5px;color:#6b7280;font-style:italic">Awaiting review</span>`;
    } else if (info.action === 'view') {
      actionHtml = `<button class="btn btn-sec" onclick="event.stopPropagation();openPatient(${r.hadm_id})">View</button>`;
    } else if (info.action === 'signed') {
      actionHtml = `<button class="btn btn-sec" style="font-size:11px;padding:5px 10px" onclick="event.stopPropagation();openPDF(${r.hadm_id})">Download PDF</button>`;
    }
    return `
      <tr class="data-row" style="${rowStyle}${rowCursor}" ${rowClick}>
        <td class="mono">${fmtPid(r.hadm_id, r.display_id)}</td>
        <td class="bold">${r._name}</td>
        <td>${r._age}${r._gender}</td>
        <td>${r._diagnosis}</td>
        <td>${r._ward}</td>
        <td><span class="badge ${info.cls}">${info.label}</span></td>
        <td>${actionHtml}</td>
      </tr>`;
  }).join('');
}


let _currentQueue = [];   // ordered hadm_ids currently visible in table

/* ── Navigate to patient ── */
function openPatient(hadmId) {
  sessionStorage.setItem('foqal_hadm', String(hadmId));
  sessionStorage.setItem('foqal_queue', JSON.stringify(_currentQueue));
  const row = _myRows.find(function(r){ return r.hadm_id === hadmId; });
  if (row) {
    sessionStorage.setItem('foqal_patient_preview', JSON.stringify(row));
    if (row.display_id) sessionStorage.setItem('foqal_display_id_' + hadmId, row.display_id);
    // Pre-compute DCM hint from the real MIMIC primary_diagnosis_title so
    // upload.html can show the checklist on the very first render.
    const dx = (row.primary_diagnosis_title || row._diagnosis || '').toLowerCase();
    if (dx.includes('dcm') || dx.includes('dilated cardiomyopathy') ||
        dx.includes('cardiomyopathy') || dx.includes('heart failure')) {
      sessionStorage.setItem('foqal_hasDCM_' + hadmId, '1');
    }
  }
  window.location.href = '/upload.html';
}

/* ── Download PDF — fetch summary directly and print in a popup (no navigation) ── */
async function openPDF(hadmId) {
  const row = _myRows.find(function(r){ return r.hadm_id === hadmId; });
  const encId = row && row.id;
  if (!encId) {
    // Fallback — navigate to upload.html summary-only view
    sessionStorage.setItem('foqal_hadm', String(hadmId));
    if (row) sessionStorage.setItem('foqal_patient_preview', JSON.stringify(row));
    sessionStorage.setItem('foqal_summary_only', '1');
    sessionStorage.setItem('foqal_auto_print', '1');
    window.location.href = '/upload.html';
    return;
  }
  const token = sessionStorage.getItem('foqal_token') || '';
  let sd;
  try {
    const resp = await fetch(API + '/api/encounters/' + encId + '/summary', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    sd = await resp.json();
  } catch(e) { sd = null; }
  if (!sd || !sd.content) {
    alert('No signed summary found for this patient.');
    return;
  }
  const body = sd.content
    .replace(/\*\*([^*\n]+)\*\*/g, function(_, g1) {
      return '<div style="margin-top:16px;margin-bottom:4px;font-size:11px;font-weight:700;color:#1e3a5f;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid #e2e8f0;padding-bottom:3px">' + g1 + '</div>';
    })
    .replace(/\n/g, '<br/>');
  const signedAt = sd.signed_at
    ? new Date(sd.signed_at).toLocaleString('en-IN', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})
    : '';
  const patName  = (row && row._name) || ('HADM ' + hadmId);
  const _pid     = fmtPid(hadmId, row && row.display_id);
  const signedBy = sd.signed_by || '';
  const infoRows = [['Patient', patName], ['Patient ID', _pid]];
  if (signedBy)  infoRows.push(['Signed by', signedBy]);
  if (signedAt)  infoRows.push(['Signed on', signedAt]);
  const infoHtml = infoRows.map(function(kv) {
    return '<div><div style="font-size:9.5px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.12em;margin-bottom:3px">' + kv[0] + '</div>'
         + '<div style="font-size:13px;font-weight:600;color:#111827">' + kv[1] + '</div></div>';
  }).join('');
  const signedStamp = (signedBy || signedAt)
    ? '<div style="margin-top:32px;padding:14px 18px;border:1.5px solid #059669;border-radius:8px;background:#f0fdf4;display:flex;align-items:center;gap:12px">'
      + '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      + '<div><div style="font-size:12px;font-weight:700;color:#059669">Digitally Signed &amp; Finalised</div>'
      + (signedBy ? '<div style="font-size:11.5px;color:#374151;margin-top:2px">Attending Physician: <b>' + signedBy + '</b></div>' : '')
      + (signedAt ? '<div style="font-size:11px;color:#6b7280;margin-top:1px">' + signedAt + '</div>' : '')
      + '</div></div>'
    : '';
  const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Discharge Summary — ' + _pid + '</title>'
    + '<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",Arial,sans-serif;background:#fff}@media print{body{margin:0}}</style>'
    + '</head><body><div style="padding:32px 40px;max-width:820px;margin:0 auto">'
    + '<div style="display:flex;align-items:center;gap:18px;padding-bottom:18px;border-bottom:2px solid #1e3a5f;margin-bottom:22px">'
    +   '<div style="width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#800080,#C040C0);display:grid;place-items:center;flex-shrink:0"><span style="font-size:13px;font-weight:900;color:white">FQ</span></div>'
    +   '<div style="flex:1"><div style="font-size:18px;font-weight:800;color:#1e3a5f">Foqal Healthcare</div><div style="font-size:11px;color:#6b7280;margin-top:2px">Cardiac &amp; Surgical Wing · Chennai, Tamil Nadu</div></div>'
    +   '<div style="text-align:right"><div style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.10em;color:#1e3a5f">Discharge Summary</div>'
    +   '<div style="font-size:10.5px;color:#6b7280;margin-top:3px">' + _pid + '</div>'
    +   '<div style="font-size:10px;font-weight:700;color:#059669;margin-top:3px;text-transform:uppercase;letter-spacing:.08em">✓ Signed &amp; Finalised</div>'
    +   '</div></div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:14px 18px;background:#f9fafb;border-radius:8px;border:1px solid #e5e7eb;margin-bottom:28px">' + infoHtml + '</div>'
    + '<div style="font-size:13.5px;line-height:1.75;color:#111827">' + body + '</div>'
    + signedStamp
    + '</div><script>window.onload=function(){setTimeout(function(){window.print();},400);}<\/script></body></html>';
  const win = window.open('', '_blank', 'width=900,height=700,menubar=no,toolbar=no,location=no,scrollbars=yes');
  if (win) { win.document.write(html); win.document.close(); }
  else alert('Allow popups in your browser to download the PDF.');
}

/* ── Open signed summary in summary-only mode (no upload form) ── */
function openSummaryOnly(hadmId) {
  sessionStorage.setItem('foqal_hadm', String(hadmId));
  sessionStorage.setItem('foqal_queue', JSON.stringify(_currentQueue));
  const row = _myRows.find(function(r){ return r.hadm_id === hadmId; });
  if (row) sessionStorage.setItem('foqal_patient_preview', JSON.stringify(row));
  sessionStorage.setItem('foqal_summary_only', '1');
  window.location.href = '/upload.html';
}

/* ── Enrich encounter with demographics ── */
function enrich(enc) {
  const s    = synth(enc.hadm_id);
  const info = statusInfo(enc.status);
  return {
    ...enc,
    _name:        enc.patient_name || enc.full_name || s.name,
    _age:         enc.anchor_age   || s.age,
    _gender:      enc.gender       || s.gender,
    _diagnosis:   enc.primary_diagnosis_title || s.diagnosis,
    _ward:        s.ward,
    _resident:    s.resident,
    _statusLabel: info.label,
  };
}

/* ── Shared visibility filter — used by both the initial load and the
   background poll so the patient list never differs between renders ── */
const _RELEASED_PHASES = new Set(['paid','claim_submitted','tpa_settled','final_bill_generated']);
function _notReleased(r) { return !(r.status === 'Signed Off' && _RELEASED_PHASES.has(r.billing_phase)); }
function _visibleRows(encs) {
  const mine = encs.filter(function(r){ return r.assigned_to === user.id; }).filter(_notReleased);
  return mine.length ? mine : encs.filter(_notReleased);
}

/* ── Load from backend (with auto-retry) ── */
let _loadAttempt = 0;

async function fetchWithTimeout(url, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    return res;
  } catch(e) {
    clearTimeout(timer);
    throw e;
  }
}

function showRetryBanner(attempt, maxAttempts) {
  const banner = document.getElementById('err-banner');
  banner.innerHTML = `Connecting to server… (attempt ${attempt}/${maxAttempts}) <span class="spinner" style="display:inline-block;width:12px;height:12px;border:2px solid #fca5a5;border-top-color:var(--t1);border-radius:50%;animation:spin .8s linear infinite;margin-left:8px;vertical-align:middle"></span>`;
  banner.style.display = 'block';
  document.getElementById('queue-body').innerHTML =
    `<tr><td colspan="8" style="padding:40px;text-align:center;color:var(--muted)">
      <span class="spinner" style="display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px"></span>
      Loading patient queue…
    </td></tr>`;
}

async function loadDashboard(isRetry) {
  const MAX_ATTEMPTS = 3;
  const TIMEOUT_MS   = 45000;  // 45s — GCS can be slow on cold start

  if (!isRetry) _loadAttempt = 0;
  _loadAttempt++;

  if (_loadAttempt > 1) showRetryBanner(_loadAttempt, MAX_ATTEMPTS);

  try {
    // My Patients = encounters with an active workflow
    const encRes = await fetchWithTimeout(`${API}/api/encounters`, TIMEOUT_MS);
    const encRaw = encRes.ok ? await encRes.json() : [];
    const myEncs = (Array.isArray(encRaw) ? encRaw : encRaw.encounters || []).map(enrich);

    document.getElementById('err-banner').style.display = 'none';

    _myRows = _visibleRows(myEncs);

    if (!_myRows.length) {
      document.getElementById('s-pending').textContent = 0;
      document.getElementById('s-review').textContent  = 0;
      document.getElementById('s-signed').textContent  = 0;
      document.getElementById('queue-body').innerHTML =
        `<tr><td colspan="8" style="padding:40px;text-align:center;color:var(--muted)">No patients assigned yet.</td></tr>`;
      return;
    }

    updateStats(_myRows);
    initStatusPills();
    renderRows(_myRows);
    // Seed prev-statuses so the background poll doesn't fire on first tick
    _myRows.forEach(function(r){ _prevStatuses[r.hadm_id] = r.status; });
    // If the user started a generation before coming to the dashboard and it already
    // finished (status is Ready for Review on load), show the banner immediately —
    // the poll won't catch this because it never sees the Processing→Ready transition.
    _myRows.forEach(function(r) {
      if (r.status === 'Ready for Review' && sessionStorage.getItem('foqal_generating_' + r.hadm_id)) {
        _showSummaryReadyBanner(r.hadm_id, synth(r.hadm_id).name);
      }
    });
    document.getElementById('s-time').textContent = '—';

    fetch(`${API}/api/dashboard`).then(r => r.ok ? r.json() : null).then(stats => {
      if (!stats) return;
      const s = stats.cards?.avg_gen_s;
      let label = '—';
      if (s != null) {
        if (s < 60)        label = s.toFixed(0) + 's';
        else if (s < 3600) label = (s / 60).toFixed(1) + 'm';
        else               label = (s / 3600).toFixed(1) + 'h';
      }
      document.getElementById('s-time').textContent = label;
    }).catch(() => {});

  } catch (err) {
    if (_loadAttempt < MAX_ATTEMPTS) {
      // Auto-retry after a short delay
      const delay = _loadAttempt * 3000;
      showRetryBanner(_loadAttempt + 1, MAX_ATTEMPTS);
      setTimeout(() => loadDashboard(true), delay);
      return;
    }
    // All retries exhausted
    const banner = document.getElementById('err-banner');
    banner.textContent = err.name === 'AbortError'
      ? 'Server is taking too long. Make sure both backend servers are running.'
      : 'Could not reach server: ' + err.message;
    banner.style.display = 'block';
    document.getElementById('queue-body').innerHTML =
      `<tr><td colspan="8" style="padding:32px;text-align:center;color:var(--muted)">
        Could not load data.
        <button class="btn btn-sec" onclick="_loadAttempt=0;loadDashboard()" style="margin-left:10px">Retry</button>
      </td></tr>`;
  }
}

loadDashboard();

/* ── Background poll: detect summary-ready transitions ─────────────────────
   Checks every 5 s. When a patient flips from "Processing" → "Ready for
   Review", shows a persistent green banner with an "Open Summary" button.
   That button sets a sessionStorage flag so upload.html lands on the summary
   view instead of the upload form. ──────────────────────────────────────── */
let _prevStatuses = {};

function _showSummaryReadyBanner(hadmId, name) {
  const container = document.getElementById('summary-ready-container');
  if (!container || document.getElementById('srb-' + hadmId)) return; // already shown
  sessionStorage.removeItem('foqal_generating_' + hadmId); // clear so refresh doesn't re-show
  const div = document.createElement('div');
  div.id = 'srb-' + hadmId;
  div.style.cssText = [
    'display:flex;align-items:center;gap:12px;padding:12px 18px',
    'background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px',
    'margin-bottom:12px;font-size:13px;color:#166534',
  ].join(';');
  div.innerHTML =
    '<span style="font-size:17px">✅</span>' +
    '<span style="flex:1;font-weight:600">Summary ready for <strong>' + name + '</strong></span>' +
    '<button onclick="openSummary(' + hadmId + ')" style="' +
      'padding:7px 16px;background:#16a34a;color:#fff;border:none;border-radius:6px;' +
      'font-size:12px;font-weight:700;cursor:pointer">Open Summary →</button>' +
    '<button onclick="this.parentElement.remove()" style="' +
      'padding:4px 8px;background:none;border:1px solid #86efac;border-radius:6px;' +
      'font-size:11px;color:#166534;cursor:pointer">✕</button>';
  container.prepend(div);
}

function openSummary(hadmId) {
  sessionStorage.setItem('foqal_goto_summary_' + hadmId, '1');
  openPatient(hadmId);
}

(function _startStatusPoll() {
  setInterval(async function() {
    try {
      const res = await fetch(API + '/api/encounters');
      if (!res.ok) return;
      const raw  = await res.json();
      const encs = Array.isArray(raw) ? raw : (raw.encounters || []);
      encs.forEach(function(enc) {
        const prev = _prevStatuses[enc.hadm_id];
        if (prev === 'Processing' && enc.status === 'Ready for Review') {
          if (sessionStorage.getItem('foqal_generating_' + enc.hadm_id)) {
            const name = synth(enc.hadm_id).name;
            _showSummaryReadyBanner(enc.hadm_id, name);
          }
        }
        _prevStatuses[enc.hadm_id] = enc.status;
      });
      // Refresh the table rows silently so status pills stay current
      const rows = (Array.isArray(raw) ? raw : (raw.encounters || [])).map(enrich);
      _myRows = _visibleRows(rows);
      renderRows(_myRows);
      updateStats(_myRows);
    } catch(_e) {}
  }, 5000);
})();
</script>
