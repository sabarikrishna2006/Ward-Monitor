<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foqal CareOS — Patient</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f9fafb}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;color:#111827}
button,select,input{font-family:inherit;font-size:inherit;cursor:pointer}

:root{
  --p:#800080;--pl:#f7edf7;
  --blue:#1d4ed8;--blueb:#eff6ff;--bluebr:#bfdbfe;
  --teal:#0d9488;--tealb:#f0fdfa;--tealbr:#99f6e4;
  --ink:#111827;--ink2:#374151;--ink3:#6b7280;--ink4:#9ca3af;
  --border:#e5e7eb;--surf:#f9fafb;
  --red:#dc2626;--redb:#fef2f2;
  --green:#059669;--greenb:#ecfdf5;--greenbr:#a7f3d0;
  --amber:#d97706;--amberb:#fffbeb;--amberbr:#fde68a;
  --mono:'SF Mono','Menlo','Consolas',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}

/* ── TOPBAR ── */
.topbar{height:48px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;gap:12px;position:sticky;top:0;z-index:200}
.tlogo{font-size:15px;font-weight:900;color:var(--p);letter-spacing:-.3px;cursor:default}
.tdiv{width:1px;height:18px;background:var(--border)}
.tspace{flex:1}
.tuser{font-size:12px;color:var(--ink3)}
.tbtn{padding:5px 12px;border:1px solid var(--border);background:#fff;border-radius:6px;font-size:11.5px;font-weight:500;color:var(--ink3)}
.tbtn:hover{background:var(--surf)}

/* ── PAGE ── */
.page{max-width:1200px;margin:0 auto;padding:24px 32px}


/* ── PATIENT HEADER ── */
.pat-head{display:flex;align-items:center;gap:18px;padding:14px 22px;background:var(--blueb);border:1px solid var(--bluebr);border-radius:10px;margin-bottom:16px}
.pat-avatar{width:44px;height:44px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.pat-name{font-size:17px;font-weight:700;color:var(--ink)}
.pat-hadm{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--blue)}

/* ── PILLS ── */
.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill-blue{background:var(--blueb);color:var(--blue);border:1px solid var(--bluebr)}
.pill-slate{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.pill-green{background:var(--greenb);color:var(--green);border:1px solid var(--greenbr)}
.pill-red{background:var(--redb);color:var(--red);border:1px solid #fecaca}
.pill-amber{background:var(--amberb);color:var(--amber);border:1px solid var(--amberbr)}
.pill-teal{background:var(--tealb);color:var(--teal);border:1px solid var(--tealbr)}

/* ── LOADING BANNER ── */

/* ── CARD ── */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;box-shadow:var(--shadow)}

/* ── TAB BAR ── */
.tab-bar-wrap{position:relative}
.tab-bar-wrap::after{content:'';position:absolute;right:0;top:0;bottom:1px;width:48px;background:linear-gradient(to left,#fff 60%,transparent);pointer-events:none;z-index:1;transition:opacity .2s}
.tab-bar-wrap.at-end::after{opacity:0}
#tab-bar{display:flex;border-bottom:1px solid var(--border);padding-left:4px;overflow-x:auto;scrollbar-width:none}
#tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:11px 15px;font-size:12.5px;white-space:nowrap;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-bottom:-1px;color:var(--ink3);font-weight:400;flex-shrink:0}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tab-btn:hover:not(.active){color:var(--ink);background:#f9fafb}
.tab-cnt{font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}
.tab-btn.active .tab-cnt{background:var(--blue);color:#fff}
.tab-btn:not(.active) .tab-cnt{background:var(--border);color:var(--ink3)}

/* ── TAB CONTENT ── */
.tab-body{padding:16px;max-height:400px;overflow-y:auto;overflow-x:auto}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:#f9fafb}
.tbl td{padding:7px 10px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f9fafb}
.mono{font-family:var(--mono)}
.muted{color:var(--ink3)}
.bold{font-weight:600}
.upl-badge{font-size:9px;padding:1px 5px;border-radius:99px;background:#ede9fe;color:#7c3aed;border:1px solid #ddd6fe;margin-left:4px;vertical-align:middle}

/* ── UPLOAD GRID ── */
.uz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:16px}
.uz{border:1.5px dashed var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff;transition:border-color .15s}
.uz:hover{border-color:var(--blue)}
.uz.filled{border:1.5px solid var(--green);background:var(--greenb)}
.uz.req-slot{border-color:#fca5a5;background:#fef9f9}
.uz-inner{display:flex;align-items:center;gap:10px}
.uz-ico{width:28px;height:28px;border-radius:6px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink3)}
.uz.filled .uz-ico{background:#dcfce7;color:var(--green)}
.uz-n{font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.uz-s{font-size:11px;color:var(--ink3);margin-top:2px}

/* ── FOOT BAR ── */
.foot-bar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:14px 16px;border-top:1px solid var(--border)}
.btn-gen{display:inline-flex;align-items:center;gap:7px;padding:9px 22px;border:none;border-radius:8px;background:linear-gradient(135deg,#6d28d9,#1d4ed8);color:#fff;font-size:13.5px;font-weight:600;transition:opacity .15s}
.btn-gen:hover{opacity:.88}
.btn-gen:disabled{opacity:.4;cursor:not-allowed}

/* ── SPINNER ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(128,0,128,.2);border-top-color:var(--p);border-radius:50%;animation:spin .6s linear infinite}
.spinner.white{border-color:rgba(255,255,255,.3);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── PULSE ── */
.pulse-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1.2s ease-in-out infinite;margin-right:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── PRINT ── */
@media print {
  .topbar, .foot-bar, .pat-head, .tab-bar-wrap, .card:not(.summary-card),
  .err-banner, #summary-ready-container, button, .btn, .btn-gen,
  [style*="position:sticky"] { display:none!important; }
  body { background:#fff; font-size:12pt; }
  .summary-card { border:none; box-shadow:none; margin:0; }
  .summary-body pre { font-size:11pt; line-height:1.7; }
  @page { margin:20mm; }
}

/* ── SUMMARY PANEL ── */
.summary-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:16px}
.summary-head{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--greenb);border-bottom:1px solid var(--greenbr);flex-wrap:wrap}
.summary-title{font-weight:600;color:var(--green);font-size:14px;flex:1}
.summary-body pre{padding:20px 24px;white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.8;color:var(--ink);margin:0}

/* ── BTNS ── */
.btn-sec{padding:7px 14px;border:1px solid var(--border);background:#fff;border-radius:6px;font-size:12px;color:var(--ink2)}
.btn-sec:hover{background:var(--surf)}
.btn-pri{padding:7px 14px;border:none;border-radius:6px;background:var(--p);color:#fff;font-size:12px;font-weight:600}
.btn-pri:hover{background:#5c0060}

/* ── TOAST ── */
.toast{position:fixed;top:18px;right:18px;z-index:9999;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;display:none;align-items:center;gap:8px;max-width:360px;box-shadow:0 8px 28px rgba(0,0,0,.12);animation:slideIn .2s ease}
.toast.ok{background:var(--greenb);color:var(--green);border:1.5px solid var(--greenbr)}
.toast.err{background:var(--redb);color:var(--red);border:1.5px solid #fca5a5}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}

/* ── ERR BANNER ── */
.err-banner{display:none;padding:10px 14px;background:var(--redb);border:1px solid #fca5a5;border-radius:8px;font-size:12.5px;color:var(--red);margin-bottom:14px}

/* ── BIG LOADING ── */
.big-load{padding:60px 32px;text-align:center}
.big-load-spinner{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--pl),var(--blueb));display:flex;align-items:center;justify-content:center;margin:0 auto 20px}

@keyframes ee-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.ee-bar-fill{height:100%;width:40%;background:linear-gradient(90deg,var(--p),#c040c0);border-radius:99px;animation:ee-bar 1.8s ease-in-out infinite}

/* ── GENERATION SCREENS ── */
.gen-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:44px 40px;text-align:center;box-shadow:var(--shadow);max-width:580px;margin:0 auto}
.gen-icon-box{width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.gen-icon-box.ok{background:var(--greenb);border:2px solid var(--greenbr)}
.gen-icon-box.err{background:var(--redb);border:2px solid #fca5a5}
.gen-prog-bar{height:8px;background:#f3e8ff;border-radius:99px;overflow:hidden;margin-bottom:8px}
.gen-prog-fill{height:100%;background:var(--p);border-radius:99px;transition:width .3s ease}
.gen-stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:22px}
.gen-stat{border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.gen-stat-val{font-size:32px;font-weight:900;line-height:1}
.gen-stat-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-top:5px}
.gs-step{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);text-align:left}
.gs-step:last-child{border-bottom:none}
.gs-icon{font-size:18px;flex-shrink:0;line-height:1.3;min-width:20px}
.gs-title{font-size:13.5px;font-weight:600}
.gs-detail{font-size:11.5px;margin-top:1px}
.gen-bc{font-size:12px;color:var(--ink3);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.gen-h{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:16px}
.gap-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:24px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.gap-table th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);border-bottom:1px solid var(--border);background:var(--surf)}
.gap-table td{padding:11px 14px;border-bottom:1px solid var(--border)}
.gap-table tr:last-child td{border-bottom:none}
.gen-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.gen-btn-pri{padding:9px 20px;border:none;border-radius:8px;background:var(--p);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.gen-btn-pri:hover{background:#5c0060}
.gen-btn-warn{padding:9px 20px;border:1px solid var(--amberbr);border-radius:8px;background:var(--amberb);color:#92400e;font-size:13px;font-weight:600;cursor:pointer}
</style>
<script src="/config.js"></script>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <!-- Back / Prev / Next -->
  <button class="tbtn" onclick="goBack()" style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Dashboard
  </button>
  <div class="tdiv"></div>
  <div class="tlogo">Foqal CareOS</div>
  <div class="tspace"></div>
  <span class="tuser" id="top-user"></span>
  <button class="tbtn" onclick="signOut()">Sign Out</button>
</div>

<div class="page">

  <div class="err-banner" id="err-banner"></div>

  <!-- DYNAMIC CONTENT -->
  <div id="main-content">
    <div class="big-load">
      <div class="big-load-spinner">
        <div class="spinner" style="width:22px;height:22px;border-width:3px"></div>
      </div>
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px">Loading Patient Data</div>
      <div style="font-size:26px;font-weight:800;color:var(--ink);font-family:var(--mono);margin-bottom:10px" id="loading-hadm">HADM …</div>
      <div style="max-width:340px;margin:20px auto 0">
        <div style="height:5px;background:var(--pl);border-radius:99px;overflow:hidden;border:1px solid #ddd6fe">
          <div class="ee-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ── Auth guard ── */
const _user  = JSON.parse(sessionStorage.getItem('foqal_user') || '{}');
if (!_user.email) window.location.href = '/';
const _urlParams = new URLSearchParams(window.location.search);
const _hadmFromUrl = parseInt(_urlParams.get('hadm_id'));
if (_hadmFromUrl) sessionStorage.setItem('foqal_hadm', _hadmFromUrl.toString());
const _hadmId = _hadmFromUrl || parseInt(sessionStorage.getItem('foqal_hadm') || '0');
if (!_hadmId) window.location.href = '/dashboard.html';

const _patientNameFromUrl = _urlParams.get('patient_name');
if (_patientNameFromUrl) sessionStorage.setItem('foqal_patient_name', _patientNameFromUrl);
const _patientNameFallback = _patientNameFromUrl || sessionStorage.getItem('foqal_patient_name') || '';

const _displayId = sessionStorage.getItem('foqal_display_id_' + _hadmId) || null;
const _pidLabel  = window.fmtPid ? fmtPid(_hadmId, _displayId) : ('HADM-' + _hadmId);

document.getElementById('top-user').textContent     = _user.full_name || _user.email || '';
document.getElementById('loading-hadm').textContent = _pidLabel;

/* ── Identity ── */
const _patientName = () => window.S?.patient?.full_name || window.S?.patient?.patient_name || _patientNameFallback || ('Patient ' + _hadmId);

/* ── DPDPA consent state ── */
let _consented = false;
function onConsentChange(cb) {
  _consented = cb.checked;
  const grid = document.getElementById('uz-grid');
  if (grid) { grid.style.opacity = _consented ? '1' : '.45'; grid.style.pointerEvents = _consented ? '' : 'none'; }
  const genBtn = document.getElementById('gen-btn');
  if (genBtn) { genBtn.style.opacity = _consented ? '1' : '.45'; genBtn.style.pointerEvents = _consented ? '' : 'none'; }
}

/* ── DCM Checklist and NYHA state helpers ── */
function onDcmChange(key, checked) {
  S[key] = checked;
  sessionStorage.setItem(key + '_' + _hadmId, checked ? 'true' : 'false');
  render();
}
function onNyhaChange(val) {
  S.nyhaClass = val;
  sessionStorage.setItem('dcm_nyha_class_' + _hadmId, val);
  render();
}


/* ── SVG icon helper ── */
function svg(name, sz) {
  sz = sz || 14;
  const a = `width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"`;
  const icons = {
    upload:   `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>`,
    check:    `<polyline points="20 6 9 17 4 12"/>`,
    user:     `<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>`,
    chevR:    `<polyline points="9 18 15 12 9 6"/>`,
    download: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`,
    alert:    `<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>`,
    pulse:    `<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>`,
  };
  return `<svg ${a}>${icons[name]||''}</svg>`;
}

/* ── Indian drug name mapping (mirrors backend/app/cims_drug_map.py) ── */
const _DRUG_MAP = {
  "aspirin":"Ecosprin","acetylsalicylic acid":"Ecosprin",
  "clopidogrel":"Clopivas","ticagrelor":"Brilinta","prasugrel":"Practi",
  "aspirin-clopidogrel":"Ecosprin-Gold","aspirin/clopidogrel":"Ecosprin-Gold",
  "heparin":"Heparin","enoxaparin":"Clexane","fondaparinux":"Arixtra",
  "warfarin":"Warf","rivaroxaban":"Xarelto","apixaban":"Eliquis","dabigatran":"Pradaxa",
  "metoprolol":"Metolar XR","metoprolol succinate":"Metolar XR","metoprolol tartrate":"Metolar",
  "bisoprolol":"Concor","carvedilol":"Cardivas","atenolol":"Tenormin",
  "propranolol":"Inderal","nebivolol":"Nebicard",
  "ramipril":"Cardace","lisinopril":"Listril","enalapril":"Envas",
  "perindopril":"Coversyl","captopril":"Capoten","trandolapril":"Gopten","fosinopril":"Fovas",
  "losartan":"Cosart","valsartan":"Valzaar","candesartan":"Candesar","olmesartan":"Olsar",
  "irbesartan":"Irbetan","telmisartan":"Telma","azilsartan":"Azilide",
  "sacubitril":"Vymada","sacubitril/valsartan":"Vymada","sacubitril-valsartan":"Vymada","entresto":"Vymada",
  "amlodipine":"Stamlo","diltiazem":"Dilzem","verapamil":"Calaptin","nifedipine":"Nicardia","felodipine":"Plendil",
  "atorvastatin":"Atorva","rosuvastatin":"Rozavel","simvastatin":"Simvotin",
  "pravastatin":"Pravator","pitavastatin":"Livalo","lovastatin":"Lova","fluvastatin":"Lescol",
  "spironolactone":"Aldactone","eplerenone":"Inspra",
  "furosemide":"Lasix","frusemide":"Lasix","torsemide":"Dytor","torasemide":"Dytor","bumetanide":"Burinex",
  "hydrochlorothiazide":"Hydrochlorothiazide","indapamide":"Natrilix SR","metolazone":"Zaroxolyn",
  "nitroglycerin":"Nitrocontin","glyceryl trinitrate":"Nitrocontin",
  "isosorbide dinitrate":"Sorbitrate","isosorbide mononitrate":"Monotrate","isosorbide":"Sorbitrate",
  "nicorandil":"Nikoran","trimetazidine":"Vastarel MR","ranolazine":"Ranolaz","ivabradine":"Coralan",
  "empagliflozin":"Jardiance","dapagliflozin":"Forxiga","canagliflozin":"Invokana",
  "amiodarone":"Cordarone","sotalol":"Sotalol","flecainide":"Flecaine","digoxin":"Lanoxin",
  "adenosine":"Adenocor","lidocaine":"Xylocard","lignocaine":"Xylocard",
  "hydralazine":"Nepresol","clonidine":"Catapres","prazosin":"Minipress","doxazosin":"Cardura",
  "tirofiban":"Tirofiban","eptifibatide":"Integrilin","abciximab":"Reopro",
  "streptokinase":"Streptokinase","alteplase":"Actilyse","tenecteplase":"Metalyse",
  "metformin":"Glycomet","insulin glargine":"Basalog","insulin detemir":"Levemir",
  "insulin aspart":"Novorapid","insulin lispro":"Humalog",
  "sitagliptin":"Januvia","vildagliptin":"Galvus","saxagliptin":"Onglyza",
  "pantoprazole":"Pan","omeprazole":"Omez","rabeprazole":"Razo","lansoprazole":"Lanzol","esomeprazole":"Nexpro",
  "potassium chloride":"Potklor","potassium":"Potklor",
  "paracetamol":"Calpol","acetaminophen":"Calpol","tramadol":"Ultracet",
  "morphine":"Morphine","fentanyl":"Fentanyl","ketorolac":"Toradol",
  "midazolam":"Dormicum","diazepam":"Calmpose","lorazepam":"Ativan",
  "cefazolin":"Reflin","cephalexin":"Sporidex",
  "amoxicillin-clavulanate":"Augmentin","amoxicillin/clavulanate":"Augmentin",
};
function _iDrug(name) {
  if (!name || name === '—') return name;
  const k = name.trim().toLowerCase();
  if (_DRUG_MAP[k]) return _DRUG_MAP[k];
  const first = k.split(' ')[0];
  if (_DRUG_MAP[first]) return _DRUG_MAP[first];
  for (const mk in _DRUG_MAP) { if (k.startsWith(mk)) return _DRUG_MAP[mk]; }
  return name;
}

/* ── State ── */
const S = {
  patient: null, admission: null,
  diagnoses:[], procedures:[], labs:[], meds:[], micro:[],
  icuEvts:[], transfers:[], icuStays:[],
  pharmacy:[], inputEvts:[], outputEvts:[], poe:[],
  chartEvts:[], prevFiles:[],

function activeSlots() {
  const dt = S.dischargeType;
  const hidden = dt ? (HIDDEN_SLOTS[dt] || new Set()) : new Set();
  const optional = dt ? (OPTIONAL_SLOTS[dt] || new Set()) : new Set();
  const base = FILE_SLOTS
    .filter(s => !hidden.has(s.k))
    .map(s => optional.has(s.k) ? {...s, optional: true} : s);
  const extra = (dt && EXTRA_SLOTS[dt]) ? EXTRA_SLOTS[dt] : [];
  return [...base, ...extra];
}

function seeded(hadmId, max) {
  let h = parseInt(hadmId) || 0;
  h = ((h >> 16) ^ h) * 0x45d9f3b;
  h = ((h >> 16) ^ h) * 0x45d9f3b;
  h = (h >> 16) ^ h;
  return Math.abs(h) % max;
}
function seeded2(hadmId, salt, max) { return seeded(hadmId * 31 + salt, max); }

async function apiFetch(url, timeoutMs = 30000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) { const b = await r.json().catch(()=>({})); throw new Error(b.detail || `HTTP ${r.status}`); }
    return r.json();
  } finally {
    clearTimeout(timer);
  }
}

        <td class="mono">${s2!=null?s2+'%':'—'}</td>
        <td class="mono">${hr!=null?hr:'—'}</td>
        <td class="mono">${bpS!=null?(bpD!=null?bpS+' / '+bpD:bpS):'—'}</td>
        <td class="mono">${rr!=null?rr:'—'}</td>
        <td class="mono">${tp!=null?tp:'—'}</td>
        <td>${_n2b(sc)}</td>
      </tr>`;
    });
    return `<table class="tbl"><thead><tr><th>Date / Time</th><th>SpO₂ (%)</th><th>HR (bpm)</th><th>BP (mmHg)</th><th>RR (/min)</th><th>Temp (°C)</th><th>NEWS2</th></tr></thead><tbody>
      ${vRows.join('')}
    </tbody></table>${upl}`;
  }
  if (t==='Medications') {
    const upl = _uplTable('meds');
    const _SM = [
      {brand:'Ecosprin 75',   salt:'Aspirin',          dose:'75 mg',  route:'Oral', freq:'OD', note:'—'},
      {brand:'Clopivas 75',   salt:'Clopidogrel',      dose:'75 mg',  route:'Oral', freq:'OD', note:'—'},
      {brand:'Atorva 40',     salt:'Atorvastatin',     dose:'40 mg',  route:'Oral', freq:'OD', note:'—'},
      {brand:'Lasix 40',      salt:'Furosemide',       dose:'40 mg',  route:'Oral', freq:'BD', note:'—'},
      {brand:'Metolar XR 25', salt:'Metoprolol Succ.', dose:'25 mg',  route:'Oral', freq:'OD', note:'—'},
      {brand:'Aldactone 25',  salt:'Spironolactone',   dose:'25 mg',  route:'Oral', freq:'OD', note:'—'},
      {brand:'Warf 5',        salt:'Warfarin',         dose:'5 mg',   route:'Oral', freq:'OD', note:'INR monitoring'},
    ];
    const medsToShow = S.meds.length ? null : _SM;
    if (medsToShow) {
      return `<table class="tbl"><thead><tr><th>Brand (Indian)</th><th>Salt / Generic</th><th>Dose</th><th>Route</th><th>Freq</th><th>Note</th></tr></thead><tbody>
        ${medsToShow.map(m=>`<tr>
          <td class="bold">${m.brand}</td>
          <td class="muted">${m.salt}</td>
          <td class="mono">${m.dose}</td>
          <td><span class="pill pill-slate" style="font-size:10px">${m.route}</span></td>
          <td class="muted">${m.freq}</td>
          <td class="muted">${m.note}</td>
        </tr>`).join('')}
      </tbody></table>${upl}`;
    }
    return `<table class="tbl"><thead><tr><th>Brand (Indian)</th><th>Salt / Generic</th><th>Dose</th><th>Route</th><th>Freq</th><th>Note</th></tr></thead><tbody>
      ${S.meds.map(m=>`<tr>
        <td class="bold">${m._drugIn||_iDrug(m.drug||m.formulary_drug_cd||'—')}${m._upl?uplBadge:''}</td>
        <td class="muted">${m.drug||m.formulary_drug_cd||'—'}</td>
        <td class="mono">${m.dosage||(m.dose_val_rx?(m.dose_val_rx+' '+(m.dose_unit_rx||'')).trim():'—')}</td>
        <td><span class="pill pill-slate" style="font-size:10px">${m.route||'—'}</span></td>
        <td class="muted">${m.frequency||(m.doses_per_24_hrs?m.doses_per_24_hrs+'×/day':'—')}</td>
        <td class="muted">—</td>
      </tr>`).join('')}
    </tbody></table>${upl}`;
  }
  if (t==='Pharmacy') {
    const upl = _uplTable('pharmacy');
    if (!S.pharmacy.length) return upl || `<div class="muted" style="padding:20px">No pharmacy records.</div>`;
    return `<table class="tbl"><thead><tr><th>Medication</th><th>Frequency</th><th>Doses/24h</th><th>Status</th><th>Start</th></tr></thead><tbody>
      ${S.pharmacy.map(p=>`<tr><td class="bold">${p._drugIn||_iDrug(p.medication||p.formulary_drug_cd||'—')}</td><td class="muted">${p.frequency||'—'}</td><td class="mono">${p.doses_per_24_hrs??'—'}</td><td><span class="pill pill-slate" style="font-size:10px">${p.status||'—'}</span></td><td class="muted">${(p.starttime||'').replace('T',' ').slice(0,16)||'—'}</td></tr>`).join('')}
    </tbody></table>${upl}`;
  }
  if (t==='Microbiology') {
    const upl = _uplTable('microbiology');
    if (!S.micro.length) return upl || `<div class="muted" style="padding:20px">No microbiology results.</div>`;
    return `<table class="tbl"><thead><tr><th>Specimen</th><th>Organism</th><th>Antibiotic</th><th>Interp.</th><th>Time</th></tr></thead><tbody>
      ${S.micro.map(m=>`<tr><td class="bold">${m.spec_type_desc||'—'}</td><td style="color:var(--red)">${m.org_name||'—'}</td><td>${m.ab_name||'—'}</td><td><span class="pill ${m.interpretation==='S'?'pill-green':'pill-red'}">${m.interpretation||'—'}</span></td><td class="muted">${(m.charttime||'').replace('T',' ').slice(0,16)||'—'}</td></tr>`).join('')}
    </tbody></table>${upl}`;
  }
  if (t==='ICU Events') {
    const upl = _uplTable('icu');
    if (!S.icuEvts.length) return upl || `<div class="muted" style="padding:20px">No ICU events recorded.</div>`;
    return `<table class="tbl"><thead><tr><th>Event</th><th>Value</th><th>Status</th><th>Start</th><th>End</th></tr></thead><tbody>
      ${S.icuEvts.map(e=>`<tr><td class="bold">${e.ordercategoryname||'—'}</td><td class="mono">${e.value||'—'} ${e.valueuom||''}</td><td><span class="pill pill-blue" style="font-size:10px">${e.statusdescription||'—'}</span></td><td class="muted">${(e.starttime||'').replace('T',' ').slice(0,16)||'—'}</td><td class="muted">${(e.endtime||'').replace('T',' ').slice(0,16)||'—'}</td></tr>`).join('')}
    </tbody></table>${upl}`;
  }
  if (t==='Fluids I/O') {
    const upl = _uplTable('fluids');
    function _netSty(n) {
      if (n < 0)    return 'color:var(--green);font-weight:700';
      if (n > 2000) return 'color:var(--red);font-weight:700';
      if (n > 1000) return 'color:var(--amber);font-weight:700';
      return '';
    }
    const hdrs = `<thead><tr><th>Date</th><th>IV Intake (mL)</th><th>Oral Intake (mL)</th><th>Urine Output (mL)</th><th>Net Balance (mL)</th></tr></thead>`;
    if (!S.inputEvts.length && !S.outputEvts.length) {
      const _SF = [{d:'Day 1',iv:2800,ur:1200},{d:'Day 2',iv:2400,ur:1600},{d:'Day 3',iv:2000,ur:1900}];
      const cumIV=_SF.reduce((a,r)=>a+r.iv,0), cumUr=_SF.reduce((a,r)=>a+r.ur,0);
      return `<table class="tbl">${hdrs}<tbody>
        ${_SF.map(r=>`<tr>
          <td class="bold">${r.d}</td>
          <td class="mono">${r.iv.toLocaleString()}</td>
          <td class="muted">—</td>
          <td class="mono">${r.ur.toLocaleString()}</td>
          <td class="mono" style="${_netSty(r.iv-r.ur)}">+${(r.iv-r.ur).toLocaleString()}</td>
        </tr>`).join('')}
        <tr style="background:#f9fafb;font-weight:700">
          <td>Cumulative</td>
          <td class="mono">${cumIV.toLocaleString()}</td>
          <td class="muted">—</td>
          <td class="mono">${cumUr.toLocaleString()}</td>
          <td class="mono" style="${_netSty(cumIV-cumUr)}">+${(cumIV-cumUr).toLocaleString()}</td>
        </tr>
      </tbody></table>${upl}`;
    }
    // Group MIMIC events by date
    const byD = {}, dOrd = [];
    for (const e of S.inputEvts) {
      const d=(e.starttime||e.charttime||'').slice(0,10); if(!d) continue;
      if(!byD[d]){byD[d]={iv:0,ur:0};dOrd.push(d);}
      const a=parseFloat(e.amount??e.totalamount??0);
      if(!isNaN(a)&&(e.amountuom||'').toLowerCase().includes('ml')) byD[d].iv+=a;
    }
    for (const e of S.outputEvts) {
      const d=(e.charttime||'').slice(0,10); if(!d) continue;
      if(!byD[d]){byD[d]={iv:0,ur:0};dOrd.push(d);}
      const v=parseFloat(e.value??0);
      if(!isNaN(v)&&(e.label||'').toLowerCase().includes('urine')) byD[d].ur+=v;
    }
    const dates=[...new Set(dOrd)].sort();
    let cIV=0,cUr=0;
    const dRows=dates.map(d=>{
      const r=byD[d]; const net=Math.round(r.iv-r.ur); cIV+=r.iv; cUr+=r.ur;
      return `<tr>
        <td class="bold">${d}</td>
        <td class="mono">${Math.round(r.iv).toLocaleString()}</td>
        <td class="muted">—</td>
        <td class="mono">${Math.round(r.ur).toLocaleString()}</td>
        <td class="mono" style="${_netSty(net)}">${net>=0?'+':''}${net.toLocaleString()}</td>
      </tr>`;
    });
    const cNet=Math.round(cIV-cUr);
    return `<table class="tbl">${hdrs}<tbody>
      ${dRows.join('')}
      <tr style="background:#f9fafb;font-weight:700">
        <td>Cumulative</td>
        <td class="mono">${Math.round(cIV).toLocaleString()}</td>
        <td class="muted">—</td>
        <td class="mono">${Math.round(cUr).toLocaleString()}</td>
        <td class="mono" style="${_netSty(cNet)}">${cNet>=0?'+':''}${cNet.toLocaleString()}</td>
      </tr>
    </tbody></table>${upl}`;
  }
  if (t==='Transfers') {
    const upl = _uplTable('transfers');
    if (!S.transfers.length) return upl || `<div class="muted" style="padding:20px">No transfers recorded.</div>`;
    return `<table class="tbl"><thead><tr><th>Event</th><th>Care Unit</th><th>In</th><th>Out</th></tr></thead><tbody>
      ${S.transfers.map(tr=>`<tr><td><span class="pill pill-slate">${tr.eventtype||'—'}</span></td><td class="bold">${tr.careunit||'—'}</td><td class="muted">${(tr.intime||'').replace('T',' ').slice(0,16)||'—'}</td><td class="muted">${(tr.outtime||'').replace('T',' ').slice(0,16)||'—'}</td></tr>`).join('')}
    </tbody></table>${upl}`;
  }
  if (t==='ICU Stays') {
    const upl = _uplTable('icustays');
    if (!S.icuStays.length) return upl || `<div class="muted" style="padding:20px">No ICU stays recorded.</div>`;
    return `<table class="tbl"><thead><tr><th>Stay ID</th><th>First Unit</th><th>Last Unit</th><th>In</th><th>Out</th><th>LOS</th></tr></thead><tbody>
      ${S.icuStays.map(s=>`<tr><td class="mono">${s.stay_id}</td><td>${s.first_careunit||'—'}</td><td>${s.last_careunit||'—'}</td><td class="muted">${(s.intime||'').replace('T',' ').slice(0,16)||'—'}</td><td class="muted">${(s.outtime||'').replace('T',' ').slice(0,16)||'—'}</td><td class="mono">${s.los!=null?Number(s.los).toFixed(2):'—'}</td></tr>`).join('')}
    </tbody></table>${upl}`;
  }
  if (t==='Physician Orders') {
    const upl = _uplTable('poe');
    if (!S.poe.length) return upl || `<div class="muted" style="padding:20px">No physician orders recorded.</div>`;
    return `<table class="tbl"><thead><tr><th>Type</th><th>Subtype</th><th>Status</th><th>Time</th></tr></thead><tbody>
      ${S.poe.slice(0,200).map(p=>`<tr><td class="bold">${p.order_type||'—'}</td><td class="muted">${p.order_subtype||'—'}</td><td><span class="pill pill-slate" style="font-size:10px">${p.order_status||'—'}</span></td><td class="muted">${(p.ordertime||'').replace('T',' ').slice(0,16)||'—'}</td></tr>`).join('')}
    </tbody></table>${upl}`;
  }
  if (t==='Uploaded Files') {
    if (!S.prevFiles.length) return `<div class="muted" style="padding:20px">No files uploaded yet.</div>`;
    return `<table class="tbl"><thead><tr><th>File</th><th>Type</th><th>Date</th><th></th></tr></thead><tbody>
      ${S.prevFiles.map(f=>`<tr>
        <td class="mono" style="font-size:12px">${f.file_name||f.name||'—'}</td>
        <td><span class="pill pill-slate" style="font-size:10px">${f.file_type||'—'}</span></td>
        <td class="muted">${(f.upload_date||f.created_at||'—').slice(0,10)}</td>
        <td><button onclick="deleteFile('${f.id||f.file_id||''}','${f.file_type||''}',this)" style="padding:3px 9px;border-radius:5px;border:1px solid #fca5a5;background:#fef2f2;color:#dc2626;font-size:11px;cursor:pointer">Delete</button></td>
      </tr>`).join('')}
    </tbody></table>`;
  }
  return '';
}

function fileSlotHTML(s) {
  const entries   = S.uploads[s.k] || [];
  const uploading = entries.some(e => e.status==='uploading');
  const doneCount = entries.filter(e => e.status==='done').length;
  const hasDone   = doneCount > 0 || !!S.uploadedFiles[s.k];
  const fname     = S.uploadedFiles[s.k]?.name;

  let pill = '';
  if (uploading) pill = `<span class="pill pill-blue" style="font-size:10px"><span class="pulse-dot"></span>Ingesting…</span>`;
  else if (doneCount>0) pill = `<span class="pill pill-green" style="font-size:10px">${svg('check',9)} ${doneCount} file${doneCount>1?'s':''}</span>`;
  else if (fname) pill = `<span class="pill pill-green" style="font-size:10px">${svg('check',9)} Uploaded</span>`;

  const reqBadge = s.required && !hasDone
    ? `<span style="margin-left:4px;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;vertical-align:middle">REQUIRED</span>`
    : '';
  const optBadge = s.optional && !hasDone
    ? `<span style="margin-left:4px;font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb;vertical-align:middle">OPTIONAL</span>`
    : '';
  const noteLine = s.note ? `<div style="font-size:9.5px;color:#6b7280;margin-top:2px">${s.note}</div>` : '';

  return `
    <label class="uz${hasDone?' filled':''}${s.required && !hasDone?' req-slot':''}">
      <input type="file" accept="${s.accepts}" style="display:none" class="slot-inp" data-k="${s.k}">
      <div class="uz-inner">
        <div class="uz-ico">${svg('upload',13)}</div>
        <div>
          <div class="uz-n">${s.title}${pill}${reqBadge}${optBadge}</div>
          <div class="uz-s">${fname||`Click to upload · ${s.accepts}`}</div>
          ${noteLine}
        </div>
      </div>
    </label>`;
}

/* ── Main render ── */
function render() {
  if (S.genScreen) {
    document.getElementById('main-content').innerHTML = renderGenScreen();
    return;
  }
  if (S.summary && S.summaryView) {
    document.getElementById('main-content').innerHTML = renderSummaryView();
    return;
  }
  if (S.summaryLoading) {
    document.getElementById('main-content').innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 40px;gap:16px">
        <span class="spinner" style="width:28px;height:28px;border-width:3px"></span>
        <div style="font-size:14px;font-weight:600;color:var(--ink2)">Loading summary…</div>
        <div style="font-size:12px;color:var(--ink3)">${_pidLabel}</div>
      </div>`;
    return;
  }
  if (!S.patient) return;

  const p = S.patient;
  const DISPLAY_TABS = ['Admissions','Diagnoses','Procedures','Microbiology','ICU Events','Transfers','ICU Stays'];
  // Failed tabs count as done so the banner can clear (retry happens silently in background)
  const lazyDone   = Object.keys(LAZY).filter(t => S.lazyLoaded[t] || S.lazyFailed[t]).length;
  const dispDone   = S.displayLoaded ? DISPLAY_TABS.length : 0;
  const total      = Object.keys(LAZY).length + DISPLAY_TABS.length;
  const done       = lazyDone + dispDone;
  const pct        = Math.round((done / total) * 100);
  const pendingTabs = [
    ...Object.keys(LAZY).filter(t => !S.lazyLoaded[t] && !S.lazyFailed[t]),
    ...(S.displayLoaded ? [] : DISPLAY_TABS),
  ];
  const activeTabs = [
    ...Object.keys(LAZY).filter(t => S.lazyLoading[t]),
    ...(!S.displayLoaded && S.patient ? ['clinical data'] : []),
  ];
  const allDataLoaded = done === total;

  // Tabs whose counts come from the display endpoint (not lazy)
  const DISP_TABS = new Set(['Diagnoses','Procedures','Microbiology','ICU Stays','Transfers']);

  const tabBar = TABS.map(t => {
    const cnt = tabCount(t);
    const isUploading = !!S.uploadingFor[t];
    const isLoading = (LAZY[t] && S.lazyLoading[t]) || isUploading;
    const notLoaded = LAZY[t] && !S.lazyLoaded[t] && !isUploading && S.patient;
    const isDispLoading = DISP_TABS.has(t) && !S.displayLoaded && S.patient;
    const uploadDot = isUploading
      ? `<span style="width:6px;height:6px;border-radius:50%;background:#f59e0b;display:inline-block;animation:pulse 1s infinite" title="Uploading…"></span>`
      : '';
    const cntBadge = uploadDot || (cnt > 0
      ? `<span class="tab-cnt">${cnt}</span>`
      : (isLoading || isDispLoading)
        ? `<span style="width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;animation:pulse 1s infinite"></span>`
        : notLoaded
          ? `<span style="width:6px;height:6px;border-radius:50%;background:var(--border);display:inline-block"></span>`
          : '');
    return `<button class="tab-btn${S.tab===t?' active':''}" data-tab="${t}">${t}${cntBadge}</button>`;
  }).join('');

  const _hasSummary = S.genDone || ['Awaiting Review','Ready for Review','Signed Off'].includes(S.encStatus);
  const _isRegenScenario = ['revision_requested','Revision Requested','Amendment Requested'].includes(S.encStatus);
  const genLabel = S.generating
    ? `<span class="spinner white"></span> Generating…`
    : _isRegenScenario ? `${svg('pulse',13)} Regenerate` : `Generate Summary ${svg('chevR',13)}`;

  // Compute T1/T2 gap counts for summary header badge
  const _gapBadge = (() => {
    if (!S.genDone || !S.summary) return '';
    const gr = computeGapRows();
    const t1 = gr.filter(r => r.tier==='T1').length;
    const t2 = gr.filter(r => r.tier==='T2').length;
    if (!t1 && !t2) return '<span class="pill pill-green" style="font-size:11px">All sections OK</span>';
    return (t1 ? `<span class="pill" style="background:#f3f4f6;color:var(--ink3);font-size:11px">${t1} T1</span>` : '')
         + (t2 ? `<span class="pill" style="background:#fffbeb;color:#d97706;font-size:11px">${t2} T2</span>` : '');
  })();

  // Sticky DCM flag: once detected true it never flips back, so the checklist
  // appears as soon as ANY data source (patient/admission/diagnoses) confirms it.
  if (!S.hasDCM) {
    S.hasDCM = (S.diagnoses || []).some(d => {
      const t = (d.long_title || '').toLowerCase();
      const c = (d.icd_code || '').toLowerCase();
      return t.includes('dcm') || t.includes('dilated cardiomyopathy') || t.includes('cardiomyopathy') || t.includes('heart failure') || c.includes('i42') || c.includes('i50');
    }) || (S.patient && (
      (S.patient.admission_diagnosis || '').toLowerCase().includes('dcm') ||
      (S.patient.admission_diagnosis || '').toLowerCase().includes('dilated cardiomyopathy') ||
      (S.patient.admission_diagnosis || '').toLowerCase().includes('cardiomyopathy') ||
      (S.patient.admission_diagnosis || '').toLowerCase().includes('heart failure')
    )) || (S.admission && (
      (S.admission.diagnosis || '').toLowerCase().includes('dcm') ||
      (S.admission.diagnosis || '').toLowerCase().includes('dilated cardiomyopathy') ||
      (S.admission.diagnosis || '').toLowerCase().includes('cardiomyopathy') ||
      (S.admission.diagnosis || '').toLowerCase().includes('heart failure')
    ));
  }
  // Persist so the next page-load (or dashboard navigation) picks it up instantly
  if (S.hasDCM) sessionStorage.setItem('foqal_hasDCM_' + _hadmId, '1');
  const _hasDCM = S.hasDCM;

  const _dcmChecklistComplete = !_hasDCM || (S.dcmLvef && S.dcmNyha && S.dcmDevice && S.dcmBnp && S.dcmAetiology && S.dcmMeds);
  const _nyhaSelected = !_hasDCM || S.dischargeType === 'Death' || (S.nyhaClass && S.nyhaClass !== '');

  const _canGenerate = (_consented && S.dischargeType && _dcmChecklistComplete && _nyhaSelected) || S.genDone;

  const _consentedAttr = _consented ? 'checked' : '';

  /* ── Revision toast (red) + Amendment toast (amber) — shown at top of upload form ── */
  const _revToast = (S.encStatus === 'Revision Requested') ? (() => {
    const rs = S.revisionState;
    const reason = rs?.rejection_reason || '';
    const doctor = rs?.rejected_by_name || '';
    const loading = !rs;
    return `<div style="background:#fef2f2;border-left:4px solid #dc2626;border-radius:6px;padding:13px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:700;color:#dc2626;margin-bottom:3px">Revision Requested${doctor ? ' by ' + doctor : ''}</div>
        ${loading ? `<div style="font-size:11.5px;color:#b91c1c;display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:10px;height:10px;border:1.5px solid #dc2626;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></span>Loading rejection details…</div>` : reason ? `<div style="font-size:12.5px;color:#7f1d1d;font-style:italic">"${reason.slice(0,250)}${reason.length>250?'…':''}"</div>` : ''}
      </div>
    </div>`;
  })() : '';

  const _amdToast = (S.encStatus === 'Amendment Requested') ? (() => {
    const am = S.amendmentState;
    const loading = !am;
    const _amdReasonLabel = {
      factual: 'Factual correction', diagnosis: 'Diagnosis update',
      medication: 'Medication dose change', procedure: 'Procedure clarification', other: 'Other'
    };
    const reasonLabel = am ? (_amdReasonLabel[am.reason] || am.reason || '') : '';

/* ── Bind events after render ── */
function bindEvents() {
  // Tab bar
  const tabBarEl = document.getElementById('tab-bar');
  const tabBarWrap = document.getElementById('tab-bar-wrap');
  function _updateTabFade() {
    if (!tabBarEl || !tabBarWrap) return;
    const atEnd = tabBarEl.scrollLeft + tabBarEl.clientWidth >= tabBarEl.scrollWidth - 4;
    tabBarWrap.classList.toggle('at-end', atEnd);
  }
  if (tabBarEl) {
    if (S.tabBarScroll) tabBarEl.scrollLeft = S.tabBarScroll;
    _updateTabFade();
    // Scroll active tab into view without jumping the page
    const activeBtn = tabBarEl.querySelector('.tab-btn.active');
    if (activeBtn) {
      const btnLeft = activeBtn.offsetLeft;
      const btnRight = btnLeft + activeBtn.offsetWidth;
      if (btnRight > tabBarEl.scrollLeft + tabBarEl.clientWidth)
        tabBarEl.scrollLeft = btnRight - tabBarEl.clientWidth + 16;
      else if (btnLeft < tabBarEl.scrollLeft)
        tabBarEl.scrollLeft = btnLeft - 16;
    }
    tabBarEl.addEventListener('scroll', () => { S.tabBarScroll = tabBarEl.scrollLeft; _updateTabFade(); }, { passive:true });
    tabBarEl.addEventListener('wheel', function(e) {
      const delta = e.deltaX !== 0 ? e.deltaX : e.deltaY;
      if (delta === 0) return;
      e.preventDefault();
      tabBarEl.scrollBy({ left: delta, behavior: 'auto' });
    }, { passive: false });
    tabBarEl.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        S.tab = btn.dataset.tab;
        if (LAZY[S.tab] && !S.lazyLoaded[S.tab] && !S.lazyLoading[S.tab]) {
          lazyLoad(S.tab);  // lazyLoad calls render() — handles badge + body
        } else {
          render();  // full re-render so badge counts are always current
        }
      });
    });
  }

  // File slot inputs
  document.querySelectorAll('.slot-inp').forEach(inp => {
    inp.addEventListener('change', e => handleUpload(e.target.dataset.k, e.target));
  });
}

/* ── Lazy load tab ── */
const _inflight = {};
async function lazyLoad(tab) {
  const apiTab = LAZY[tab];
  if (!apiTab || S.lazyLoaded[tab] || S.lazyLoading[tab]) return;
  if (_inflight[tab]) return;
  S.lazyLoading[tab] = true;
  // Don't touch lazyFailed here — it stays true during retry so allDataLoaded isn't re-blocked
  render();
  _inflight[tab] = (async () => {
    try {
      const data = await apiFetch(`${_DATA}/api/patient/${_hadmId}/tab/${apiTab}`, 90000);
      if (apiTab==='prescriptions') {
        S.meds = (data.prescriptions||[]).map(m=>({...m,drug:m.drug||m.formulary_drug_cd||'—',dosage:m.dose_val_rx?`${m.dose_val_rx} ${m.dose_unit_rx||''}`.trim():null}));
        if (typeof localizeMeds === 'function' && S.meds.length) {
          const _map = await localizeMeds(S.meds.map(m=>m.drug)).catch(()=>({}));
          S.meds.forEach(m => { m._drugIn = _map[m.drug] || m.drug; });
        }
      }
      else if (apiTab==='pharmacy') {
        S.pharmacy = data.pharmacy||[];
        if (typeof localizeMeds === 'function' && S.pharmacy.length) {
          const _pnames = S.pharmacy.map(p=>p.medication||p.formulary_drug_cd||'—');
          const _pmap   = await localizeMeds(_pnames).catch(()=>({}));
          S.pharmacy.forEach(p => { const n=p.medication||p.formulary_drug_cd||'—'; p._drugIn = _pmap[n] || n; });
        }
      }
      else if (apiTab==='poe')       S.poe = data.poe||[];
      else if (apiTab==='fluids')    { S.inputEvts = data.fluids||data.inputevents||[]; S.outputEvts = data.outputevents||[]; }
      else if (apiTab==='labevents') S.labs = data.labevents||[];
      else if (apiTab==='chartevents') S.chartEvts = data.chartevents||[];
      else if (apiTab==='procedureevents') S.icuEvts = data.procedureevents||[];
      S.lazyLoaded[tab] = true;
      delete S.lazyFailed[tab];
      // Clear ingestion spinner now that the tab data is ready
      if (S.uploadingFor[tab]) delete S.uploadingFor[tab];
      // Gap counts come from Pass 3 (set after generation) — no fallback to file-gap analysis
    } catch(err) {
      // ICU Events (procedureevents) is optional — non-ICU patients have no rows.
      // Treat server errors as empty rather than failed so we don't retry forever.
      if (apiTab === 'procedureevents') {
        S.icuEvts = [];
        S.lazyLoaded[tab] = true;
        delete S.lazyFailed[tab];
      } else {
        S.lazyFailed[tab] = true;
        // Retry silently in background without resetting lazyFailed (so allDataLoaded isn't blocked)
        setTimeout(() => { delete _inflight[tab]; if (S.patient && !S.lazyLoaded[tab]) lazyLoad(tab); }, 15000);
      }
      // Clear ingestion spinner on error too so user isn't stuck
      if (S.uploadingFor[tab]) delete S.uploadingFor[tab];
    }
    S.lazyLoading[tab] = false;
    delete _inflight[tab];
    render();
  })();
}

/* ── File upload ── */
async function handleUpload(k, inputEl) {
  const files = Array.from(inputEl.files);
  inputEl.value = '';
  if (!files.length) return;
  if (!S.uploads[k]) S.uploads[k] = [];

  const _KEY_TO_LAZY_TAB = {
    labs:'Labs', meds:'Medications', pharmacy:'Pharmacy',
    poe:'Physician Orders', fluids:'Fluids I/O', vitals:'Vitals',
    procedures:'Procedures', diagnoses:'Diagnoses', icu:'ICU Events',
    // Non-lazy tabs — spinner shows then clears once ingest_file returns
    microbiology:'Microbiology', transfers:'Transfers', icustays:'ICU Stays',
  };

  for (const file of files) {
    const eid = Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const _affectedTab = _KEY_TO_LAZY_TAB[k];

    S.uploads[k].push({id:eid, name:file.name, status:'uploading', rows:0, fileId:null});
    // Mark affected tab as upload-in-progress so it shows a spinner
    if (_affectedTab) S.uploadingFor[_affectedTab] = true;
    render();

    const form = new FormData();
    form.append('file', file);
    form.append('file_type', k);
    // Safety: clear spinner if ingest takes >2min (server hung)
    const _uploadTimeout = setTimeout(() => {
      if (S.uploadingFor[_affectedTab]) { delete S.uploadingFor[_affectedTab]; render(); }
    }, 120000);
    const _uploadCtrl = new AbortController();
    setTimeout(() => _uploadCtrl.abort(), 120000);
    try {
      const resp = await fetch(`${_API}/api/encounters/${_hadmId}/ingest_file`, {method:'POST',body:form,signal:_uploadCtrl.signal});
      clearTimeout(_uploadTimeout);
      const res  = await resp.json();
      if (!resp.ok) throw new Error(res.detail||'Upload failed');
      const entry = (S.uploads[k]||[]).find(x=>x.id===eid);
      if (entry) { entry.status='done'; entry.rows=res.rows_inserted||0; entry.fileId=res.file_id; }
      if (res.encounter_id && !S.encId) S.encId = res.encounter_id;
      S.uploadedFiles[k] = {name: file.name};

      // ── Instant UI: update file list and uploaded rows immediately ──────────
      if (res.file_id) {
        S.prevFiles = S.prevFiles.filter(f =>
          String(f.id||f.file_id) !== String(res.file_id) &&
          ((f.file_type||'').toLowerCase() !== k || (f.file_name||f.name) !== file.name)
        );
        S.prevFiles.unshift({ id: res.file_id, file_id: res.file_id, file_name: file.name, file_type: k, upload_date: new Date().toISOString() });
      }
      // Fetch uploaded rows BEFORE clearing the spinner so data is ready when spinner drops
      // Use apiFetch (has built-in 30s timeout) to avoid hanging here forever
      try {
        const udata = await apiFetch(`${_API}/api/encounters/${_hadmId}/uploaded_clinical_data`, 30000);
        if (udata) S.uploadedRows = udata;
      } catch(_) {}
      // Clear spinner — tab now shows data immediately
      if (_affectedTab) delete S.uploadingFor[_affectedTab];
      render();

      showToast(`${file.name} — ${res.rows_inserted||0} rows ingested`, 'ok');
      setTimeout(() => {
        if (S.uploads[k]) S.uploads[k] = S.uploads[k].filter(e => e.id !== eid);
        delete S.uploadedFiles[k];
        updateUploadSlots();
      }, 2500);

      // ── Background: refresh authoritative file list + revision banner ────────
      const _fetchEncId = res.encounter_id || S.encId;
      if (_fetchEncId) {
        fetch(`${_API}/api/encounters/${_fetchEncId}/files`)
          .then(fr => fr.ok ? fr.json() : null)
          .then(fd => {
            const f = fd && (Array.isArray(fd) ? fd : fd.files);
            // Skip if a delete is in-flight (would restore a just-deleted file)
            if (f && !(S._deletingIds && S._deletingIds.size > 0)) { S.prevFiles = f; render(); }
          })
          .catch(() => {});
      }
      fetch(`${_API}/api/encounters/${_hadmId}/revision_state`)
        .then(rs => rs.ok ? rs.json() : null)
        .then(rsd => { if (rsd && (S.encStatus === 'Revision Requested' || S.encStatus === 'Files Ready')) { S.revisionState = rsd; S.encStatus = rsd.enc_status || S.encStatus; render(); } })
        .catch(() => {});
    } catch(err) {
      clearTimeout(_uploadTimeout);
      const entry = (S.uploads[k]||[]).find(x=>x.id===eid);
      if (entry) { entry.status='error'; entry.errMsg=err.message; }
      if (_affectedTab) {
        delete S.uploadingFor[_affectedTab];
        S.lazyLoaded[_affectedTab] = false;
        S.lazyLoading[_affectedTab] = false;
      }
      const _isTimeout = err.name === 'AbortError';
      showToast(_isTimeout ? `${k}: Upload timed out — server took too long` : `${k}: ${err.message}`, 'err');
      render();
    }
    updateUploadSlots();
  }
}

function updateUploadSlots() {
  const grid = document.getElementById('uz-grid');
  if (grid) { grid.innerHTML = activeSlots().map(fileSlotHTML).join(''); bindSlotInputs(); }
}

function updateTabBar() {
  const el = document.getElementById('tab-bar');
  if (!el) return;
  el.innerHTML = TABS.map(t => {
    const cnt = tabCount(t);
    const isIngesting = !!S.uploadingFor[t];
    const isLoading = LAZY[t] && S.lazyLoading[t];
    const notLoaded  = LAZY[t] && !S.lazyLoaded[t] && S.patient;
    const badge = cnt > 0
      ? `<span class="tab-cnt">${cnt}</span>`
      : isIngesting ? `<span style="width:8px;height:8px;border:1.5px solid var(--amber);border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite"></span>`
      : isLoading  ? `<span style="width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;animation:pulse 1s infinite"></span>`
      : notLoaded  ? `<span style="width:6px;height:6px;border-radius:50%;background:var(--border);display:inline-block"></span>`
      : '';
    return `<button class="tab-btn${S.tab===t?' active':''}" data-tab="${t}">${t}${badge}</button>`;
  }).join('');
  el.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      S.tab = btn.dataset.tab;
      if (LAZY[S.tab] && !S.lazyLoaded[S.tab] && !S.lazyLoading[S.tab]) lazyLoad(S.tab);
      else render();
    });
  });
  el.scrollLeft = S.tabBarScroll;
}
function bindSlotInputs() {
  document.querySelectorAll('.slot-inp').forEach(inp => {
    inp.addEventListener('change', e => handleUpload(e.target.dataset.k, e.target));
  });
}

// Maps file_type key → LAZY tab name + which S.* fields to clear
const _FILE_TAB_MAP = {
  labs:      { tab: 'Labs',             clear: () => { S.labs = []; } },
  meds:      { tab: 'Medications',      clear: () => { S.meds = []; } },
  vitals:    { tab: 'Vitals',           clear: () => { S.chartEvts = []; } },

  fluids:    { tab: 'Fluids I/O',       clear: () => { S.inputEvts = []; S.outputEvts = []; } },

async function deleteFile(fileId, fileType, btn) {
  if (!fileId) { showToast('No file ID — cannot delete', 'err'); return; }
  // Normalise to lowercase — S.uploadedRows keys are always lowercase
  const _ftKey = (fileType || '').toLowerCase();
  // Optimistic: remove file entry AND its uploaded rows from state immediately.
  // Clear every possible key variant so stale case-mismatched entries don't linger.
  const _savedFile = S.prevFiles.find(function(f){ return String(f.id||f.file_id) === String(fileId); });
  S.prevFiles = S.prevFiles.filter(function(f){ return String(f.id||f.file_id) !== String(fileId); });
  const _savedRows = _ftKey ? (S.uploadedRows[_ftKey] || null) : null;
  if (_ftKey) {
    delete S.uploadedRows[_ftKey];
    // Also wipe any title-case variant (e.g. 'Pharmacy') that might exist from older fetches
    const _ftTitle = _ftKey.charAt(0).toUpperCase() + _ftKey.slice(1);
    if (_ftTitle !== _ftKey) delete S.uploadedRows[_ftTitle];
  }
  // Clear the corresponding lazy-loaded tab data so it doesn't show stale ingested rows
  const _tabEntry = _FILE_TAB_MAP[_ftKey];
  if (_tabEntry) {
    const _tabName = _tabEntry.tab;
    _tabEntry.clear();
    S.lazyLoaded[_tabName]  = false;
    S.lazyLoading[_tabName] = false;
    S.lazyFailed[_tabName]  = false;
    delete _inflight[_tabName];
  }
  // Guard: prevent concurrent background fetches from restoring this file while delete is in flight
  if (!S._deletingIds) S._deletingIds = new Set();
  S._deletingIds.add(String(fileId));
  render(); // Uploaded Files row + data-tab uploaded rows vanish instantly (optimistic)
  try {
    const url = `${_API}/api/uploaded_files/${fileId}?file_type=${encodeURIComponent(fileType)}&hadm_id=${_hadmId}`;
    const r = await fetch(url, { method: 'DELETE' });
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `HTTP ${r.status}`);
    showToast('File deleted', 'ok');
    // Sync re-fetch uploaded rows so the data tab shows post-delete state immediately
    try {
      const udata = await apiFetch(`${_API}/api/encounters/${_hadmId}/uploaded_clinical_data`, 30000);
      if (udata) { S.uploadedRows = udata; render(); }
    } catch(_) {}
    // Background: refresh authoritative file list (guard lifted first so this can proceed)
    S._deletingIds.delete(String(fileId));
    if (S.encId) {
      fetch(`${_API}/api/encounters/${S.encId}/files`)
        .then(fr => fr.ok ? fr.json() : null)
        .then(fd => { const f = fd && (Array.isArray(fd) ? fd : fd.files); if (f) { S.prevFiles = f; render(); } })
        .catch(() => {});
    }
  } catch(err) {
    S._deletingIds.delete(String(fileId));
    // Restore both on server failure
    if (_savedFile) S.prevFiles.unshift(_savedFile);
    if (_savedRows) S.uploadedRows[_ftKey] = _savedRows;
    render();
    showToast('Delete failed: ' + err.message, 'err');
  }
}

/* ── Summary view (for already-generated patients) ── */
function buildSourceDataText() {
  const p = S.patient   || {};
  const a = S.admission || {};
  const L = [];

  function sec(num, title) { L.push(''); L.push('§' + num + ' — ' + title.toUpperCase()); L.push('─'.repeat(42)); }
  function row(k, v)        { L.push('  ' + (k + ':').padEnd(22) + (v || 'Not recorded')); }
  function bullet(v)        { L.push('  • ' + v); }
  function na(msg)          { L.push('  ' + (msg || 'Data not available')); }

  // §1 Patient Demographics
  sec(1, 'Patient Demographics');
  row('Name',           p.name || 'Not recorded');
  row('Age / Gender',   (p.anchor_age ? p.anchor_age + ' yrs' : '?') + ' / ' + (p.gender || '?'));
  row('Blood Group',    p.blood_group || 'Not recorded');
  row('Marital Status', p.marital_status || 'N/A');
  row('Race',           p.race || 'N/A');
  row('Language',       p.language || 'N/A');
  row('Ward',           p.ward || 'Not recorded');
  row('Patient ID',     _pidLabel);
  row('Admission Date', (a.admittime || '').split(' ')[0] || 'N/A');
  row('Discharge Date', (a.dischtime || '').split(' ')[0] || 'N/A');
  row('Admission Type', a.admission_type || 'N/A');
  row('Admitted From',  a.admission_location || 'N/A');
  row('Discharged To',  a.discharge_location || 'N/A');
  row('Discharge Type', S.dischargeType || 'Not selected');
  row('Insurance',      a.insurance || 'N/A');
  row('Expired in stay',a.hospital_expire_flag == 1 ? 'Yes' : 'No');

  // §2 Chief Complaint
  sec(2, 'Chief Complaint');
  if (S.diagnoses.length) {
    row('Primary Diagnosis', S.diagnoses[0].long_title || S.diagnoses[0].icd_code || '—');
    row('Admission Reason',  a.admission_type || 'N/A');
  } else { na(); }

  // §3 History of Presenting Illness
  sec(3, 'History of Presenting Illness');
  if (S.diagnoses.length > 1) {
    L.push('  Admission diagnoses:');
    S.diagnoses.slice(0, 10).forEach(function(d, i) {
      bullet((i === 0 ? '[PRIMARY] ' : '') + (d.long_title || d.icd_code || '—'));
    });
  }

  // §4 Significant Past History
  sec(4, 'Significant Past History');
  var pastDx = S.diagnoses.filter(function(d) { return d.seq_num > 1; });
  if (pastDx.length) {
    pastDx.slice(0, 8).forEach(function(d) { bullet(d.long_title || d.icd_code || '—'); });
  } else { na('No additional diagnoses recorded'); }

  function uplRows(key) { return S.uploadedRows[key] || []; }
  function uplBullets(key, labelFn) {
    var rows = uplRows(key);
    if (!rows.length) return;
    L.push('  + Uploaded (' + rows.length + ' rows):');
    rows.slice(0, 10).forEach(function(r) { bullet('[UPL] ' + labelFn(r)); });
  }

  // §5 Investigations Summary
  sec(5, 'Investigations Summary');
  if (S.labs.length) {
    L.push('  Labs (' + S.labs.length + ' records):');
    var labGroups = {};
    S.labs.forEach(function(l) { var k = l.label || l.itemid; if (!labGroups[k]) labGroups[k] = []; labGroups[k].push(l); });
    Object.keys(labGroups).slice(0, 12).forEach(function(k) {
      var r = labGroups[k][0];
      bullet(k + ': ' + (r.value || r.valuenum || '?') + ' ' + (r.valueuom || '') + (r.flag ? ' [' + r.flag + ']' : ''));
    });
  } else { na('Lab results not in GCS'); }
  uplBullets('labs', function(r){ return Object.values(r).slice(0,4).join(' | '); });
  L.push('');
  if (S.chartEvts.length) {
    L.push('  Vitals (' + S.chartEvts.length + ' records):');
    var vGroups = {};
    S.chartEvts.forEach(function(c) { var k = c.label || c.itemid; if (!vGroups[k]) vGroups[k] = []; vGroups[k].push(c); });
    Object.keys(vGroups).slice(0, 10).forEach(function(k) {
      var r = vGroups[k][0];
      bullet(k + ': ' + (r.value || r.valuenum || '?') + ' ' + (r.valueuom || ''));
    });
  } else { na('Vitals not in GCS'); }
  uplBullets('vitals', function(r){ return Object.values(r).slice(0,4).join(' | '); });

  // §6 Treatment Given
  sec(6, 'Treatment Given');

  // §7 Medications on Admission
  sec(7, 'Medications on Admission');
  if (S.meds.length) {
    L.push('  Prescriptions (' + S.meds.length + '):');
    S.meds.slice(0, 12).forEach(function(m) {
      bullet((m._drugIn || m.drug || m.formulary_drug_cd || '—') + (m.dose_val_rx ? '  ' + m.dose_val_rx + ' ' + (m.dose_unit_rx || '') : '') + (m.route ? '  [' + m.route + ']' : ''));
    });
  } else { na('Medications not in GCS'); }
  uplBullets('meds', function(r){ return (r.drug || r.medication || r.formulary_drug_cd || Object.values(r)[0] || '—') + (r.dose ? '  ' + r.dose : ''); });

  // §8 Procedures
  sec(8, 'Procedures Performed');
  if (S.procedures.length) {
    S.procedures.slice(0, 10).forEach(function(pr) { bullet(pr.long_title || pr.icd_code || '—'); });
  } else { na('No procedures in GCS'); }
  uplBullets('procedures', function(r){ return r.long_title || r.icd_code || Object.values(r)[0] || '—'; });
  if (S.pharmacy.length) {
    L.push('  Pharmacy (' + S.pharmacy.length + ' records):');
    S.pharmacy.slice(0, 5).forEach(function(ph) { bullet((ph.medication || ph.drug || '—') + (ph.doses_given ? '  doses: ' + ph.doses_given : '')); });
  }
  uplBullets('pharmacy', function(r){ return r.medication || r.drug || Object.values(r)[0] || '—'; });

  // §9 Clinical Progress Notes
  sec(9, 'Clinical Progress Notes');
  if (S.poe.length) {
    L.push('  Physician orders (' + S.poe.length + '):');
    S.poe.slice(0, 10).forEach(function(o) { bullet((o.order_type || '—') + ': ' + (o.order_subtype || o.medication || '')); });
  } else { na('Physician orders not in GCS'); }
  uplBullets('poe', function(r){ return (r.order_type || r.order_subtype || Object.values(r)[0] || '—'); });

  // §10 ICU Summary
  sec(10, 'ICU Summary');
  if (S.icuStays.length) {
    S.icuStays.forEach(function(s) {
      bullet((s.first_careunit || '?') + ' → ' + (s.last_careunit || '?') + '  LOS: ' + (s.los ? (+s.los).toFixed(1) + 'd' : '?'));
    });
  } else { na('No ICU admissions in GCS'); }
  uplBullets('icustays', function(r){ return (r.first_careunit || r.last_careunit || Object.values(r)[0] || '—') + (r.los ? '  LOS: ' + (+r.los).toFixed(1) + 'd' : ''); });
  if (S.icuEvts.length) {
    L.push('  ICU events (' + S.icuEvts.length + '):');
    S.icuEvts.slice(0, 6).forEach(function(e) { bullet((e.label || e.itemid || '—') + ': ' + (e.value || e.valuenum || '')); });
  }
  uplBullets('icu', function(r){ return Object.values(r).slice(0,4).join(' | '); });
  if (S.inputEvts.length || S.outputEvts.length) {
    row('Fluid inputs',  S.inputEvts.length + ' records');
    row('Fluid outputs', S.outputEvts.length + ' records');
  }
  uplBullets('fluids', function(r){ return Object.values(r).slice(0,4).join(' | '); });

  // §11 Discharge Condition
  sec(11, 'Discharge Condition');
  row('Discharge Location', a.discharge_location || 'N/A');
  row('Expired in stay',    a.hospital_expire_flag == 1 ? 'Yes' : 'No');
  if (S.chartEvts.length) {
    var lastVitals = S.chartEvts.slice(-5);
    L.push('  Most recent vitals:');
    lastVitals.forEach(function(c) { bullet((c.label || c.itemid || '—') + ': ' + (c.value || c.valuenum || '?') + ' ' + (c.valueuom || '')); });
  } else { na('Vitals not loaded'); }

  // §12 Discharge Instructions
  sec(12, 'Discharge Instructions');
  row('Discharged To', a.discharge_location || 'N/A');

  // §13 Follow-up Instructions
  sec(13, 'Follow-up Instructions');
  na('Follow-up plan not in structured data');

  // §14 Patient & Caregiver Education
  sec(14, 'Patient & Caregiver Education');
  na('Education records not in structured MIMIC data');

  // §15 Complications
  sec(15, 'Complications');
  if (S.micro.length) {
    L.push('  Microbiology (' + S.micro.length + ' records):');
    S.micro.slice(0, 8).forEach(function(m) {
      bullet((m.test_name || m.spec_type_desc || '—') + (m.org_name ? '  → ' + m.org_name : '  → No growth'));
    });
  } else { na('No microbiology data in GCS'); }
  uplBullets('microbiology', function(r){ return (r.test_name || r.spec_type_desc || Object.values(r)[0] || '—') + (r.org_name ? '  → ' + r.org_name : ''); });
  if (S.labs.length) {
    var abnormal = S.labs.filter(function(l) { return l.flag && l.flag.toLowerCase().includes('abnormal'); });
    if (abnormal.length) {
      L.push('  Abnormal lab flags (' + abnormal.length + '):');
      abnormal.slice(0, 8).forEach(function(l) { bullet((l.label || l.itemid || '—') + ': ' + (l.value || l.valuenum || '?') + ' [' + l.flag + ']'); });
    }
  }

  L.push('');
  return L.join('\n');
}

function _storeGapCounts() {
  var gr = computeGapRows();
  var t1 = gr.filter(function(r){ return r.tier === 'T1'; }).length;
  var t2 = gr.filter(function(r){ return r.tier === 'T2'; }).length;
  var t3 = gr.filter(function(r){ return r.tier === 'T3'; }).length;
  S.gapT1 = t1; S.gapT2 = t2; S.gapT3 = t3;
  try { localStorage.setItem('gap_counts_' + _hadmId, JSON.stringify({t1:t1, t2:t2, t3:t3})); } catch(e) {}
  // Store per-section gap tiers so the doctor review screen can show correct tier badges
  // Maps gap section codes (§N) to sections_json keys (sN) based on NABH semantic match
  var _GAP_TO_SJ = {'§2':['s2','s3'],'§4':['s5'],'§5':['s6','s7'],'§7':['s11'],'§8':['s10'],'§9':['s9'],'§10':['s9'],'§11':['s14'],'§13':['s12'],'§14':['s15'],'§15':['s13']};
  var _gTierRank = {T3:3, T2:2, T1:1};
  var _secTiers = {};
  gr.forEach(function(r) {
    (_GAP_TO_SJ[r.sec] || []).forEach(function(k) {
      if (!_secTiers[k] || (_gTierRank[r.tier]||0) > (_gTierRank[_secTiers[k]]||0)) _secTiers[k] = r.tier;
    });
  });
  try { localStorage.setItem('gap_sec_tiers_' + _hadmId, JSON.stringify(_secTiers)); } catch(e) {}
  // gap_rows are now written exclusively by Pass 3 — do not overwrite with pre-generation file-gap predictions
}

/* Compute which NABH sections are missing.
   Uses tabCount() — same source as the tab badges — so the gap table
   always reflects exactly what each tab shows. */
function computeGapRows() {
  const hasUpload = function(k) { return (S.uploads[k] || []).some(function(f) { return f.status === 'done'; }); };
  const hasClinicalNotes = hasUpload('notes') || S.tableLog.length > 0;
  // Only flag a gap when we KNOW the tab has no data — i.e., its fetch has completed.
  // If still in-flight, don't report a gap (we'd be counting loading as missing).
  // LAZY tabs track per-tab; display tabs share a single displayLoaded flag.
  const tabReady = function(t) {
    return LAZY[t] ? !!(S.lazyLoaded[t] || S.lazyFailed[t]) : !!S.displayLoaded;
  };
  const tc = {
    labs:       tabCount('Labs'),
    vitals:     tabCount('Vitals'),
    meds:       tabCount('Medications'),
    procedures: tabCount('Procedures'),
    diagnoses:  tabCount('Diagnoses'),
    micro:      tabCount('Microbiology'),
    icu:        tabCount('ICU Events') + tabCount('ICU Stays'),
    pharmacy:   tabCount('Pharmacy'),
  };
  const rows = [];

  // §5 Investigations
  if (tabReady('Labs') && tc.labs === 0 && !hasUpload('labs')) {
    // T3: AI will hallucinate lab values when none exist (fabricated clinical data)
    rows.push({ sec:'§5', title:'Investigations Summary',
      missing: 'No lab results uploaded — AI may hallucinate investigation values',
      tier:'T3', col:'var(--red)' });
  } else if (tabReady('Labs') && !hasClinicalNotes) {
    // T1: AI writes "ECG not available" — phrasing only, clinical meaning unchanged
    rows.push({ sec:'§5', title:'Investigations Summary',
      missing: 'ECG / Echo reports not found in uploaded files',
      tier:'T1', col:'var(--ink3)' });
  }

  // §11 Discharge Condition
  if (tabReady('Vitals') && tabReady('Labs') && tc.vitals === 0 && tc.labs === 0) {
    // T3: AI cannot document discharge state — will fabricate or miss critical data
    rows.push({ sec:'§11', title:'Discharge Condition',
      missing: 'No discharge vitals or labs — discharge condition cannot be documented',
      tier:'T3', col:'var(--red)' });
  }

  // §4 Clinical Examination
  if (tabReady('Vitals') && tc.vitals === 0 && !hasUpload('vitals')) {
    // T3: AI will hallucinate vitals (fabricated clinical data)
    rows.push({ sec:'§4', title:'Clinical Examination',
      missing: 'No vitals on record — AI may hallucinate examination findings',
      tier:'T3', col:'var(--red)' });
  }

  // §2 Chief Complaint & HPI (upload/DB only — no tab count, always knowable)
  if (!hasClinicalNotes) {
    // T3: AI will hallucinate history without source notes (fabricated clinical data)
    rows.push({ sec:'§2', title:'Chief Complaint & HPI',
      missing: 'Clinical notes not uploaded — AI may fabricate patient history',
      tier:'T3', col:'var(--red)' });
  }

  // §7 Medications on Admission
  if (tabReady('Medications') && tabReady('Pharmacy') && tc.meds === 0 && !hasUpload('meds') && !hasUpload('pharmacy')) {
    // T2: Directly medication-related — AI may write wrong drugs/doses
    rows.push({ sec:'§7', title:'Medications on Admission',
      missing: 'No medication records — risk of wrong drug or dose in output',
      tier:'T2', col:'var(--amber)' });
  }

  // §8 Procedures
  if (tabReady('Procedures') && tc.procedures === 0 && !hasUpload('procedures')) {
    // T3: AI may miss or fabricate procedures performed — missed finding / fabricated data
    rows.push({ sec:'§8', title:'Procedures',
      missing: 'No procedure records — AI may miss or fabricate procedures performed',
      tier:'T3', col:'var(--red)' });
  }

  // §9 Progress Notes (upload/DB only)
  if (!hasClinicalNotes) {
    // T3: AI will miss day-wise clinical findings (missed finding = critical)
    rows.push({ sec:'§9', title:'Clinical Progress Notes',
      missing: 'Progress notes not uploaded — AI may miss key clinical findings',
      tier:'T3', col:'var(--red)' });
  }

  // §10 ICU Summary — ICU Events is LAZY; ICU Stays is a display tab
  if (tabReady('ICU Events') && tabReady('ICU Stays') && tc.icu === 0) {
    // T3: AI may miss critical ICU interventions (missed finding = critical)
    rows.push({ sec:'§10', title:'ICU Summary',
      missing: 'No ICU admission data — critical ICU details may be missed',
      tier:'T3', col:'var(--red)' });
  }

  // §13 Follow-up Instructions (upload/DB only)
  if (!hasClinicalNotes && !hasUpload('poe')) {
    // T1: AI writes generic follow-up — style issue, clinical meaning minimally changed
    rows.push({ sec:'§13', title:'Follow-up Instructions',
      missing: 'Follow-up plan not found — AI will write generic instructions',
      tier:'T1', col:'var(--ink3)' });
  }

  // §14 Patient & Caregiver Education (upload/DB only)
  if (!hasClinicalNotes) {
    // T1: AI writes generic education content — phrasing/style issue
    rows.push({ sec:'§14', title:'Patient & Caregiver Education',
      missing: 'Clinical notes missing — AI will write generic education content',
      tier:'T1', col:'var(--ink3)' });
  }

  // §15 Complications
  if (tabReady('Labs') && tabReady('Microbiology') && tc.labs === 0 && tc.micro === 0 && !hasUpload('labs')) {
    // T3: AI will miss documented complications (missed finding = critical)
    rows.push({ sec:'§15', title:'Complications',
      missing: 'No lab or microbiology data — AI may miss documented complications',
      tier:'T3', col:'var(--red)' });
  }

  // Deduplicate, sort T3→T2→T1 (most critical first), cap at 5
  var seen = new Set();
  var unique = rows.filter(function(r) {
    if (seen.has(r.sec)) return false;
    seen.add(r.sec);
    return true;
  });
  var tierOrder = { T3:0, T2:1, T1:2 };
  unique.sort(function(a, b) { return (tierOrder[a.tier]||0) - (tierOrder[b.tier]||0); });
  return unique.slice(0, 5);
}

  if (S.genScreen === 'error') {

    const raw = S.genError || '';

    if (!raw || raw.toLowerCase().includes('empty')) {
      errCode = 'LLM-EMPTY'; errMsg = 'The server returned an empty response. The backend may have crashed.';
    } else if (raw.toLowerCase().includes('failed to fetch') || raw.toLowerCase().includes('networkerror') || raw.toLowerCase().includes('err_connection_refused')) {

    } else if (raw.includes('Max retries') || raw.includes('429') || raw.toLowerCase().includes('quota')) {
      errCode = 'LLM-429'; errMsg = 'API rate limit or quota reached. Too many requests were sent in a short window.'; errRecovery = '~60 seconds';
    } else if (raw === 'Error 500' || raw.toLowerCase().includes('internal server error')) {

  if (S.genScreen === 'done') {
