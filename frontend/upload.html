/* ── Generate ── */
let _genInterval = null;
let _pollInterval = null;

// pagehide fires for both regular navigation AND bfcache — save progress and release lock
window.addEventListener('pagehide', () => {
  if (S.genScreen === 'generating' && S.genProgress)
    sessionStorage.setItem('foqal_gen_progress_' + _hadmId, S.genProgress);
  if (_pollInterval) { clearInterval(_pollInterval); _pollInterval = null; }
  // Release poll leader lock so another tab can take over immediately
  try {
    const v = localStorage.getItem('foqal_poll_' + _hadmId);
    if (v && v.startsWith(_MY_POLL_ID)) localStorage.removeItem('foqal_poll_' + _hadmId);
  } catch {}
});

// If browser restores from bfcache (Back button), reload fresh so a stale
// poll from the previous visit doesn't resume alongside the new one
window.addEventListener('pageshow', (e) => {
  if (e.persisted) window.location.reload();
});

/* Poll the encounter status when we arrive on this page while generation is
   already running in the background (e.g., resident navigated to dashboard
   and came back). Every 5s we re-check; once the status leaves "Processing"
   we fetch the completed summary and hand off to the normal render path. */
// Unique ID for this page instance — used as the poll leader lock owner
const _MY_POLL_ID = Date.now().toString(36) + Math.random().toString(36).slice(2);

function _startProcessingPoll() {
  if (_pollInterval) return;
  if (!S.genProgress) S.genProgress = 30;

  // Claim the poll leader lock for this hadmId so other open tabs back off.
  // Key: 'foqal_poll_{hadmId}', value: '{tabId}:{timestamp}'
  const _LOCK_KEY = 'foqal_poll_' + _hadmId;
  const _claimLock = () => localStorage.setItem(_LOCK_KEY, _MY_POLL_ID + ':' + Date.now());
  const _releaseLock = () => {
    const v = localStorage.getItem(_LOCK_KEY);
    if (v && v.startsWith(_MY_POLL_ID)) localStorage.removeItem(_LOCK_KEY);
  };
  _claimLock();

  let _pollTicks = 0;
  _pollInterval = setInterval(async () => {
    // Leader check: yield if another tab claimed the lock in the last 4s
    const lock = localStorage.getItem(_LOCK_KEY);
    if (lock) {
      const [owner, ts] = lock.split(':');
      const stale = Date.now() - Number(ts) > 4000;
      if (owner !== _MY_POLL_ID && !stale) return; // another tab is active
    }
    _claimLock(); // renew our ownership

    try {
      const enc = await apiFetch(`${_API}/api/encounters/${_hadmId}/encounter`);
      if (!enc || !enc.id) return;
      if (enc.status === 'Processing') {
        _pollTicks++;
        S.genProgress = Math.min(80, S.genProgress + 2);
        sessionStorage.setItem('foqal_gen_progress_' + _hadmId, S.genProgress);
        if (_pollTicks === 45) { S.genStuck = true; render(); } // show cancel after ~90s
        patchGenProgress && patchGenProgress();
        return;
      }
      clearInterval(_pollInterval); _pollInterval = null;
      _releaseLock();
      S.encStatus = enc.status;
      S.encId     = enc.id;
      sessionStorage.removeItem('foqal_gen_progress_' + _hadmId);
      // Fetch the completed summary
      try {
        const sumResp = await fetch(`${_API}/api/encounters/${S.encId}/summary`);
        if (sumResp.ok) {
          const sum = await sumResp.json();
          if (sum && sum.content) {
            S.summary     = sum.content;
            S.genDone     = true;
            S.reviewSent  = ['Awaiting Review', 'Signed Off'].includes(S.encStatus);
            S.genProgress = 100;
            // Use Pass 3 results already stored in the summary row
            S.gapT1   = sum.gap_t1  || 0;
            S.gapT2   = sum.gap_t2  || 0;
            S.gapT3   = sum.gap_t3  || 0;
            S.gapRows = Array.isArray(sum.gap_rows) ? sum.gap_rows : [];
            S.genScreen   = null;
            S.summaryView = true;
          }
        }
      } catch {}
      if (S.genScreen === 'generating') S.genScreen = null;
      render();
    } catch {}
  }, 2000);
}

function handleGenerate() {
  if (!S.dischargeType) { showToast('Select a discharge type first', 'err'); return; }
  if (S.hasDCM) {
    const complete = S.dcmLvef && S.dcmNyha && S.dcmDevice && S.dcmBnp && S.dcmAetiology && S.dcmMeds;
    if (!complete) { showToast('Please complete the mandatory DCM Checklist', 'err'); return; }
    if (S.dischargeType !== 'Death' && (!S.nyhaClass || S.nyhaClass === '')) { showToast('Please select NYHA Class at Discharge', 'err'); return; }
  }
  // If lazy tabs are still loading, show confirmation strip instead of generating immediately
  const pendingTabs = Object.keys(LAZY).filter(t => !S.lazyLoaded[t] && !S.lazyFailed[t]);
  if (pendingTabs.length > 0 && !S.genWarnPending) {
    S.genWarnPending = true;
    S.genScreen = 'gap';
    render();
    return;
  }
  S.genWarnPending = false;
  // Regeneration path: clear stale review state so "Send to Attending" re-enables
  if (S.reviewSent || S.genDone) {
    S.reviewSent   = false;
    S.doctorSelect = false;
    S.sentTo       = null;
    S.genDone      = false;
  }
  proceedGenerate();
}

async function proceedGenerate() {
  if (_genInterval)  clearInterval(_genInterval);
  if (_pollInterval) { clearInterval(_pollInterval); _pollInterval = null; }
  S.genScreen      = 'generating';
  S.genProgress    = 0;
  S.generating     = true;
  S.doctorSelect   = false;
  S.streamingText  = '';
  // Persist across navigation: if user goes to dashboard mid-stream, upload.html
  // will use this flag to jump straight to the summary view when it loads done.
  sessionStorage.setItem('foqal_generating_' + _hadmId, '1');
  render();

  // Animate progress bar up to 80 while waiting; streaming takes over after
  _genInterval = setInterval(() => {
    if (S.genScreen !== 'generating') { clearInterval(_genInterval); return; }
    const speed = S.genProgress < 68 ? 3 : 0.5;
    S.genProgress = Math.min(80, S.genProgress + speed);
    patchGenProgress();
  }, 150);

  try {
    // Safety net: re-fire any tabs not yet cached
    const _BQ_TABS = ["prescriptions","pharmacy","labevents","poe",
                      "fluids","chartevents","procedureevents"];
    Promise.allSettled(_BQ_TABS.map(t =>
      fetch(`${_DATA}/api/patient/${_hadmId}/tab/${t}`).catch(() => {})
    ));

    const resp = await fetch(
      `${_API}/api/encounters/${_hadmId}/generate_summary?stream=true`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (sessionStorage.getItem('foqal_token') || '')
      },
      body: JSON.stringify({
        discharge_type: S.dischargeType,
        nyha_class: S.hasDCM ? S.nyhaClass : null
      }),
    });

    if (!resp.ok) {
      const b = await resp.json().catch(() => ({}));
      throw new Error(b.detail || `Error ${resp.status}`);
    }

    // Parse SSE stream
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let res = null;

    outer: while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete last line
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }

        if (evt.type === 'chunk') {
          // Kill the pre-streaming interval the moment streaming begins — otherwise
          // it fights the chunk increments (interval caps at 80, chunks push past it)
          if (_genInterval) { clearInterval(_genInterval); _genInterval = null; }
          S.streamingText += evt.text;
          // Patch streaming preview directly — no full render for perf
          const el = document.getElementById('gs-stream');
          if (el) el.textContent = S.streamingText;
          // Bump progress to 85-98 during streaming
          if (S.genProgress < 98) {
            S.genProgress = Math.min(98, S.genProgress + 0.4);
            patchGenProgress();
          }
        } else if (evt.type === 'done') {
          res = evt;
          break outer;
        } else if (evt.type === 'error') {
          throw new Error(evt.message || 'Stream error');
        }
      }
    }

    clearInterval(_genInterval);

    if (!res) throw new Error('Stream ended without completion event');

    S.summary        = res.summary || null;
    S.tableLog       = res.table_log || [];
    S.genError       = res.generation_error || null;
    S.genDone        = true;
    S.genProgress    = 100;
    S.genLatency     = res.latency || null;
    S.genRouge       = res.rouge || null;
    S.summaryVersion = res.summary_version || null;
    S.streamingText  = '';

    if (S.genError || !S.summary) {
      S.genScreen = 'error';
    } else {
      S.encStatus  = 'Ready for Review';
      S.reviewSent = false;
      // Pass 3 gap counts from SSE done event; refresh from DB in background (Pass 3 may finish slightly after done)
      S.gapT1   = res.gap_t1   || 0;
      S.gapT2   = res.gap_t2   || 0;
      S.gapT3   = res.gap_t3   || 0;
      S.gapRows = [];
      // Background fetch: get gap_rows + authoritative gap counts from DB
      apiFetch(`${_API}/api/encounters/${S.encId}/summary`)
        .then(s => {
          if (!s) return;
          if (Array.isArray(s.gap_rows)) S.gapRows = s.gap_rows;
          // Use DB values if they're available and non-zero (Pass 3 may have updated after done event)
          if (s.gap_t1 || s.gap_t2 || s.gap_t3) {
            S.gapT1 = s.gap_t1 || 0;
            S.gapT2 = s.gap_t2 || 0;
            S.gapT3 = s.gap_t3 || 0;
          }
          // Persist to localStorage so doctor dashboard always has up-to-date values
          try { localStorage.setItem('gap_counts_' + _hadmId, JSON.stringify({t1:S.gapT1, t2:S.gapT2, t3:S.gapT3})); } catch(_) {}
          render();
        })
        .catch(() => {});
      S.genScreen = 'done';
      showToast('Summary generated successfully!', 'ok');
    }
  } catch(err) {
    clearInterval(_genInterval);
    S.genError      = err.message || 'Request failed';
    S.genScreen     = 'error';
    S.streamingText = '';
  }
  S.generating = false;
  sessionStorage.removeItem('foqal_generating_' + _hadmId); // generation done on-page; flag no longer needed
  render();
  apiFetch(`${_API}/api/errors/stats`).then(es => { S.errorStats = es; render(); }).catch(() => {});
}

/* ── Load real doctors from backend ── */
async function loadDoctors() {
  if (S.doctors.length || S.doctorsLoading) return;
  S.doctorsLoading = true;
  render();
  try {
    const res = await apiFetch(`${_API}/api/users/doctors`);
    S.doctors = Array.isArray(res) ? res : (res.users || res.doctors || []);
  } catch { S.doctors = []; }
  S.doctorsLoading = false;

/* ── Confirm doctor selection and send ── */
async function confirmSend() {
  const sel = document.getElementById('doc-sel');
  const doc = sel ? sel.value : '';
  if (!doc) { showToast('Please select a doctor first', 'err'); return; }
  const btn = document.getElementById('confirm-send-btn');
  if (btn) { btn.textContent = 'Sending…'; btn.disabled = true; }
  await Promise.race([
    sendReview(doc),
    new Promise(resolve => setTimeout(resolve, 10000))
  ]);
  S.sentTo = doc;
  S.doctorSelect = false;
  render();
}

/* ── Send for review ── */
async function sendReview(assignedDoctor) {
  if (S.reviewSent) return;
  try {
    const encId = S.encId || (await apiFetch(`${_API}/api/encounters/${_hadmId}/encounter`)).id;
    if (encId) {
      await fetch(`${_API}/api/encounters/${encId}`, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({status:'Awaiting Review', assigned_to: assignedDoctor||null})
      });
    }
    S.reviewSent = true;
    showToast('Sent for review!', 'ok');
    render();
    setTimeout(() => { window.location.href = '/dashboard.html'; }, 1200);
  } catch { showToast('Could not update status', 'err'); }
}

/* ── Send to Attending Queue (no doctor picker) ── */
async function sendToQueue() {
  try {
    const encId = S.encId || (await apiFetch(`${_API}/api/encounters/${_hadmId}/encounter`)).id;
    if (encId) {
      await fetch(`${_API}/api/encounters/${encId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'Awaiting Review' })
      });
    }
    S.reviewSent = true;
    showToast('Sent to Attending Queue!', 'ok');
    setTimeout(() => { window.location.href = '/dashboard.html'; }, 1200);
  } catch(e) { showToast('Could not send to queue: ' + e.message, 'err'); }
}

let _tt = null;

  const t = document.getElementById('toast');
  t.textContent = msg; t.className='toast '+(type||'ok'); t.style.display='flex';
  if (_tt) clearTimeout(_tt);
  _tt = setTimeout(()=>{ t.style.display='none'; }, 3500);
}
function showErr(msg) { const e=document.getElementById('err-banner'); e.textContent=msg; e.style.display='block'; }
function hideErr()    { document.getElementById('err-banner').style.display='none'; }

/* ── LOAD PATIENT DATA ── */
(async () => {
  try {
    // When user clicks "Open Summary →" banner or returns after generation:
    // show the success card ('done') first instead of jumping straight to summary view.
    const _gotoSummary = !!sessionStorage.getItem('foqal_goto_summary_' + _hadmId)
                      || !!sessionStorage.getItem('foqal_generating_' + _hadmId);
    if (_gotoSummary) {
      sessionStorage.removeItem('foqal_goto_summary_' + _hadmId);
      // Only remove the generating flag if we are NOT already actively generating
      // in-memory (doRegenerate path — no page reload, just a new SSE stream).
      if (!S.generating) {
        sessionStorage.removeItem('foqal_generating_' + _hadmId);
        S.summaryLoading = true; // spinner while gap stats + summary load
      }
    }

    // Summary-only mode: "View Summary" on a Signed row opens directly in summary view,
    // no upload form, no back-to-upload button.
    const _summaryOnly = !!sessionStorage.getItem('foqal_summary_only');
    if (_summaryOnly) {
      sessionStorage.removeItem('foqal_summary_only');
      S.summaryOnly    = true;
      S.summaryLoading = true;
    }

    // Read preview row status — if summary already exists, skip upload form immediately
    const _prev = JSON.parse(sessionStorage.getItem('foqal_patient_preview') || 'null');
    const _prevStatus = _prev?.status || '';
    const _summaryExists = _summaryOnly
      || ['Awaiting Review','Signed Off'].includes(_prevStatus);

    if (_prev && _prev.hadm_id === _hadmId) {
      const _prevDx = _prev._diagnosis || _prev.diagnosis || '';
      S.patient   = { full_name: _prev._name, anchor_age: _prev._age, gender: _prev._gender, admission_diagnosis: _prevDx };
      S.admission = { hadm_id: _hadmId, admission_type: _prev.admission_type, admit_time: _prev.admit_time, diagnosis: _prevDx };
      S.encStatus = _prevStatus; // set immediately so toasts appear on first render
      if (_prevStatus === 'Processing') {
        S.genScreen   = 'generating';
        S.genProgress = parseInt(sessionStorage.getItem('foqal_gen_progress_' + _hadmId) || '30');
      }
      if (_summaryExists) S.summaryLoading = true; // show spinner, not upload form, while summary loads
      render();
      if (!_summaryExists && _prevStatus !== 'Processing') Object.keys(LAZY).forEach(tab => lazyLoad(tab));
    }

    // Fire encounter + revision_state in parallel immediately — both start at the same time
    // so the yellow banner appears as soon as both fast DB calls return, not sequentially.
    const _encPromise      = apiFetch(`${_API}/api/encounters/${_hadmId}/encounter`).catch(() => null);
    const _revStatePromise = fetch(`${_API}/api/encounters/${_hadmId}/revision_state`).then(r => r.ok ? r.json() : null).catch(() => null);

    // Show status pill the moment encounter resolves
    _encPromise.then(enc => {
      if (!enc || !enc.id) return;
      S.encId = enc.id; S.encStatus = enc.status;
      fetch(`${_API}/api/encounters/${enc.id}/files`)
        .then(r => r.ok ? r.json() : null)
        .then(fd => { const f = fd && (Array.isArray(fd) ? fd : fd.files); if (f) { S.prevFiles = f; render(); } })
        .catch(() => {});
      if (enc.status === 'Processing') {
        S.genScreen = 'generating';
        _startProcessingPoll();
      } else if (!['Ready for Review','Awaiting Review','Signed Off','Processing'].includes(enc.status)) {
        // Pre-warm Pass 1 in background — by the time user clicks Generate, LLM fact
        // extraction will already be cached, cutting generation time roughly in half.
        // Skip when already Processing — generation is running, no need to race it.
        fetch(`${_API}/api/encounters/${_hadmId}/precompute`, {method:'POST',
          headers:{'Authorization':'Bearer ' + (sessionStorage.getItem('foqal_token')||'')}
        }).catch(() => {});
      }
      render();
    }).catch(() => {});

    // Show full yellow banner once both arrive (parallel, not sequential)
    Promise.all([_encPromise, _revStatePromise]).then(([enc, rsd]) => {
      if (!enc || !enc.id) return;
      if (rsd && (enc.status === 'Revision Requested' || enc.status === 'Files Ready')) {
        S.revisionState = rsd; render();
      }
      if (enc.status === 'Amendment Requested') {
        apiFetch(`${_API}/api/amendments/${enc.id}`)
          .then(d => { if (d && d.amendment) { S.amendmentState = d.amendment; render(); } })
          .catch(() => {});
      }
    }).catch(() => {});

    try {
      const data = await apiFetch(`${_DATA}/api/patient/${_hadmId}/display`, 90000);
      S.patient    = data.patient   || S.patient || {subject_id: _hadmId};
      S.admission  = data.admission || S.admission || null;
      S.diagnoses  = data.diagnoses  || [];
      S.procedures = data.procedures || [];
      S.micro      = data.microbiologyevents || data.microbiology || [];
      S.icuEvts    = data.icu_events || [];
      S.transfers  = data.transfers    || [];
      S.icuStays   = data.icustays || data.icu_stays || [];
      S.displayLoaded = true;
      // Eagerly pre-load all lazy tabs — for BQ-provisioned patients they hit
      // Cloud SQL (data_fetch_status='fetched') so this is fast and populates
      // all badge counts immediately without the user having to click each tab.
      Object.keys(LAZY).forEach(t => { setTimeout(() => lazyLoad(t), 0); });
    } catch (displayErr) {
      // Patient not yet in active directory (ETL hasn't run) — continue with
      // whatever partial data we already have from the encounter cache (_prev).
      // The upload form will still work; clinical detail tabs will be empty.
      S.displayLoaded = true;
      S.displayLoadErr = displayErr.message || "Clinical data not yet loaded";
      // Retry once after 8s in case it was a cold-start timeout
      setTimeout(async () => {
        try {
          const _rd = await apiFetch(`${_DATA}/api/patient/${_hadmId}/display`, 90000);
          S.patient    = _rd.patient    || S.patient || {subject_id: _hadmId};
          S.admission  = _rd.admission  || S.admission || null;
          S.diagnoses  = _rd.diagnoses  || S.diagnoses  || [];
          S.procedures = _rd.procedures || S.procedures || [];
          S.micro      = _rd.microbiologyevents || _rd.microbiology || S.micro || [];
          S.icuEvts    = _rd.icu_events || S.icuEvts  || [];
          S.transfers  = _rd.transfers  || S.transfers || [];
          S.icuStays   = _rd.icustays   || _rd.icu_stays || S.icuStays || [];
          S.displayLoadErr = null;
          render();
        } catch(_) {}
      }, 8000);
    }
    if (!_summaryExists) {
      render();
      Object.keys(LAZY).forEach(tab => lazyLoad(tab));
    }

    // Encounter result — already handled by the .then() above; just ensure encId is set
    const enc = await _encPromise;
    if (enc && enc.id && !S.encId) { S.encId = enc.id; S.encStatus = enc.status; }

    // Summary + files in parallel — summary renders immediately when ready
    await Promise.allSettled([
      (async () => {
        if (!S.encId) { S.summaryLoading = false; render(); return; }
        try {
          const sumResp = await fetch(`${_API}/api/encounters/${S.encId}/summary`);
          if (sumResp.ok) {
            const sum = await sumResp.json();
            if (sum && sum.content) {
              S.summary    = sum.content;
              S.genDone    = true;
              S.reviewSent = ['Awaiting Review', 'Signed Off'].includes(S.encStatus);
              // Populate gap counts so the gate widget renders correctly
              S.gapT1   = sum.gap_t1  || 0;
              S.gapT2   = sum.gap_t2  || 0;
              S.gapT3   = sum.gap_t3  || 0;
              S.gapRows = Array.isArray(sum.gap_rows) ? sum.gap_rows : [];
              // Fall back to localStorage if DB hasn't persisted gap counts yet
              if (!S.gapT1 && !S.gapT2 && !S.gapT3) {
                try {
                  const _gcRaw = localStorage.getItem('gap_counts_' + _hadmId);
                  if (_gcRaw) { const _gc = JSON.parse(_gcRaw); S.gapT1 = _gc.t1||0; S.gapT2 = _gc.t2||0; S.gapT3 = _gc.t3||0; }
                } catch(_e) {}
              }
              // Do NOT overwrite genScreen if we are currently generating (doRegenerate path).
              // proceedGenerate() owns S.genScreen during active SSE streaming.
              if (!S.generating) {
                if (S.encStatus !== 'Processing') S.genScreen = null;
                if (_gotoSummary) {
                  // Came from "Open Summary →" banner or returning after generation:
                  // show the success card first so resident sees T1/T2/T3 stats.
                  S.genScreen = 'done';
                } else if (_summaryExists && !['Revision Requested','Amendment Requested'].includes(S.encStatus) && !S.userClosedSummary) {
                  S.summaryView = true;
                }
              }
            }
          }
        } catch {}
        S.summaryLoading = false;
        // Safety net: if the backend finished while we were away but the summary fetch
        // above returned empty, the generating card would stay stuck forever.
        // Clear it for any non-Processing status — but only if we are NOT actively
        // streaming (proceedGenerate sets S.generating=true for the SSE session).
        if (!S.generating && S.genScreen === 'generating' && S.encStatus && S.encStatus !== 'Processing') {
          S.genScreen = null;
        }
        render();
        // Auto-print if resident clicked PDF from dashboard
        if (S.summaryView && sessionStorage.getItem('foqal_auto_print') === '1') {
          sessionStorage.removeItem('foqal_auto_print');
          setTimeout(() => window.print(), 600);
        }
        // Start lazy tabs after summary is shown (lower priority — tab data enhances not blocks)
        if (_summaryExists || _gotoSummary) Object.keys(LAZY).forEach(tab => lazyLoad(tab));
      })(),
      (async () => {
        if (!S.encId) return;
        try {
          const r = await fetch(`${_API}/api/encounters/${S.encId}/files`);
          if (r.ok) { const d = await r.json(); S.prevFiles = d.files || []; }
        } catch {}
      })(),
      (async () => {
        try {
          const d = await apiFetch(`${_API}/api/encounters/${_hadmId}/uploaded_clinical_data`, 30000);
          if (d) { S.uploadedRows = d; render(); }
        } catch {}
      })(),
    ]);

    // Safety: if the backend finished while we were away but the summary fetch
    // above returned empty, the generating card would stay stuck forever.
    // Clear it for any non-Processing status — poll (line ~2020) covers the
    // still-running case and has its own genScreen cleanup.
    if (S.genScreen === 'generating' && S.encStatus && S.encStatus !== 'Processing') {
      S.genScreen = null;
    }

    render();

  } catch(err) {
    document.getElementById('main-content').innerHTML = `
      <div style="padding:40px;text-align:center;color:var(--red)">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">Failed to load patient data</div>
        <div style="font-size:13px;color:var(--ink3)">${err.message}</div>
        <button class="btn-sec" onclick="goBack()" style="margin-top:16px">← Back to Dashboard</button>
      </div>`;
  }
})();
</script>
</body>
</html>
