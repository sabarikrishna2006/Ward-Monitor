server {
    listen 80;
    server_name _;

    # Frontend — served by Vite dev server (npm run dev)
    location / {
        proxy_pass         http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 60s;
    }

    # Main API (port 6017) — auth, encounters, generate summary
    location /api-proxy/ {
        rewrite            ^/api-proxy/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:6017;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Data server (port 6020) — MIMIC browse, patient data, cache
    location /data-proxy/ {
        rewrite            ^/data-proxy/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:6020;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
