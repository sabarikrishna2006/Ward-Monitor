<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ward Monitor{% endblock %} — CDS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar d-flex flex-column flex-shrink-0">
            <div class="sidebar-brand">
                <span class="brand-icon">🏥</span>
                <span class="brand-text">Ward Monitor</span>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">WARD</div>
                <div class="sidebar-value active-ward">4B — General Medicine</div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">SHIFT</div>
                <div class="sidebar-value" id="shift-info">Night Shift</div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">TIME</div>
                <div class="sidebar-value sidebar-clock" id="clock">--:--:--</div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">BEDS</div>
                <div class="sidebar-value">12 beds active</div>
            </div>
            <div class="mt-auto sidebar-section">
                <div class="connection-status" id="connection-status">
                    <span class="status-dot connected"></span>
                    <span>Connected</span>
                </div>
                <div class="sidebar-label mt-2">LAST SYNC</div>
                <div class="sidebar-value" id="last-sync">—</div>
            </div>
        </nav>

        <!-- Main content -->
        <main class="main-content">
            <!-- Top bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <h1 class="top-bar-title">{% block page_title %}Ward 4B — General Medicine{% endblock %}</h1>
                    <span class="top-bar-meta" id="top-bar-meta">· Night Shift · <span id="top-clock">--:--</span></span>
                </div>
                <div class="top-bar-right">
                    <div class="alert-count" id="alert-count">
                        <span class="alert-badge" id="alert-badge">0</span> alerts
                    </div>
                </div>
            </header>

            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/sparkline.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
