# NEWS2 Scoring Thresholds
# Default: UK NEWS2 (Royal College of Physicians, 2017)
# Indian set: fill from Priya et al. (2023) once paper is sourced.
#
# active_set: which set calculate_news2() uses at runtime.
# Switch to "india_news2" after validating values from the paper.
active_set: "uk_news2"

uk_news2:
  resp_rate:
    - {max:  8, score: 3}
    - {min:  9, max: 11, score: 1}
    - {min: 12, max: 20, score: 0}
    - {min: 21, max: 24, score: 2}
    - {min: 25, score: 3}

  # SpO2 Scale 1 — standard (non-hypercapnic)
  spo2_scale1:
    - {max: 91, score: 3}
    - {min: 92, max: 93, score: 2}
    - {min: 94, max: 95, score: 1}
    - {min: 96, score: 0}

  # SpO2 Scale 2 — for hypercapnic respiratory failure only
  # If on Oxygen: ≥97%=+3, 95-96%=+2, 93-94%=+1
  spo2_scale2:
    - {max: 83, score: 3}
    - {min: 84, max: 85, score: 2}
    - {min: 86, max: 87, score: 1}
    - {min: 88, max: 92, score: 0}
    # on Oxygen bonuses handled in code (not here) per RCP spec

  sbp:
    - {max:  90, score: 3}
    - {min:  91, max: 100, score: 2}
    - {min: 101, max: 110, score: 1}
    - {min: 111, max: 219, score: 0}
    - {min: 220, score: 3}   # India calibration: hypertensive crisis threshold

  heart_rate:
    - {max:  40, score: 3}
    - {min:  41, max:  50, score: 1}
    - {min:  51, max:  90, score: 0}
    - {min:  91, max: 110, score: 1}
    - {min: 111, max: 130, score: 2}
    - {min: 131, score: 3}

  temperature:
    - {max: 35.0, score: 3}
    - {min: 35.1, max: 36.0, score: 1}
    - {min: 36.1, max: 38.0, score: 0}
    - {min: 38.1, max: 39.0, score: 1}
    - {min: 39.1, score: 2}

# Indian NEWS2 — PLACEHOLDER
# SOURCE REQUIRED: Priya et al. (2023) — do not use without verifying the paper.
# Tentative differences (not validated):
#   SpO2 scale 1: ~1% shift lower for Indian population mean SpO2
#   Temperature: 37.5°C as fever onset vs 38.1°C (some Indian HF guidelines)
#   RR / HR / SBP: no known validated change from UK values
india_news2:
  resp_rate:
    - {max:  8, score: 3}
    - {min:  9, max: 11, score: 1}
    - {min: 12, max: 20, score: 0}
    - {min: 21, max: 24, score: 2}
    - {min: 25, score: 3}

  spo2_scale1:
    # PLACEHOLDER — update from Priya et al. (2023)
    - {max: 92, score: 3}
    - {min: 93, max: 94, score: 2}
    - {min: 95, max: 96, score: 1}
    - {min: 97, score: 0}

  spo2_scale2:
    - {max: 83, score: 3}
    - {min: 84, max: 85, score: 2}
    - {min: 86, max: 87, score: 1}
    - {min: 88, max: 92, score: 0}

  sbp:
    - {max:  90, score: 3}
    - {min:  91, max: 100, score: 2}
    - {min: 101, max: 110, score: 1}
    - {min: 111, max: 219, score: 0}
    - {min: 220, score: 3}

  heart_rate:
    - {max:  40, score: 3}
    - {min:  41, max:  50, score: 1}
    - {min:  51, max:  90, score: 0}
    - {min:  91, max: 110, score: 1}
    - {min: 111, max: 130, score: 2}
    - {min: 131, score: 3}

  temperature:
    # PLACEHOLDER — 37.5°C fever onset (vs 38.1°C UK)
    - {max: 35.0, score: 3}
    - {min: 35.1, max: 36.0, score: 1}
    - {min: 36.1, max: 37.5, score: 0}
    - {min: 37.5, max: 39.0, score: 1}
    - {min: 39.1, score: 2}
